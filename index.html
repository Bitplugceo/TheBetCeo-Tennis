<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Unified Diff Patcher Engine</title>

<style>
body{
  margin:0;
  background:#0d1117;
  color:#c9d1d9;
  font-family:system-ui;
  padding:20px;
}

.container{
  max-width:1000px;
  margin:auto;
}

textarea{
  width:100%;
  height:200px;
  margin:10px 0;
  background:#161b22;
  color:#e6edf3;
  border:1px solid #30363d;
  padding:10px;
  font-family:monospace;
}

button{
  padding:10px 15px;
  margin-right:10px;
  background:#238636;
  border:none;
  color:white;
  cursor:pointer;
}

button:hover{opacity:.9}

#status{
  margin-top:10px;
  padding:10px;
  border:1px solid #30363d;
}
pre{
  background:#010409;
  padding:10px;
  overflow:auto;
}
</style>
</head>

<body>
<div class="container">

<h2>Unified Diff Patch Engine</h2>

<textarea id="master" placeholder="Master code (text)..."></textarea>
<textarea id="diff" placeholder="Paste unified diff here..."></textarea>

<button onclick="applyDiff()">Apply Patch</button>
<button onclick="undo()">Undo</button>

<div id="status"></div>

<h3>Output</h3>
<pre id="output"></pre>

</div>

<script>
"use strict";

const state = {
  history: [],
  last: null
};

function setStatus(msg){
  document.getElementById("status").textContent = msg;
}

function splitLines(str){
  return str.replace(/\r\n/g,"\n").split("\n");
}

/**
 * Parse unified diff
 */
function parseUnifiedDiff(text){
  const lines = splitLines(text);

  const hunks = [];
  let hunk = null;

  for(const line of lines){
    if(line.startsWith("@@")){
      const match = line.match(/@@ -(\d+),?(\d*) \+(\d+),?(\d*) @@/);
      if(!match) continue;

      hunk = {
        oldStart: parseInt(match[1]),
        oldCount: parseInt(match[2] || "1"),
        newStart: parseInt(match[3]),
        newCount: parseInt(match[4] || "1"),
        lines: []
      };

      hunks.push(hunk);
    } else if(hunk){
      hunk.lines.push(line);
    }
  }

  return hunks;
}

/**
 * Apply hunks transactionally
 */
function applyHunks(originalLines, hunks){
  let working = [...originalLines];

  for(const hunk of hunks){
    let idx = hunk.oldStart - 1;

    const newSegment = [];
    const removedSegment = [];

    for(const line of hunk.lines){
      if(line.startsWith("-")){
        removedSegment.push(line.slice(1));
      } 
      else if(line.startsWith("+")){
        newSegment.push(line.slice(1));
      } 
      else if(line.startsWith(" ")){
        idx++;
      }
    }

    // validation: ensure match
    const actualSlice = working.slice(hunk.oldStart - 1, hunk.oldStart - 1 + removedSegment.length);

    const match =
      JSON.stringify(actualSlice) === JSON.stringify(removedSegment);

    if(!match){
      return {
        success:false,
        error:`Hunk mismatch at line ${hunk.oldStart}`
      };
    }

    // apply
    working.splice(
      hunk.oldStart - 1,
      removedSegment.length,
      ...newSegment
    );
  }

  return { success:true, result:working };
}

/**
 * Main apply
 */
function applyDiff(){
  const masterText = document.getElementById("master").value;
  const diffText = document.getElementById("diff").value;

  if(!masterText || !diffText){
    setStatus("Missing input");
    return;
  }

  const originalLines = splitLines(masterText);
  const hunks = parseUnifiedDiff(diffText);

  if(!hunks.length){
    setStatus("No valid diff hunks found");
    return;
  }

  // save undo
  state.history.push(masterText);

  const result = applyHunks(originalLines, hunks);

  if(!result.success){
    state.history.pop();
    setStatus("Patch failed: " + result.error);
    return;
  }

  const output = result.result.join("\n");

  document.getElementById("output").textContent = output;
  document.getElementById("master").value = output;

  setStatus("Patch applied successfully");
}

/**
 * Undo system
 */
function undo(){
  if(!state.history.length){
    setStatus("Nothing to undo");
    return;
  }

  const prev = state.history.pop();
  document.getElementById("master").value = prev;
  document.getElementById("output").textContent = prev;

  setStatus("Undo successful");
}
</script>

</body>
</html>
