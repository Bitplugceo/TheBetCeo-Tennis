<script>
(function () {
  "use strict";
  const BUILD_ID = "tt_v2_exact_ui_20260924";
  const TT_MARKETS = Object.freeze(["game1_total", "match_total"]);
  const TRACKER_SETTLED_VISIBLE_MS = 10 * 60 * 60 * 1000;
  const STORE = {
    picks: "tt_engine_tracker_picks",
    deleted: "tt_engine_tracker_deleted",
    worker: "tt_engine_worker_url",
    lineMem: "tt_engine_line_memory",
  };
  window.TT_PREDICTION_STUB = true;
  window.TT_BUILD_ID = BUILD_ID;

  const $ = (id) => document.getElementById(id);
  const logLines = [];

  function engineDebug(msg, extra) {
    const line = "[" + new Date().toISOString() + "] " + msg + (extra ? " " + JSON.stringify(extra) : "");
    logLines.push(line);
    if (logLines.length > 200) logLines.shift();
    const el = $("debugLog");
    if (el) el.textContent = logLines.slice(-80).join("\n");
    try { console.log("[TT]", msg, extra || ""); } catch (_e) {}
  }

  function lsGet(key, fallback) {
    try {
      const v = localStorage.getItem(key);
      if (v == null) return fallback;
      return JSON.parse(v);
    } catch (_e) { return fallback; }
  }
  function lsSet(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (_e) { return false; }
  }

  /* ---- Accordion (BB makeSectionsCollapsible) ---- */
  function makeSectionsCollapsible() {
    document.querySelectorAll(".section").forEach((section) => {
      if (section.dataset.collapsibleReady === "1") return;
      const heading = section.querySelector("h3");
      if (!heading) return;
      section.dataset.collapsibleReady = "1";
      const titleHTML = heading.innerHTML;
      const body = document.createElement("div");
      body.className = "section-body";
      const children = [...section.childNodes];
      children.forEach((node) => {
        if (node !== heading) body.appendChild(node);
      });
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "section-toggle";
      const titleSpan = document.createElement("span");
      titleSpan.className = "toggle-title";
      titleSpan.innerHTML = titleHTML;
      const iconSpan = document.createElement("span");
      iconSpan.className = "toggle-icon";
      iconSpan.innerHTML = "&#9662;";
      btn.appendChild(titleSpan);
      btn.appendChild(iconSpan);
      btn.addEventListener("click", () => {
        section.classList.toggle("collapsed");
      });
      section.innerHTML = "";
      section.appendChild(btn);
      section.appendChild(body);
      if (!section.classList.contains("collapsed") && section.id !== "leagueSection") {
        section.classList.add("collapsed");
      }
    });
    // League Tier starts open (screenshot)
    const league = $("leagueSection");
    if (league) league.classList.remove("collapsed");
  }

  function accordionOpen(id) {
    const s = $(id);
    if (s) s.classList.remove("collapsed");
  }

  function setStatus(msg, kind) {
    const el = $("statusLine");
    if (!el) return;
    el.textContent = msg || "";
    el.style.color = kind === "err" ? "#c91920" : kind === "ok" ? "#3a9c35" : "var(--muted)";
  }

  function parseSeries(str) {
    if (!str || !String(str).trim()) return [];
    return String(str).split(/[,\s]+/).map((x) => parseFloat(x)).filter((n) => !isNaN(n));
  }
  function avg(arr) {
    if (!arr.length) return null;
    return arr.reduce((a, b) => a + b, 0) / arr.length;
  }

  /* ---- Stub prediction math (0.0u, never crash) ---- */
  function runEngine() {
    try {
      const g1Line = parseFloat(($("game1Market") || {}).value);
      const mtLine = parseFloat(($("matchTotalMarket") || {}).value);
      const aG1 = parseSeries(($("aGame1Pts") || {}).value);
      const bG1 = parseSeries(($("bGame1Pts") || {}).value);
      const aMt = parseSeries(($("aMatchPts") || {}).value);
      const bMt = parseSeries(($("bMatchPts") || {}).value);

      const projG1 = (avg(aG1) != null || avg(bG1) != null)
        ? ((avg(aG1) || 19.5) + (avg(bG1) || 19.5)) / 2
        : null;
      const projMt = (avg(aMt) != null || avg(bMt) != null)
        ? ((avg(aMt) || 72) + (avg(bMt) || 72)) / 2
        : null;

      const rows = [];
      function stubRow(name, key, line, proj) {
        const hasLine = !isNaN(line);
        const projection = proj != null ? proj.toFixed(1) : "—";
        const edge = hasLine && proj != null ? (proj - line).toFixed(1) : "0.0";
        const side = hasLine && proj != null ? (proj > line ? "OVER" : proj < line ? "UNDER" : "NO PLAY") : "NO PLAY";
        const cls = side === "OVER" ? "pred-over" : side === "UNDER" ? "pred-under" : "pred-none";
        rows.push({
          name, key, line: hasLine ? line : null, projection, edge,
          grade: "STUB", units: "0.0u", side, cls,
        });
      }
      stubRow("1st Game Total", "game1_total", g1Line, projG1);
      stubRow("Match Total Points", "match_total", mtLine, projMt);

      const tbody = $("resultsBody");
      const table = $("results");
      if (tbody && table) {
        tbody.innerHTML = rows.map((r) =>
          "<tr><td>" + r.name + "</td><td>" + r.projection +
          "</td><td>" + r.edge + "</td><td>" + r.grade +
          '</td><td class="' + r.cls + '">' + r.side + " · " + r.units + "</td></tr>"
        ).join("");
        table.style.display = "";
      }
      window.__ttLastRows = rows;
      const trackBtn = $("trackPickBtn");
      if (trackBtn) trackBtn.style.display = "";
      setStatus("Run complete (stub model · 0.0u) · " + BUILD_ID, "ok");
      engineDebug("runEngine stub ok", { rows: rows.length });
      accordionOpen("marketSection");
    } catch (err) {
      setStatus("Run error: " + (err && err.message ? err.message : String(err)), "err");
      engineDebug("runEngine crash caught", { error: String(err) });
    }
  }

  function clearAll() {
    [
      "game1Market", "matchTotalMarket", "playerAName", "playerBName",
      "aGame1Pts", "aMatchPts", "bGame1Pts", "bMatchPts", "h2hGame1", "h2hMatch",
    ].forEach((id) => { const el = $(id); if (el) el.value = ""; });
    const league = $("leagueSelect"); if (league) league.value = "";
    const fix = $("fixtureSelect"); if (fix) fix.innerHTML = '<option value="">- Fixtures -</option>';
    const table = $("results"); if (table) table.style.display = "none";
    const tbody = $("resultsBody"); if (tbody) tbody.innerHTML = "";
    const trackBtn = $("trackPickBtn"); if (trackBtn) trackBtn.style.display = "none";
    window.__ttLastRows = null;
    setStatus("Cleared", "ok");
  }

  function copyInputs() {
    const parts = [
      "TheBetCeo TT Inputs",
      "League: " + (($("leagueSelect") || {}).value || ""),
      "Player A: " + (($("playerAName") || {}).value || ""),
      "Player B: " + (($("playerBName") || {}).value || ""),
      "1st Game Total: " + (($("game1Market") || {}).value || ""),
      "Match Total: " + (($("matchTotalMarket") || {}).value || ""),
      "A G1: " + (($("aGame1Pts") || {}).value || ""),
      "A MT: " + (($("aMatchPts") || {}).value || ""),
      "B G1: " + (($("bGame1Pts") || {}).value || ""),
      "B MT: " + (($("bMatchPts") || {}).value || ""),
      "H2H G1: " + (($("h2hGame1") || {}).value || ""),
      "H2H MT: " + (($("h2hMatch") || {}).value || ""),
    ];
    const text = parts.join("\n");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => setStatus("Inputs copied", "ok"))
        .catch(() => setStatus("Copy blocked", "err"));
    } else {
      setStatus("Clipboard unavailable", "err");
    }
  }

  function copyAudit() {
    const rows = window.__ttLastRows || [];
    const text = "TheBetCeo TT Audit\n" + BUILD_ID + "\n" +
      rows.map((r) => r.name + " | proj " + r.projection + " | edge " + r.edge + " | " + r.side + " " + r.units).join("\n");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => setStatus("Audit copied", "ok"))
        .catch(() => setStatus("Copy blocked", "err"));
    }
  }

  /* ---- Tracker ---- */
  function loadPicks() { return lsGet(STORE.picks, []) || []; }
  function savePicks(arr) { return lsSet(STORE.picks, arr); }
  function loadDeleted() { return lsGet(STORE.deleted, []) || []; }
  function saveDeleted(arr) { return lsSet(STORE.deleted, arr); }

  let trackerTab = "active";

  function openTracker() {
    const m = $("trackerModal");
    if (!m) return;
    m.classList.add("open");
    m.setAttribute("aria-hidden", "false");
    document.body.classList.add("tracker-open");
    renderTracker();
  }
  function closeTracker() {
    const m = $("trackerModal");
    if (!m) return;
    m.classList.remove("open");
    m.setAttribute("aria-hidden", "true");
    document.body.classList.remove("tracker-open");
  }

  function trackCurrentPick() {
    const rows = window.__ttLastRows || [];
    if (!rows.length) { setStatus("Run first", "err"); return; }
    const a = (($("playerAName") || {}).value || "Player A").trim();
    const b = (($("playerBName") || {}).value || "Player B").trim();
    const league = (($("leagueSelect") || {}).value || "").trim();
    const picks = loadPicks();
    rows.forEach((r) => {
      if (r.line == null) return;
      picks.unshift({
        id: "tt_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
        createdAt: Date.now(),
        league, playerA: a, playerB: b,
        market: r.key, marketName: r.name,
        line: r.line, side: r.side, units: 0,
        status: "active", settledAt: null, result: null,
      });
    });
    savePicks(picks);
    setStatus("Tracked " + rows.filter((r) => r.line != null).length + " pick(s)", "ok");
    openTracker();
  }

  function settlePick(id, result) {
    const picks = loadPicks();
    const p = picks.find((x) => x.id === id);
    if (!p) return;
    p.status = "settled";
    p.result = result;
    p.settledAt = Date.now();
    savePicks(picks);
    renderTracker();
  }

  function deletePick(id) {
    let picks = loadPicks();
    const p = picks.find((x) => x.id === id);
    if (!p) return;
    picks = picks.filter((x) => x.id !== id);
    savePicks(picks);
    const del = loadDeleted();
    del.unshift(Object.assign({}, p, { deletedAt: Date.now() }));
    saveDeleted(del.slice(0, 200));
    renderTracker();
  }

  function renderTracker() {
    const list = $("trackerList");
    const empty = $("trackerEmpty");
    if (!list) return;
    const now = Date.now();
    let picks = loadPicks();
    let items = [];
    if (trackerTab === "active") {
      items = picks.filter((p) => p.status === "active");
    } else if (trackerTab === "archive") {
      items = picks.filter((p) => p.status === "settled" && p.settledAt && (now - p.settledAt) < TRACKER_SETTLED_VISIBLE_MS);
    } else {
      items = loadDeleted();
    }
    if (!items.length) {
      list.innerHTML = "";
      if (empty) { empty.style.display = ""; empty.textContent = "No tracked picks yet."; }
      return;
    }
    if (empty) empty.style.display = "none";
    list.innerHTML = items.map((p) => {
      const title = (p.playerA || "?") + " vs " + (p.playerB || "?");
      const meta = (p.league || "—") + " · " + (p.marketName || p.market) + " " +
        (p.side || "") + " " + (p.line != null ? p.line : "") +
        (p.result ? " · " + p.result : "") + " · 0.0u";
      let actions = "";
      if (trackerTab === "active") {
        actions = '<button type="button" data-act="won" data-id="' + p.id + '">Won</button>' +
          '<button type="button" data-act="lost" data-id="' + p.id + '">Lost</button>' +
          '<button type="button" data-act="push" data-id="' + p.id + '">Push</button>' +
          '<button type="button" data-act="del" data-id="' + p.id + '">Delete</button>';
      }
      return '<div class="tracker-card"><div class="tc-title">' + title +
        '</div><div class="tc-meta">' + meta + '</div>' +
        (actions ? '<div class="tc-actions">' + actions + "</div>" : "") + "</div>";
    }).join("");
    list.querySelectorAll("button[data-act]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-id");
        const act = btn.getAttribute("data-act");
        if (act === "del") deletePick(id);
        else settlePick(id, act);
      });
    });
  }

  /* ---- Military Raid ---- */
  function runMilitaryRaid() {
    const now = Date.now();
    let picks = loadPicks();
    const kept = [];
    const pruned = [];
    picks.forEach((p) => {
      if (p.status === "settled" && p.settledAt && (now - p.settledAt) >= TRACKER_SETTLED_VISIBLE_MS) {
        pruned.push(p);
      } else kept.push(p);
    });
    savePicks(kept);
    let del = loadDeleted();
    del = del.filter((p) => !p.deletedAt || (now - p.deletedAt) < TRACKER_SETTLED_VISIBLE_MS * 3);
    saveDeleted(del);
    engineDebug("military raid", { pruned: pruned.length, kept: kept.length });
    const toast = $("raidToast");
    if (toast) {
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1800);
    }
    renderTracker();
    closeDebug();
    openTracker();
    setStatus("Military raid complete", "ok");
  }

  /* ---- Debug ---- */
  function openDebug() {
    const o = $("debugOverlay");
    if (!o) return;
    o.classList.add("open");
    o.setAttribute("aria-hidden", "false");
    const inp = $("workerUrlInput");
    if (inp) {
      try { inp.value = localStorage.getItem(STORE.worker) || ""; } catch (_e) {}
    }
    const el = $("debugLog");
    if (el) el.textContent = logLines.slice(-80).join("\n") || "(empty)";
  }
  function closeDebug() {
    const o = $("debugOverlay");
    if (!o) return;
    o.classList.remove("open");
    o.setAttribute("aria-hidden", "true");
  }

  function workerBase() {
    try { return (localStorage.getItem(STORE.worker) || "").replace(/\/+$/, ""); }
    catch (_e) { return ""; }
  }

  /* ---- Autofetch (Setka via worker) ---- */
  async function autofetchFixtures() {
    const league = (($("leagueSelect") || {}).value || "").toLowerCase();
    const status = $("fixtureStatus");
    const sel = $("fixtureSelect");
    if (!league) { setStatus("Select a league first", "err"); return; }
    if (status) status.textContent = "Fetching…";
    try {
      if (league === "setka") {
        const wb = workerBase();
        if (!wb) {
          if (status) status.textContent = "Set worker URL in Debug (🤖) for Setka.";
          setStatus("Worker URL required for Setka", "err");
          openDebug();
          return;
        }
        const today = new Date();
        const y = today.getFullYear();
        const m = String(today.getMonth() + 1).padStart(2, "0");
        const d = String(today.getDate()).padStart(2, "0");
        const dateStr = y + "-" + m + "-" + d;
        const url = wb + "/tt/setka/tournaments?date=" + encodeURIComponent(dateStr);
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const matches = [];
        const tournaments = Array.isArray(data) ? data : (data.tournaments || data.items || []);
        tournaments.forEach((t) => {
          const ms = t.matches || t.Matches || [];
          ms.forEach((m) => {
            const p1 = (m.player1 && (m.player1.fullName || m.player1.name)) || m.p1Name || "P1";
            const p2 = (m.player2 && (m.player2.fullName || m.player2.name)) || m.p2Name || "P2";
            matches.push({
              id: String(m.id || matches.length),
              label: p1 + " vs " + p2,
              playerA: p1, playerB: p2,
            });
          });
        });
        if (sel) {
          sel.innerHTML = '<option value="">- Fixtures (' + matches.length + ") -</option>" +
            matches.slice(0, 80).map((m, i) =>
              '<option value="' + i + '">' + m.label.replace(/</g, "") + "</option>"
            ).join("");
          sel._ttFixtures = matches;
        }
        if (status) status.textContent = matches.length + " Setka fixtures (" + dateStr + ")";
        setStatus("Autofetch ok", "ok");
        engineDebug("setka autofetch", { count: matches.length });
      } else if (league === "wtt" || league === "wtt_contender" || league === "wtt_champions") {
        if (status) status.textContent = "WTT autofetch: open Debug for Worker; CMS stub — pick players manually for now.";
        setStatus("WTT fixtures: manual / Worker TBD", "ok");
        engineDebug("wtt autofetch stub", { league });
      } else {
        if (status) status.textContent = "No autofetch for this league (manual entry).";
        setStatus("Manual league — enter players & lines", "ok");
      }
    } catch (err) {
      if (status) status.textContent = "Fetch failed: " + (err.message || err);
      setStatus("Autofetch failed", "err");
      engineDebug("autofetch error", { error: String(err) });
    }
  }

  function onFixturePick() {
    const sel = $("fixtureSelect");
    if (!sel || !sel._ttFixtures) return;
    const idx = parseInt(sel.value, 10);
    if (isNaN(idx)) return;
    const m = sel._ttFixtures[idx];
    if (!m) return;
    if ($("playerAName")) $("playerAName").value = m.playerA || "";
    if ($("playerBName")) $("playerBName").value = m.playerB || "";
    accordionOpen("marketSection");
  }

  /* ---- Boot ---- */
  function boot() {
    makeSectionsCollapsible();
    const chip = $("buildChip");
    if (chip) chip.textContent = BUILD_ID + " · markets: " + TT_MARKETS.join(", ");
    const dbgBuild = $("dbgBuild");
    if (dbgBuild) dbgBuild.textContent = BUILD_ID;

    $("runBtn") && $("runBtn").addEventListener("click", runEngine);
    $("clearBtn") && $("clearBtn").addEventListener("click", clearAll);
    $("auditCopyBtn") && $("auditCopyBtn").addEventListener("click", copyAudit);
    $("inputsCopyBtn") && $("inputsCopyBtn").addEventListener("click", copyInputs);
    $("trackPickBtn") && $("trackPickBtn").addEventListener("click", trackCurrentPick);
    $("trackerToggleBtn") && $("trackerToggleBtn").addEventListener("click", openTracker);
    $("trackerCloseBtn") && $("trackerCloseBtn").addEventListener("click", closeTracker);
    $("trackerMilitaryRaidBtn") && $("trackerMilitaryRaidBtn").addEventListener("click", runMilitaryRaid);
    $("afdbBtn") && $("afdbBtn").addEventListener("click", openDebug);
    $("predictionsLabelBtn") && $("predictionsLabelBtn").addEventListener("click", () => {
      closeTracker(); closeDebug();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    $("autofetchBtn") && $("autofetchBtn").addEventListener("click", autofetchFixtures);
    $("fixtureSelect") && $("fixtureSelect").addEventListener("change", onFixturePick);

    document.querySelectorAll(".tracker-tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tracker-tab").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        trackerTab = tab.getAttribute("data-tab");
        renderTracker();
      });
    });

    $("dbgSaveWorker") && $("dbgSaveWorker").addEventListener("click", () => {
      const v = (($("workerUrlInput") || {}).value || "").trim().replace(/\/+$/, "");
      try { localStorage.setItem(STORE.worker, v); } catch (_e) {}
      engineDebug("worker saved", { v });
      setStatus("Worker saved", "ok");
    });
    $("dbgHealth") && $("dbgHealth").addEventListener("click", async () => {
      const wb = workerBase();
      if (!wb) { engineDebug("no worker url"); return; }
      try {
        const r = await fetch(wb + "/tt/health");
        const j = await r.json();
        engineDebug("health", j);
      } catch (e) { engineDebug("health fail", { error: String(e) }); }
    });
    $("dbgRaid") && $("dbgRaid").addEventListener("click", runMilitaryRaid);
    $("dbgClearLog") && $("dbgClearLog").addEventListener("click", () => {
      logLines.length = 0;
      if ($("debugLog")) $("debugLog").textContent = "";
    });
    $("dbgClose") && $("dbgClose").addEventListener("click", closeDebug);

    engineDebug("boot", { build: BUILD_ID, markets: TT_MARKETS, leagues: document.querySelectorAll("#leagueSelect option").length });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
