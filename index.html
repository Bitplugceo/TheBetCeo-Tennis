<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Auto-Patcher Studio</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --text: #c9d1d9;
      --accent: #238636;
      --accent-hover: #2ea043;
      --border: #30363d;
      --error: #f85149;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1200px;
    }

    h1 {
      color: #ffffff;
      margin-bottom: 5px;
    }
    
    p.subtitle {
      color: #8b949e;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .box-header {
      background: var(--panel);
      padding: 10px 15px;
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    textarea {
      width: 100%;
      height: 400px;
      background: #010409;
      color: #e6edf3;
      font-family: ui-monospace, monospace;
      font-size: 13px;
      line-height: 1.5;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 0 0 8px 8px;
      resize: vertical;
      box-sizing: border-box;
      outline: none;
    }

    textarea:focus {
      border-color: #58a6ff;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 20px 0;
    }

    button {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    #downloadBtn {
      display: none;
      background: #1f6feb;
    }

    #downloadBtn:hover {
      background: #388bfd;
    }
    
    .status {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🛠️ The Auto-Patcher</h1>
    <p class="subtitle">Feed it the original code and the patch instructions, and let it do the surgery.</p>

    <div class="grid">
      <div>
        <div class="box-header">1. Paste Original File Here</div>
        <textarea id="originalCode" spellcheck="false" placeholder="Paste your massive, main file here..."></textarea>
      </div>

      <div>
        <div class="box-header">2. Paste Patch Instructions Here</div>
        <textarea id="patchCode" spellcheck="false" placeholder="Paste the ---FIND--- and ---REPLACE--- blocks here..."></textarea>
      </div>
    </div>

    <div class="controls">
      <button onclick="applyPatches()">⚙️ Apply Patches</button>
      <button id="downloadBtn" onclick="downloadFile()">📥 Download Fixed File</button>
    </div>

    <div id="statusMsg" class="status"></div>

    <div style="margin-top: 20px;">
      <div class="box-header">3. Preview Output</div>
      <textarea id="outputBox" spellcheck="false" readonly placeholder="Your updated code will appear here..."></textarea>
    </div>
  </div>

  <script>
    function applyPatches() {
      let code = document.getElementById('originalCode').value;
      const patches = document.getElementById('patchCode').value;
      const statusMsg = document.getElementById('statusMsg');

      if (!code.trim() || !patches.trim()) {
        alert("Please paste both the original code and the patch instructions!");
        return;
      }

      // Split the instructions by the FIND delimiter
      const blocks = patches.split('---FIND---');
      let appliedCount = 0;
      let failedCount = 0;

      for (let i = 1; i < blocks.length; i++) {
        const parts = blocks[i].split('---REPLACE---');
        
        if (parts.length === 2) {
          // Clean up leading/trailing white space from the blocks so it matches cleanly
          const findText = parts[0].trim();
          const replaceText = parts[1].trim();

          if (code.includes(findText)) {
            // Swap the old code with the new code
            code = code.split(findText).join(replaceText);
            appliedCount++;
          } else {
            failedCount++;
            console.error("Could not find this exact block of code:\n", findText);
          }
        }
      }

      document.getElementById('outputBox').value = code;

      // Update the UI based on success/failure
      if (failedCount > 0) {
        statusMsg.style.color = "var(--error)";
        statusMsg.innerText = `⚠️ Applied ${appliedCount} patches, but ${failedCount} failed. Check the console for details.`;
      } else {
        statusMsg.style.color = "var(--accent)";
        statusMsg.innerText = `✅ Successfully applied all ${appliedCount} patches!`;
        document.getElementById('downloadBtn').style.display = 'inline-block';
      }
    }

    function downloadFile() {
      const code = document.getElementById('outputBox').value;
      if (!code) return;

      // Create a blob file right in the browser
      const blob = new Blob([code], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      
      // Create a hidden link and click it automatically
      const a = document.createElement('a');
      a.href = url;
      // Prompt for a custom file name or default to patched_file.html
      const fileName = prompt("What do you want to name the downloaded file?", "patched_file.html");
      if (!fileName) return; // Cancelled
      
      a.download = fileName;
      a.click();
      
      // Clean up the URL object
      URL.revokeObjectURL(url);
    }
  </script>

</body>
</html>
