<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TT Engine" />
  <meta name="theme-color" content="#d4af37" />

  <title>Table Tennis Prediction Engine</title>

  <style>
    :root {
      --bg: #efefef;
      --text: #1f2430;
      --panel: #ffffff;
      --panel-border: #dedede;
      --panel-soft: #f6f7f9;
      --panel-soft-2: #eceff3;
      --input-bg: #ffffff;
      --input-border: #cfd4da;
      --table-head: #3a404c;
      --muted: #7b8088;
      --chip-text: #2a2f38;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      --section-toggle-text: #20242c;
      --section-toggle-icon: #d91f26;
      --table-border: #dfe2e7;
      
      --tracker-head-bg: #3a404c;
      --tracker-head-text: #ffffff;
      --tracker-summary-bg: #f6f7f9;
      --tracker-chip-bg: #f6f7f9;
      --tracker-chip-border: #dfe2e7;
      --tracker-strong: #20242c;
      --tracker-subtext: #5a5f6b;
      --tracker-mini-head-bg: #eceff3;
      --tracker-mini-head-text: #2a2f38;
    }

    body.dark-mode {
      --bg: #111;
      --text: #d4af37;
      --panel: #1a1a1a;
      --panel-border: #333;
      --panel-soft: #151515;
      --panel-soft-2: #111;
      --input-bg: #222;
      --input-border: #444;
      --table-head: #111;
      --muted: #9aa0a8;
      --chip-text: #d4af37;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
      --section-toggle-text: #d4af37;
      --section-toggle-icon: #d4af37;
      --table-border: #333;
      
      --tracker-head-bg: #111;
      --tracker-head-text: #d4af37;
      --tracker-summary-bg: #151515;
      --tracker-chip-bg: #151515;
      --tracker-chip-border: #333;
      --tracker-strong: #d4af37;
      --tracker-subtext: #c3aa55;
      --tracker-mini-head-bg: #111;
      --tracker-mini-head-text: #d4af37;
    }

    /* zero border-radius */
    button,
    input,
    select,
    textarea,
    table,
    th,
    td,
    .tracker-report-card {
      border-radius: 0;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    .app-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 10px 0;
      padding-top: max(10px, env(safe-area-inset-top));
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));
      padding-bottom: 10px;
      background: linear-gradient(90deg, #c91920 0%, #d91f26 50%, #b91520 100%);
      color: #fff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
    }

    body.engine-alert {
      background: #2a0608 !important;
    }

    body.engine-alert .app-header {
      background: linear-gradient(90deg, #7b0007 0%, #cf1119 52%, #820008 100%) !important;
    }

    body.engine-alert .section {
      border-color: #d91f26 !important;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.3px;
      color: #fff;
    }

    .brand-right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.85);
      text-transform: uppercase;
    }

    .theme-toggle {
      background: none !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 !important;
      font-size: 11px !important;
      font-weight: 700 !important;
      letter-spacing: 1.5px !important;
      color: rgba(255, 255, 255, 0.85) !important;
      text-transform: uppercase !important;
      cursor: pointer;
    }

    .wrapper {
      max-width: 760px;
      margin: 10px auto;
      padding: 0 10px;
    }

    .section {
      border: 1px solid var(--panel-border);
      background: var(--panel);
      margin: 8px auto;
      box-shadow: var(--shadow);
      color: var(--text);
    }

    .section-toggle {
      width: 100%;
      background: none !important;
      border: none;
      padding: 12px 10px;
      margin: 0 !important;
      color: var(--section-toggle-text) !important;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      cursor: pointer;
    }

    .section-toggle .toggle-title {
      display: block;
      font-weight: 800;
      color: var(--section-toggle-text) !important;
    }

    .section-toggle .toggle-icon {
      font-size: 15px;
      line-height: 1;
      transition: transform 0.2s ease;
      color: var(--section-toggle-icon) !important;
    }

    .section-body {
      padding: 0 10px 10px;
      margin-top: 0;
    }

    .section.collapsed .section-body {
      display: none;
    }

    .section.collapsed .section-toggle .toggle-icon {
      transform: rotate(-90deg);
    }

    h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
    }

    label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
      color: var(--text);
      font-weight: 600;
    }

    h3 span,
    label span,
    small {
      color: var(--muted);
    }

    input,
    select,
    textarea {
      width: 100%;
      max-width: 260px;
      box-sizing: border-box;
      display: block;
      padding: 6px 8px;
      font-size: 12px;
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--input-border);
      margin-bottom: 6px;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--muted);
      opacity: 0.75;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #4aa346;
      box-shadow: 0 0 0 2px rgba(74, 163, 70, 0.12);
    }

    input[type="checkbox"] {
      width: 12px !important;
      height: 12px !important;
      min-width: 12px !important;
      min-height: 12px !important;
      max-width: 12px !important;
      max-height: 12px !important;
      margin-right: 6px !important;
      vertical-align: middle !important;
      appearance: checkbox !important;
      -webkit-appearance: checkbox !important;
    }

    button {
      padding: 8px 16px;
      margin: 6px;
      font-weight: 700;
      background: #313744;
      color: #fff;
      border: none;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.95;
    }

    #fetchStatus {
      font-size: 10px;
      margin-top: 6px;
      min-height: 16px;
    }

    #fetchStatus.ok { color: #2f8f4a; }
    #fetchStatus.err { color: #d92d2a; }
    #fetchStatus.loading { color: #d98a00; }

    .actions {
      text-align: center;
      padding-bottom: 20px;
    }

    #runBtn,
    #clearBtn {
      opacity: 1 !important;
      border: none !important;
      cursor: pointer !important;
      padding: 5px 14px !important;
      font-size: 12px !important;
      font-weight: 700 !important;
      min-width: 0 !important;
      width: auto !important;
    }

    #runBtn {
      background: #3a9c35 !important;
      color: #fff !important;
      box-shadow: 0 2px 8px rgba(58, 156, 53, 0.35) !important;
    }

    #clearBtn {
      background: #3a404c !important;
      color: #fff !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2) !important;
    }

    .table-wrap {
      overflow-x: auto;
      margin: 0 10px 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 12px;
      background: var(--panel) !important;
    }

    th, td {
      border: 1px solid var(--table-border);
      padding: 10px 8px !important;
      text-align: center;
      vertical-align: middle;
    }

    th {
      background: var(--table-head) !important;
      color: #fff !important;
      font-weight: 700;
    }

    td {
      background: var(--panel) !important;
      color: var(--text) !important;
      font-weight: 600 !important;
    }

    .pred-over {
      background: #3a9c35 !important;
      color: #fff !important;
      font-weight: 800 !important;
    }

    .pred-under {
      background: #c91920 !important;
      color: #fff !important;
      font-weight: 800 !important;
    }

    .pred-noplay {
      background: var(--panel-soft-2) !important;
      color: var(--muted) !important;
      font-weight: 700 !important;
    }

    .conf-a {
      background: #2f8f4a !important;
      color: #fff !important;
      font-weight: 800 !important;
    }

    .conf-b {
      background: #4aa346 !important;
      color: #fff !important;
      font-weight: 800 !important;
    }

    .conf-c {
      background: #d98a00 !important;
      color: #fff !important;
      font-weight: 800 !important;
    }

    .conf-none {
      background: var(--panel-soft-2) !important;
      color: var(--muted) !important;
      font-weight: 700 !important;
    }

    .lock {
      font-size: 10px !important;
      display: inline-block;
      vertical-align: middle;
      transform: translateY(-1px);
      margin-left: 4px;
      margin-right: 0;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <span class="brand-name">TheBetCeo TT ⚡️</span>
    <span class="brand-right">
      <button class="theme-toggle" type="button" id="themeToggleBtn" title="Toggle dark/light mode">🏓</button>
      <button class="theme-toggle" type="button" id="afdbBtn" title="Auto-Fetch Debugger" onclick="AFDB.open()">🔬</button>
      PREDICTIONS
    </span>
  </header>

  <div class="wrapper">

    <!-- Section 1: League Tier -->
    <div class="section" id="leagueSection">
      <h3>League Tier</h3>
      <label>Select League</label>
      <select id="leagueSelect" onchange="onLeagueChange()">
        <option value="">- Select League -</option>
        <option value="Setka Cup">Setka Cup</option>
        <option value="TT Cup">TT Cup</option>
      </select>
    </div>

    <!-- Section 2: Player Lookup -->
    <div class="section" id="fetchSection" style="display:none;">
      <h3>🔍 Player Lookup</h3>

      <!-- Player A Controls -->
      <div style="margin-bottom: 12px; border-bottom: 1px dashed var(--panel-border); padding-bottom: 10px;">
        <label>Player A Name (Home)</label>
        <div style="display: flex; gap: 6px; margin-bottom: 6px;">
          <input id="playerAName" placeholder="Player A" style="margin-bottom:0;" />
          <input id="pasteA" placeholder="Paste JSON A" oninput="parseIndividualFailsafe('A')" style="margin:0; padding:6px 8px; font-size:10px; width:100px; flex-shrink:0; background:var(--input-bg); color:var(--text); border:1px solid var(--input-border);" />
          <button type="button" onclick="searchPlayerSafari('A')" style="background:#3a404c; margin:0; padding:6px 10px; font-size:10px; width:auto; flex-shrink:0;">🔍 Search</button>
        </div>
        <div style="display: flex; gap: 6px; align-items: center;">
          <input id="playerAId" placeholder="Enter Numerical ID" oninput="updateHelperLinks('A')" style="margin-bottom:0; font-size:11px; padding:4px 6px;" />
          <a id="playerALink" href="#" target="_blank" style="color:#4ea9ff; font-size:10px; font-weight:800; text-decoration:underline; display:none; white-space:nowrap;">🔗 Open JSON A</a>
        </div>
      </div>

      <!-- Player B Controls -->
      <div style="margin-bottom: 12px; border-bottom: 1px dashed var(--panel-border); padding-bottom: 10px;">
        <label>Player B Name (Away)</label>
        <div style="display: flex; gap: 6px; margin-bottom: 6px;">
          <input id="playerBName" placeholder="Player B" style="margin-bottom:0;" />
          <input id="pasteB" placeholder="Paste JSON B" oninput="parseIndividualFailsafe('B')" style="margin:0; padding:6px 8px; font-size:10px; width:100px; flex-shrink:0; background:var(--input-bg); color:var(--text); border:1px solid var(--input-border);" />
          <button type="button" onclick="searchPlayerSafari('B')" style="background:#3a404c; margin:0; padding:6px 10px; font-size:10px; width:auto; flex-shrink:0;">🔍 Search</button>
        </div>
        <div style="display: flex; gap: 6px; align-items: center;">
          <input id="playerBId" placeholder="Enter Numerical ID" oninput="updateHelperLinks('B')" style="margin-bottom:0; font-size:11px; padding:4px 6px;" />
          <a id="playerBLink" href="#" target="_blank" style="color:#4ea9ff; font-size:10px; font-weight:800; text-decoration:underline; display:none; white-space:nowrap;">🔗 Open JSON B</a>
        </div>
      </div>
      
      <div id="fetchStatus"></div>
    </div>

    <!-- Section 3: Market Lines -->
    <div class="section" id="marketSection">
      <h3>Market Lines</h3>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <div>
          <label>Match Points O/U</label>
          <input id="matchPointsLine" placeholder="70.5 - 77.5 or 74.5" />
        </div>
        <div>
          <label>Set 1 Points O/U</label>
          <input id="set1PointsLine" placeholder="17.5 - 19.5 or 18.5" />
        </div>
      </div>
    </div>

    <!-- Section 4: Player A Form -->
    <div class="section" id="playerASection">
      <h3>Player A — Match History</h3>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px;">
        <div>
          <label>Match Pts Scored</label>
          <input id="playerAPointsScored" placeholder="32,28,32,37,25" />
        </div>
        <div>
          <label>Match Pts Allowed</label>
          <input id="playerAPointsAllowed" placeholder="32,28,32,37,25" />
        </div>
      </div>
      <div style="margin-top:8px; border-top:1px dashed var(--panel-border); padding-top:8px;">
        <label style="font-size:10px; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:0.6px;">Set 1 Specific <span>(optional)</span></label>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top:4px;">
          <div>
            <label>Set 1 Scored</label>
            <input id="playerASet1Scored" placeholder="11,9,11,8,9" />
          </div>
          <div>
            <label>Set 1 Allowed</label>
            <input id="playerASet1Allowed" placeholder="11,9,11,8,9" />
          </div>
        </div>
      </div>
    </div>

    <!-- Section 5: Player B Form -->
    <div class="section" id="playerBSection">
      <h3>Player B — Match History</h3>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px;">
        <div>
          <label>Match Pts Scored</label>
          <input id="playerBPointsScored" placeholder="32,28,32,37,25" />
        </div>
        <div>
          <label>Match Pts Allowed</label>
          <input id="playerBPointsAllowed" placeholder="32,28,32,37,25" />
        </div>
      </div>
      <div style="margin-top:8px; border-top:1px dashed var(--panel-border); padding-top:8px;">
        <label style="font-size:10px; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:0.6px;">Set 1 Specific <span>(optional)</span></label>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top:4px;">
          <div>
            <label>Set 1 Scored</label>
            <input id="playerBSet1Scored" placeholder="11,9,8,11,9" />
          </div>
          <div>
            <label>Set 1 Allowed</label>
            <input id="playerBSet1Allowed" placeholder="11,9,8,11,9" />
          </div>
        </div>
      </div>
    </div>

    <!-- Section 6: H2H Form -->
    <div class="section" id="h2hSection">
      <h3>H2H Form</h3>
      <label style="font-size:11px; font-weight:800; cursor:pointer; display:flex; align-items:center; gap:6px; color:var(--section-toggle-text); margin-bottom:8px;">
        <input type="checkbox" id="useFTH2H" checked />
        Use H2H History
      </label>
      <div style="margin-bottom:8px;">
        <label style="font-size:11px; font-weight:800; color:var(--section-toggle-text); margin-bottom:4px;">H2H Sets History (Full Match)</label>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px;">
          <input id="h2hSetsA" placeholder="Player A Sets (3,2,1)" />
          <input id="h2hSetsB" placeholder="Player B Sets (1,3,3)" />
        </div>
      </div>
      <div>
        <label style="font-size:11px; font-weight:800; color:var(--section-toggle-text); margin-bottom:4px;">H2H Set 1 History (Points)</label>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px;">
          <input id="h2hSet1A" placeholder="Player A Set 1 (11,9,11)" />
          <input id="h2hSet1B" placeholder="Player B Set 1 (7,11,8)" />
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button id="runBtn" type="button" onclick="runEngine()">Run</button>
      <button id="clearBtn" type="button" onclick="clearAll()">Clear</button>
    </div>

    <!-- Projections Output -->
    <div class="table-wrap">
      <table id="results" style="display:none;">
        <thead>
          <tr>
            <th>Market</th>
            <th>Line</th>
            <th>Proj</th>
            <th>Range (10–90%)</th>
            <th>Edge</th>
            <th>Grade</th>
            <th>Pick</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>

  </div>

  <!-- AFDB Debugger Panel Overlay HTML -->
  <div id="afdbOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:rgba(0,0,0,0.96);flex-direction:column;font-family:ui-monospace,Consolas,monospace;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);">
    <div id="afdbPanel" style="width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;"></div>
  </div>

  <script>
    // ── GLOBAL CONFIG ──────────────────────────────────────────────────────────
    const CONFIG = {
      SIM_RUNS:          50000,
      MAX_MATCHES:       20,
      H2H_MAX_WEIGHT:    0.35,
      GRADE_A_THRESHOLD: 0.65,
      GRADE_B_THRESHOLD: 0.60,
      GRADE_C_THRESHOLD: 0.55,
      LEAGUE_MEAN_OPP:   { "Setka Cup": 28, "TT Cup": 24 }
    };
    
    const PRIMARY_WORKER_URL = "https://thebetceo-engine.ridwantunde636.workers.dev/";
    
    const PROXY_ROTATION_FALLBACKS = [
      "https://corsproxy.io/?",
      "https://api.codetabs.com/v1/proxy?quest=",
      "https://api.allorigins.win/raw?url=",
      "https://thingproxy.freeboard.io/fetch/"
    ];

    let _clipboardPhase = { A: null, B: null };
    let _clipboardReady = true;

    // ── Microscope Debug Brain (AFDB IIFE) ───────────────────────────────────
    const AFDB = (function() {
      const LOG_LIMIT = 600;
      let _log = [];
      let _isOpen = false;
      let _currentLogLevel = 'ERROR';
      let _showOnlyErrors = true; 

      const LEVELS = {
        BOOT:    { color:'#7aa6ff' }, NET:     { color:'#4ea9ff' },
        FETCH:   { color:'#49d45f' }, FILL:    { color:'#2aff9e' },
        PICK:    { color:'#d4af37' }, H2H:     { color:'#c678dd' },
        SUCCESS: { color:'#49d45f' }, WARN:    { color:'#ffcf73' },
        ERROR:   { color:'#ff5c61' }, INFO:    { color:'#aaa'    },
        ENGINE:  { color:'#d4af37' }, TRACKER: { color:'#4ea9ff' },
        VERDICT: { color:'#49d45f' } 
      };

      const ICONS = {
        BOOT:'⚙️', NET:'🌐', FETCH:'📡', FILL:'✏️',
        PICK:'📌', H2H:'🔄', SUCCESS:'✅', WARN:'⚠️', ERROR:'❌', INFO:'ℹ️',
        ENGINE:'⚙️', TRACKER:'📊', VERDICT:'🏅'
      };

      function esc(s) {
        return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }

      function log(level, section, msg, data = null) {
        const entry = {
          ts: new Date().toLocaleTimeString([], { hour12: false }),
          level,
          section: section || 'CORE',
          msg,
          data
        };
        _log.unshift(entry);
        if (_log.length > LOG_LIMIT) _log = _log.slice(0, LOG_LIMIT);
        
        if (level === 'ERROR') {
          if (document.body) document.body.classList.add("engine-alert");
        }
        
        if (_isOpen) _render();
      }

      function clear() {
        _log = [];
        if (document.body) document.body.classList.remove("engine-alert");
        _render();
      }

      function open() {
        _isOpen = true;
        const ov = document.getElementById('afdbOverlay');
        if (ov) { ov.style.display = 'flex'; _render(); }
      }

      function close() {
        _isOpen = false;
        const ov = document.getElementById('afdbOverlay');
        if (ov) ov.style.display = 'none';
      }

      function toggleFilter() {
        const levels = ['ALL', 'WARN', 'ERROR'];
        _currentLogLevel = levels[(levels.indexOf(_currentLogLevel) + 1) % levels.length];
        _showOnlyErrors = _currentLogLevel !== 'ALL';
        _render();
      }

      function copy(btnEl) {
        const visibleLogs = _getFilteredLogs();
        const textArr = visibleLogs.slice().reverse().map(e => {
          let line = '[' + e.ts + '] [' + e.level + '] [' + e.section + '] ' + e.msg;
          if (e.data !== null) {
            try { line += ' | ' + JSON.stringify(e.data); }
            catch(x) { line += ' | ' + String(e.data); }
          }
          return line;
        });
        const text = textArr.join(String.fromCharCode(10, 10));
        try {
          navigator.clipboard.writeText(text);

    // ── Core Point Win and Match Processing v11 ──────────────────────────────
    function processPlayerPoints(events, playerId, label) {
      const scoredList = [], allowedList = [];
      const set1ScoredList = [], set1AllowedList = [];
      const perSetScored = [], perSetAllowed = [];
      const matchRecords = [];

      const completed = events.filter(e => {
        if (e.status?.type !== "finished") return false;
        const hId = String(e.homeTeam?.id || "");
        const aId = String(e.awayTeam?.id || "");
        return hId === String(playerId) || aId === String(playerId);
      }).reverse().slice(0, 20);

      AFDB.log('ENGINE', 'PLAYER_PROCESSING', `Processing ${completed.length} matches for ${label} (ID: ${playerId})`);

      completed.forEach((ev, idx) => {
        const isHome = String(ev.homeTeam?.id) === String(playerId);
        const myScoreObj  = isHome ? ev.homeScore : ev.awayScore;
        const oppScoreObj = isHome ? ev.awayScore  : ev.homeScore;
        if (myScoreObj && oppScoreObj) {
          let matchSets = 0, matchScored = 0, matchAllowed = 0;
          let oppTotalScored = 0;
          const matchWeight = Math.pow(0.85, idx);
          for (let s = 1; s <= 5; s++) {
            const mySet  = myScoreObj[`period${s}`];
            const oppSet = oppScoreObj[`period${s}`];
            if (mySet !== undefined && oppSet !== undefined) {
              perSetScored.push({ val: mySet, weight: matchWeight });
              perSetAllowed.push({ val: oppSet, weight: matchWeight });
              if (s === 1) { set1ScoredList.push(mySet); set1AllowedList.push(oppSet); }
              matchScored += mySet; matchAllowed += oppSet;
              oppTotalScored += oppSet;
              matchSets++;
            }
          }
          if (matchSets > 0) {
            scoredList.push(matchScored);
            allowedList.push(matchAllowed);
            const opponentId = isHome ? String(ev.awayTeam?.id || '') : String(ev.homeTeam?.id || '');
            matchRecords.push({ scored: matchScored, allowed: matchAllowed, oppTotalScored, matchWeight, startTimestamp: ev.startTimestamp || 0, sets: matchSets, opponentId });
            AFDB.log('ENGINE', 'PLAYER_PROCESSING', `${label} M#${idx+1} wt=${matchWeight.toFixed(2)} [${matchSets}s] scored:${matchScored} allowed:${matchAllowed} oppId:${opponentId}`);
          }
        }
      });

      AFDB.log('ENGINE', 'PLAYER_PROCESSING', `${label} done. Matches:${matchRecords.length} Set1s:${set1ScoredList.length} PerSets:${perSetScored.length}`);
      return { scoredList, allowedList, set1ScoredList, set1AllowedList, perSetScored, perSetAllowed, matchRecords };
    }

      try {
        const parsedData = JSON.parse(rawText);
        const events = parsedData.events || [];
        if (events.length === 0) throw new Error("No event elements found in pasted JSON.");
        let targetId = document.getElementById(side === 'A' ? 'playerAId' : 'playerBId').value.trim();
        if (!targetId) {
          const idCounts = {};
          events.forEach(ev => {
            if (ev.homeTeam?.id) idCounts[ev.homeTeam.id] = (idCounts[ev.homeTeam.id] || 0) + 1;
            if (ev.awayTeam?.id) idCounts[ev.awayTeam.id] = (idCounts[ev.awayTeam.id] || 0) + 1;
          });
          let maxCount = 0, bestId = null;
          for (const id in idCounts) {
            if (idCounts[id] > maxCount) { maxCount = idCounts[id]; bestId = id; }
          }
          if (bestId) {
            targetId = bestId;

            updateHelperLinks(side);
          }
        }
        if (!targetId) throw new Error(`Could not find a valid player ID for Player ${side}.`);

        document.getElementById(isA ? "playerAPointsAllowed" : "playerBPointsAllowed").value = stats.allowedList.join(",");
        document.getElementById(isA ? "playerASet1Scored"    : "playerBSet1Scored").value    = stats.set1ScoredList.join(",");
        document.getElementById(isA ? "playerASet1Allowed"   : "playerBSet1Allowed").value   = stats.set1AllowedList.join(",");
        
        if (side === 'A') {
          window.rawEventsA = events;
          window._rawJsonA = rawText;
        } else {
          window.rawEventsB = events;
          window._rawJsonB = rawText;
        }
        analyzeFatigueAndH2H();

        AFDB.log('SUCCESS', 'FAILSAFE', `Player ${side} parsed successfully.`);
        statusEl.className = "status-ok";
        statusEl.textContent = "✅ Player " + side + " loaded! Tap 📋 to copy raw JSON.";
        inputEl.value = "";
        ["marketSection","playerASection","playerBSection"].forEach(id => document.getElementById(id).classList.remove("collapsed"));
      } catch (err) {
        statusEl.className = "status-err";
        statusEl.textContent = `❌ Failed to parse Player ${side} JSON. Check format.`;
        AFDB.log('ERROR', 'FAILSAFE', `Manual JSON Parsing Failed: ${err.message}`);
      }
    }

    // ── Fatigue Schedule Metrics and Auto-H2H Form Mapper ────────────────────
    function analyzeFatigueAndH2H() {
      const idA = document.getElementById("playerAId").value.trim();
      const idB = document.getElementById("playerBId").value.trim();
      ['A', 'B'].forEach(side => {
        const events = side === 'A' ? window.rawEventsA : window.rawEventsB;
        const playerId = side === 'A' ? idA : idB;
        if (!events || !playerId) return;
        const completed = events.filter(e => {
          if (e.status?.type !== "finished") return false;
          const hId = String(e.homeTeam?.id || "");
          const aId = String(e.awayTeam?.id || "");
          return hId === String(playerId) || aId === String(playerId);
        }).reverse();
        if (completed.length < 2) return;
        let sameDayCount = 1, b2bCount = 0, totalRestHours = 0, intervalsCount = 0;
        for (let i = 0; i < Math.min(completed.length - 1, 4); i++) {
          const m1Time = completed[i].startTimestamp * 1000;
          const m2Time = completed[i+1].startTimestamp * 1000;
          const diffHours = (m1Time - m2Time) / (1000 * 60 * 60);
          if (diffHours > 0) {
            totalRestHours += diffHours;
            intervalsCount++;
            if (diffHours <= 4) sameDayCount++;
            else if (diffHours <= 24) b2bCount++;
          }
        }
        const avgRest = intervalsCount > 0 ? (totalRestHours / intervalsCount).toFixed(1) : "—";
        AFDB.log('ENGINE', 'FATIGUE', `Player ${side} Schedule: Avg Rest between recent games = ${avgRest} hrs. Same-day doubleheader matches = ${sameDayCount - 1}, Back-to-back days = ${b2bCount}`);
      });
      if (idA && idB && window.rawEventsA) {
        const h2hMatches = window.rawEventsA.filter(e => {
          if (e.status?.type !== "finished") return false;
          const hId = String(e.homeTeam?.id || "");
          const aId = String(e.awayTeam?.id || "");
          return (hId === String(idA) && aId === String(idB)) || (hId === String(idB) && aId === String(idA));
        });
        if (h2hMatches.length > 0) {
          const setsA = [], setsB = [], set1A = [], set1B = [];
          h2hMatches.slice(0, 5).forEach(m => {
            const isHomeA = String(m.homeTeam?.id) === String(idA);
            const scoreA = isHomeA ? m.homeScore?.display : m.awayScore?.display;
            const scoreB = isHomeA ? m.awayScore?.display : m.homeScore?.display;
            const s1A = isHomeA ? m.homeScore?.period1 : m.awayScore?.period1;
            const s1B = isHomeA ? m.awayScore?.period1 : m.homeScore?.period1;
            if (scoreA !== undefined && scoreB !== undefined) { setsA.push(scoreA); setsB.push(scoreB); }
            if (s1A !== undefined && s1B !== undefined) { set1A.push(s1A); set1B.push(s1B); }
          });
          if (setsA.length > 0) {
            document.getElementById("h2hSetsA").value = setsA.join(",");
            document.getElementById("h2hSetsB").value = setsB.join(",");
          }
          if (set1A.length > 0) {
            document.getElementById("h2hSet1A").value = set1A.join(",");
            document.getElementById("h2hSet1B").value = set1B.join(",");
          }
          if (setsA.length > 0 || set1A.length > 0) {
            document.getElementById("useFTH2H").checked = true;
            AFDB.log('SUCCESS', 'H2H', `Automatically extracted H2H match scores and Set 1 points directly from player history feeds!`);
          } else {
            AFDB.log('INFO', 'H2H', `No H2H found in recent history between these players.`);
            const _st1 = document.getElementById("fetchStatus");
            if (_st1) _st1.textContent += " · H2H: none found";
          }
        } else {
          AFDB.log('INFO', 'H2H', `No H2H found — may not have faced each other recently.`);
          const _st2 = document.getElementById("fetchStatus");
          if (_st2) _st2.textContent += " · H2H: none found";
        }
      }
    }

    // ── Dedicated Normalizers and Line Resolvers ─────────────────────────────
    function normalizeDashes(str) {
      return String(str ?? "").replace(/[–—−]/g, "-");
    }

    function parseMarketLine(val) {
      const meta = parseMarketRangeMeta(val);
      return meta ? meta.mid : null;
    }

    function parseMarketRangeMeta(val) {
      if (!val || !String(val).trim()) return null;
      const raw = normalizeDashes(String(val).trim());
      const normalizeLine = num => Math.round(num * 2) / 2;

      const rangeMatch = raw.match(/^(\d{1,3}(?:\.\d+)?)\s*-\s*(\d{1,3}(?:\.\d+)?)$/);
      if (rangeMatch) {
        const a = parseFloat(rangeMatch[1]);
        const b = parseFloat(rangeMatch[2]);
        if (!isFinite(a) || !isFinite(b) || a <= 0 || b <= 0 || b < a) return null;
        return {
          raw,
          low: normalizeLine(a),
          high: normalizeLine(b),
          mid: normalizeLine((a + b) / 2),
          isRange: true
        };
      }

      const singleMatch = raw.match(/^(\d{1,3}(?:\.\d+)?)$/);
      if (singleMatch) {
        const x = parseFloat(singleMatch[1]);
        if (!isFinite(x) || x <= 0) return null;
        const line = normalizeLine(x);
        return {
          raw,
          low: line,
          high: line,
          mid: line,
          isRange: false
        };
      }
      return null;
    }

    // ── Deduplicated Math Statistics Resolvers ───────────────────────────────
    function calculateMean(arr) {
      if (!arr.length) return 0;
      return arr.reduce((a, b) => a + b, 0) / arr.length;
    }

    function calculateStdDev(arr) {
      if (arr.length < 2) return 1.5;
      const mean = calculateMean(arr);
      const variance = arr.reduce((sum, val) => sum + Math.pow(val - mean, 2), 0) / (arr.length - 1);
      return Math.sqrt(variance);
    }

    // ── Active 50,000-Run Monte Carlo Simulation Engine ──────────────────────
    function runEngine() {
      AFDB.log('ENGINE', 'CALCULATION', "Monte Carlo FINAL v11 starting...");
      const league    = document.getElementById("leagueSelect").value;
      const matchLineInput = document.getElementById("matchPointsLine").value.trim();
      const set1LineInput  = document.getElementById("set1PointsLine").value.trim();
      const matchLine  = parseMarketLine(matchLineInput);
      const set1Line   = parseMarketLine(set1LineInput);
      if (!league) { alert("Please select a league first."); return; }
      const rawScoredA   = document.getElementById("playerAPointsScored").value.split(",").map(Number).filter(v => !isNaN(v) && v > 0);
      const rawAllowedA  = document.getElementById("playerAPointsAllowed").value.split(",").map(Number).filter(v => !isNaN(v) && v > 0);
      const rawScoredB   = document.getElementById("playerBPointsScored").value.split(",").map(Number).filter(v => !isNaN(v) && v > 0);
      const rawAllowedB  = document.getElementById("playerBPointsAllowed").value.split(",").map(Number).filter(v => !isNaN(v) && v > 0);
      const rawS1ScoredA = document.getElementById("playerASet1Scored").value.split(",").map(Number).filter(v => !isNaN(v) && v > 0);
      const rawS1AllowA  = document.getElementById("playerASet1Allowed").value.split(",").map(Number).filter(v => !isNaN(v) && v > 0);
      const rawS1ScoredB = document.getElementById("playerBSet1Scored").value.split(",").map(Number).filter(v => !isNaN(v) && v > 0);
      const rawS1AllowB  = document.getElementById("playerBSet1Allowed").value.split(",").map(Number).filter(v => !isNaN(v) && v > 0);
      const _vStatus = document.getElementById("fetchStatus");
      if (!rawScoredA.length || !rawAllowedA.length || !rawScoredB.length || !rawAllowedB.length) {
        if (_vStatus) { _vStatus.className = "status-err"; _vStatus.textContent = "❌ Missing or invalid scores — check that scored/allowed fields contain comma-separated numbers."; }
        AFDB.log('ERROR', 'VALIDATION', 'Aborting engine run: missing player data.');
        return;
      }
      const _minSets = Math.min(rawScoredA.length, rawAllowedA.length, rawScoredB.length, rawAllowedB.length);
      if (_minSets < 5 && _vStatus) {
        _vStatus.className = "status-loading";
        _vStatus.textContent = `⚠️ Low sample (${_minSets} valid set score(s)) — add more match data for better accuracy.`;
        AFDB.log('WARN', 'VALIDATION', `Low sample size: ${_minSets} set(s). Results may be less reliable.`);
      }

      // Weighted EWMA using per-set weights
      const calculateWeightedMean = (weightedArr) => {
        if (!weightedArr || !weightedArr.length) return 0;
        let wSum = 0, wTotal = 0;
        weightedArr.forEach(item => { wSum += item.val * item.weight; wTotal += item.weight; });
        return wTotal > 0 ? wSum / wTotal : 0;
      };

      // Recency-weighted decay multiplier fallback
      const calculateEWMAMean = (arr) => {
        if (!arr.length) return 0;
        if (arr.length === 1) return arr[0];
        const lambda = 0.88;
        let weightedSum = 0, weightTotal = 0;
        for (let i = 0; i < arr.length; i++) {
          const w = Math.pow(lambda, i);
          weightedSum += arr[i] * w;
          weightTotal += w;
        }
        return weightedSum / weightTotal;
      };

      const idA = document.getElementById("playerAId").value.trim();
      const idB = document.getElementById("playerBId").value.trim();

      const psA = window.rawEventsA ? processPlayerPoints(window.rawEventsA, idA, 'A_ps') : null;
      const psB = window.rawEventsB ? processPlayerPoints(window.rawEventsB, idB, 'B_ps') : null;

      let meanScoredA  = (psA && psA.perSetScored.length)  ? calculateWeightedMean(psA.perSetScored)  : calculateEWMAMean(rawScoredA);
      let meanAllowedA = (psA && psA.perSetAllowed.length) ? calculateWeightedMean(psA.perSetAllowed) : calculateEWMAMean(rawAllowedA);
      let meanScoredB  = (psB && psB.perSetScored.length)  ? calculateWeightedMean(psB.perSetScored)  : calculateEWMAMean(rawScoredB);
      let meanAllowedB = (psB && psB.perSetAllowed.length) ? calculateWeightedMean(psB.perSetAllowed) : calculateEWMAMean(rawAllowedB);

      AFDB.log('ENGINE','MATH',`A: WtdSet Scored=${meanScoredA.toFixed(2)} Allowed=${meanAllowedA.toFixed(2)}`);
      AFDB.log('ENGINE','MATH',`B: WtdSet Scored=${meanScoredB.toFixed(2)} Allowed=${meanAllowedB.toFixed(2)}`);

      // Targeted Matchup Specific Calibrations
      const getVsOpponentStats = (matchRecords, opponentId) => {
        if (!matchRecords || !opponentId) return null;
        const vs = matchRecords.filter(r => r.opponentId === String(opponentId));
        if (vs.length < 2) return null;
        const wTot = vs.reduce((s, r) => s + r.matchWeight, 0);
        if (!wTot) return null;
        const meanScoredPerSet  = vs.reduce((s, r) => s + (r.scored  / r.sets) * r.matchWeight, 0) / wTot;
        const meanAllowedPerSet = vs.reduce((s, r) => s + (r.allowed / r.sets) * r.matchWeight, 0) / wTot;
        return { meanScoredPerSet, meanAllowedPerSet, n: vs.length };
      };
      
      const vsOppA = (psA && psA.matchRecords) ? getVsOpponentStats(psA.matchRecords, idB) : null;
      const vsOppB = (psB && psB.matchRecords) ? getVsOpponentStats(psB.matchRecords, idA) : null;
      if (vsOppA) {
        const w = Math.min(0.45, vsOppA.n / 9);
        meanScoredA  = meanScoredA  * (1 - w) + vsOppA.meanScoredPerSet  * w;
        meanAllowedA = meanAllowedA * (1 - w) + vsOppA.meanAllowedPerSet * w;
        AFDB.log('ENGINE', 'OPP_CAL', `A vs B specific: n=${vsOppA.n} w=${(w*100).toFixed(0)}% → scored=${meanScoredA.toFixed(2)} allowed=${meanAllowedA.toFixed(2)}`);
      }
      if (vsOppB) {
        const w = Math.min(0.45, vsOppB.n / 9);
        meanScoredB  = meanScoredB  * (1 - w) + vsOppB.meanScoredPerSet  * w;
        meanAllowedB = meanAllowedB * (1 - w) + vsOppB.meanAllowedPerSet * w;
        AFDB.log('ENGINE', 'OPP_CAL', `B vs A specific: n=${vsOppB.n} w=${(w*100).toFixed(0)}% → scored=${meanScoredB.toFixed(2)} allowed=${meanAllowedB.toFixed(2)}`);
      }

      // Context quality normalization adjustments
      const getOppQualityAdj = (matchRecords) => {
        if (!matchRecords || matchRecords.length < 3) return 0;
        const allOppScores = matchRecords.map(r => r.oppTotalScored);
        const meanOpp = allOppScores.reduce((a,b) => a+b, 0) / allOppScores.length;
        const leagueMeanOppScore = league === 'TT Cup' ? 24 : 28;
        const diff = meanOpp - leagueMeanOppScore;
        return Math.max(-0.03, Math.min(0.03, diff * 0.002));
      };

      const oppAdjA = getOppQualityAdj(psA ? psA.matchRecords : null);
      const oppAdjB = getOppQualityAdj(psB ? psB.matchRecords : null);
      AFDB.log('ENGINE','OPP_QUALITY',`Opp quality adj: A=${(oppAdjA*100).toFixed(1)}% B=${(oppAdjB*100).toFixed(1)}%`);

      const pA_base = Math.min(0.75, Math.max(0.25, (meanScoredA / (meanScoredA + meanAllowedA)) + oppAdjA));
      const pB_base = Math.min(0.75, Math.max(0.25, (meanScoredB / (meanScoredB + meanAllowedB)) + oppAdjB));

      const flatScoredA = psA && psA.perSetScored.length ? psA.perSetScored.map(x => x.val) : rawScoredA;
      const flatScoredB = psB && psB.perSetScored.length ? psB.perSetScored.map(x => x.val) : rawScoredB;
      const stdDevA = calculateStdDev(flatScoredA);
      const stdDevB = calculateStdDev(flatScoredB);
      const cvA = stdDevA / (meanScoredA || 1);
      const cvB = stdDevB / (meanScoredB || 1);
      const matchUncertainty = Math.max(0.01, Math.min(0.08, (cvA + cvB) / 2));

      AFDB.log('ENGINE', 'VOLATILITY', `StdDev A=${stdDevA.toFixed(1)} (CV:${(cvA*100).toFixed(1)}%) B=${stdDevB.toFixed(1)} (CV:${(cvB*100).toFixed(1)}%) Uncertainty=${(matchUncertainty*100).toFixed(1)}%`);

      const upcomingTime = Date.now();
      const fatigueDataAvailable = !!(window.rawEventsA || window.rawEventsB);

      const getPlayerModifiers = (events, playerId) => {
        if (!events || !playerId) return { fatigue: 0, form: 0 };
        const completed = events.filter(e => {
          if (e.status?.type !== "finished") return false;
          const hId = String(e.homeTeam?.id || "");
          const aId = String(e.awayTeam?.id || "");
          return hId === String(playerId) || aId === String(playerId);
        }).reverse();
        if (completed.length === 0) return { fatigue: 0, form: 0 };

        const lastMatchTime = completed[0].startTimestamp * 1000;
        const elapsedHours = (upcomingTime - lastMatchTime) / (1000 * 60 * 60);
        let fatigue = 0;
        if (elapsedHours > 0) {
          if (elapsedHours < 1.2) fatigue = -0.035;
          else if (elapsedHours < 2.5) fatigue = -0.015;
          else if (elapsedHours < 5.0) fatigue = -0.005;
        }

        const lastDateStr = new Date(lastMatchTime).toDateString();
        let matchesToday = 0;
        completed.forEach(m => {
          if (new Date(m.startTimestamp * 1000).toDateString() === lastDateStr) matchesToday++;
        });
        if (matchesToday >= 3) fatigue -= (matchesToday * 0.005);

        let wins = 0;
        const sample = completed.slice(0, 5);
        sample.forEach(m => {
          const isHome = String(m.homeTeam?.id) === String(playerId);
          if ((isHome && m.winnerCode === 1) || (!isHome && m.winnerCode === 2)) wins++;
        });
        const winRate = sample.length > 0 ? wins / sample.length : 0.5;
        const form = (winRate - 0.5) * 0.03;

        return { fatigue, form };
      };

      const contextA = fatigueDataAvailable ? getPlayerModifiers(window.rawEventsA, idA) : { fatigue: 0, form: 0 };
      const contextB = fatigueDataAvailable ? getPlayerModifiers(window.rawEventsB, idB) : { fatigue: 0, form: 0 };

      AFDB.log('ENGINE', 'FATIGUE', `Player A Fatigue: ${(contextA.fatigue*100).toFixed(1)}%, Form: ${(contextA.form*100).toFixed(1)}%`);
      AFDB.log('ENGINE', 'FATIGUE', `Player B Fatigue: ${(contextB.fatigue*100).toFixed(1)}%, Form: ${(contextB.form*100).toFixed(1)}%`);

      const avgScoredA = meanScoredA;
      const avgAllowedA = meanAllowedA;
      const avgScoredB = meanScoredB;
      const avgAllowedB = meanAllowedB;

      const hasEnoughDataA = rawAllowedA.length >= 10;
      const hasEnoughDataB = rawAllowedB.length >= 10;
      const isChopperA = hasEnoughDataA && avgAllowedA < 7.5;
      const isChopperB = hasEnoughDataB && avgAllowedB < 7.5;

      const usesPipsA = isChopperA && stdDevA > 2.5;
      const usesPipsB = isChopperB && stdDevB > 2.5;

      let styleAdjA = 0;
      let styleAdjB = 0;

      if (isChopperA && usesPipsA && !isChopperB) styleAdjA += 0.01;
      if (isChopperB && usesPipsB && !isChopperA) styleAdjB += 0.01;

      AFDB.log('ENGINE', 'STYLE', `Auto-Style: Player A=${isChopperA ? 'Chopper' : 'Attacker'} (Pips=${usesPipsA}), Player B=${isChopperB ? 'Chopper' : 'Attacker'} (Pips=${usesPipsB}). Adjustments: A=+${(styleAdjA*100).toFixed(1)}%, B=+${(styleAdjB*100).toFixed(1)}%`);

      let probA = (pA_base * (1 - pB_base)) / ((pA_base * (1 - pB_base)) + (pB_base * (1 - pA_base)));

      probA += contextA.fatigue + contextA.form + styleAdjA;
      probA -= (contextB.fatigue + contextB.form + styleAdjB);
      probA = Math.max(0.25, Math.min(0.75, probA));

      let probA_set1 = probA;
      const hasSet1 = rawS1ScoredA.length > 0 && rawS1AllowA.length > 0 && rawS1ScoredB.length > 0 && rawS1AllowB.length > 0;
      if (hasSet1) {
        const s1MeanScoredA = calculateEWMAMean(rawS1ScoredA), s1MeanAllowA = calculateEWMAMean(rawS1AllowA);
        const s1MeanScoredB = calculateEWMAMean(rawS1ScoredB), s1MeanAllowB = calculateEWMAMean(rawS1AllowB);
        const pS1A = s1MeanScoredA / (s1MeanScoredA + s1MeanAllowA);
        const pS1B = s1MeanScoredB / (s1MeanScoredB + s1MeanAllowB);
        probA_set1 = (pS1A * (1 - pS1B)) / ((pS1A * (1 - pS1B)) + (pS1B * (1 - pS1A)));
        probA_set1 += contextA.fatigue + contextA.form + styleAdjA;
        probA_set1 -= (contextB.fatigue + contextB.form + styleAdjB);
        probA_set1 = Math.max(0.25, Math.min(0.75, probA_set1));
        AFDB.log('ENGINE','MATH',`Set1 dedicated probA_set1=${(probA_set1 * 100).toFixed(1)}%`);
      } else {
        AFDB.log('ENGINE','MATH',`No Set1 data — Set1 uses overall probA=${(probA * 100).toFixed(1)}%`);
      }

      const rawH2HA = document.getElementById("h2hSetsA").value.split(",").map(Number).filter(v => !isNaN(v));
      const rawH2HB = document.getElementById("h2hSetsB").value.split(",").map(Number).filter(v => !isNaN(v));
      if (rawH2HA.length >= 2 && rawH2HB.length >= 2) {
        const h2hN = rawH2HA.length;
        const h2hWeight = Math.min(0.35, h2hN / 43);
        const priorWeight = 1 - h2hWeight;
        const tA = rawH2HA.reduce((a,b) => a + b, 0), tB = rawH2HB.reduce((a,b) => a + b, 0);
        const h2hProbA = tA / (tA + tB);
        probA = (probA * priorWeight) + (h2hProbA * h2hWeight);
        if (!hasSet1) probA_set1 = probA;
        AFDB.log('ENGINE','H2H',`Bayesian H2H blend: n=${h2hN} h2hWeight=${(h2hWeight*100).toFixed(1)}% probA=${(probA*100).toFixed(1)}%`);
      }

      const rawH2HS1A = document.getElementById("h2hSet1A").value.split(",").map(Number).filter(v => !isNaN(v));
      const rawH2HS1B = document.getElementById("h2hSet1B").value.split(",").map(Number).filter(v => !isNaN(v));
      if (rawH2HS1A.length >= 2 && rawH2HS1B.length >= 2) {
        const meanH2HS1A = calculateEWMAMean(rawH2HS1A);
        const meanH2HS1B = calculateEWMAMean(rawH2HS1B);
        const h2hS1ProbA = meanH2HS1A / (meanH2HS1A + meanH2HS1B);
        probA_set1 = (probA_set1 * 0.70) + (h2hS1ProbA * 0.30);
        AFDB.log('ENGINE','H2H',`Set 1 Points H2H blended probA_set1=${(probA_set1 * 100).toFixed(1)}%`);
      }

      const randomNormal = () => {
        let u = 0, v = 0;
        while (u === 0) u = Math.random();
        while (v === 0) v = Math.random();
        return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
      };

      const SIM_RUNS = 50000;
      let matchOverHits = 0, set1OverHits = 0, totalMatchPts = 0, totalSet1Pts = 0;
      const allMatchPts = [], allSet1Pts = [];
      for (let run = 0; run < SIM_RUNS; run++) {
        let sWA = 0, sWB = 0, matchPts = 0, s1Pts = 0, setNum = 1;

        let server = Math.random() < 0.5 ? 'A' : 'B';
        let firstSetServer = server;

        let runSkillShift = randomNormal() * matchUncertainty * 0.15;

        while (sWA < 3 && sWB < 3) {
          let sA = 0, sB = 0;
          let setPointsPlayed = 0;

          if (setNum > 1) {
            server = (setNum % 2 === 1) ? (firstSetServer === 'A' ? 'A' : 'B') : (firstSetServer === 'A' ? 'B' : 'A');
          }

          let momentum = (sWA - sWB) * 0.01;

          while ((sA < 11 && sB < 11) || Math.abs(sA - sB) < 2) {
            let p = setNum === 1 ? probA_set1 : probA;
            
            p += momentum + runSkillShift;
            if (server === 'A') {
              p += 0.03;
            } else {
              p -= 0.03;
            }
            p = Math.max(0.25, Math.min(0.75, p));

            if (Math.random() < p) sA++; else sB++;
            setPointsPlayed++;

            if (sA >= 10 && sB >= 10) {
              server = server === 'A' ? 'B' : 'A';
            } else if (setPointsPlayed % 2 === 0) {
              server = server === 'A' ? 'B' : 'A';
            }
          }

          const sp = sA + sB;
          matchPts += sp;
          if (setNum === 1) { s1Pts = sp; totalSet1Pts += sp; }
          if (sA > sB) sWA++; else sWB++;
          setNum++;
        }
        totalMatchPts += matchPts;
        allMatchPts.push(matchPts);
        allSet1Pts.push(s1Pts);
        if (isFinite(matchLine) && matchPts > matchLine) matchOverHits++;
        if (isFinite(set1Line)  && s1Pts  > set1Line)  set1OverHits++;
      }

      const projMatch = totalMatchPts / SIM_RUNS, projSet1 = totalSet1Pts / SIM_RUNS;
      const pctMatch  = (matchOverHits / SIM_RUNS) * 100, pctSet1 = (set1OverHits / SIM_RUNS) * 100;

      allMatchPts.sort((a, b) => a - b);
      allSet1Pts.sort((a, b) => a - b);
      const p10Match = allMatchPts[Math.floor(SIM_RUNS * 0.10)];
      const p90Match = allMatchPts[Math.floor(SIM_RUNS * 0.90)];
      const p10Set1  = allSet1Pts[Math.floor(SIM_RUNS * 0.10)];
      const p90Set1  = allSet1Pts[Math.floor(SIM_RUNS * 0.90)];
      AFDB.log('SUCCESS','ENGINE',`Done! Match:${projMatch.toFixed(1)} [${p10Match}–${p90Match}] Set1:${projSet1.toFixed(1)} [${p10Set1}–${p90Set1}]`);

      const options = [];
      if (isFinite(matchLine) && matchLine > 0) {
        const edge = projMatch - matchLine;
        const pct = Math.abs(edge / matchLine) * 100;
        let pick = "NO PLAY";
        let grade = "—";
        if (edge > 0 && pctMatch >= 55) {
          pick = "OVER " + matchLine.toFixed(1);
          grade = pctMatch >= 65 ? "A" : pctMatch >= 60 ? "B" : "C";
        } else if (edge < 0 && (100 - pctMatch) >= 55) {
          pick = "UNDER " + matchLine.toFixed(1);
          grade = (100 - pctMatch) >= 65 ? "A" : (100 - pctMatch) >= 60 ? "B" : "C";
        }
        options.push({ name: "Match Points Total", line: matchLine, proj: projMatch, edge, grade, pick, edgePct: pct, p10: p10Match, p90: p90Match, isLock: false });
      }

      if (isFinite(set1Line) && set1Line > 0) {
        const edge = projSet1 - set1Line;
        const pct = Math.abs(edge / set1Line) * 100;
        let pick = "NO PLAY";
        let grade = "—";
        if (edge > 0 && pctSet1 >= 55) {
          pick = "OVER " + set1Line.toFixed(1);
          grade = pctSet1 >= 65 ? "A" : pctSet1 >= 60 ? "B" : "C";
        } else if (edge < 0 && (100 - pctSet1) >= 55) {
          pick = "UNDER " + set1Line.toFixed(1);
          grade = (100 - pctSet1) >= 65 ? "A" : (100 - pctSet1) >= 60 ? "B" : "C";
        }
        options.push({ name: "Set 1 Points Total", line: set1Line, proj: projSet1, edge, grade, pick, edgePct: pct, p10: p10Set1, p90: p90Set1, isLock: false });
      }

      const validPlays = options.filter(o => o.pick !== "NO PLAY" && o.grade !== "—");
      if (validPlays.length > 0) {
        const best = [...validPlays].sort((a, b) => {
          const gradeRank = { A: 3, B: 2, C: 1 };
          const rankA = gradeRank[a.grade] || 0;
          const rankB = gradeRank[b.grade] || 0;
          if (rankB !== rankA) return rankB - rankA;
          return b.edgePct - a.edgePct;
        })[0];
        if (best) best.isLock = true;
      }
      AFDB.log('ENGINE', 'SUMMARY', 'probA_overall=' + (probA*100).toFixed(1) + '% probA_set1=' + (probA_set1*100).toFixed(1) + '% oppAdjA=' + (oppAdjA*100).toFixed(1) + '% oppAdjB=' + (oppAdjB*100).toFixed(1) + '% uncertainty=' + (matchUncertainty*100).toFixed(1) + '%');

      renderProjectionsTable(options);
    }

    // ── Render Projections Output Element ────────────────────────────────────
    function renderProjectionsTable(options) {
      const body = document.getElementById("resultsBody");
      const table = document.getElementById("results");
      if (!body || !table) return;

      body.innerHTML = "";

      options.forEach(p => {
        const row = document.createElement("tr");
        const edgePct = p.line > 0 ? (p.edge / p.line) * 100 : 0;
        const gradeClass = p.pick === "NO PLAY" ? "conf-none" : (p.grade === "A" ? "conf-a" : (p.grade === "B" ? "conf-b" : "conf-c"));
        const predClass = p.pick === "NO PLAY" ? "pred-noplay" : (p.pick.startsWith("UNDER") ? "pred-under" : "pred-over");
        const rangeStr = (p.p10 !== undefined && p.p90 !== undefined) ? `${p.p10}–${p.p90}` : '—';

        row.innerHTML = `
          <td style="font-weight:900;text-transform:uppercase;">${p.name}</td>
          <td style="font-weight:800;">${p.line.toFixed(1)}</td>
          <td>${p.proj.toFixed(1)}</td>
          <td style="font-weight:700;color:var(--muted);font-size:11px;">${rangeStr}</td>
          <td style="color:${p.edge >= 0 ? '#49d45f' : '#ff5c61'};font-weight:800;">
            ${p.edge >= 0 ? '+' : ''}${p.edge.toFixed(1)} (${p.edge >= 0 ? '+' : ''}${edgePct.toFixed(1)}%)
          </td>
          <td class="${gradeClass}">${p.grade}</td>
          <td class="${predClass}" style="font-weight:900;white-space:nowrap;">
            ${p.pick}${p.isLock ? ' <span class="lock">🔒</span>' : ''}
          </td>
        `;
        body.appendChild(row);
      });

      table.style.display = "table";
      table.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    // ── Self-Healing CORS Proxy Client ───────────────────────────────────────
    async function proxyFetch(url) {
      AFDB.log('FETCH', 'PROXY', `Calling primary worker for URL: ${url}`);
      try {
        const proxyUrl = PRIMARY_WORKER_URL + "?url=" + encodeURIComponent(url);
        const response = await fetch(proxyUrl);
        AFDB.log('FETCH', 'PROXY', `Primary Worker HTTP Status: ${response.status}`);
        if (response.status === 403) {
          AFDB.log('WARN', 'PROXY', "Primary worker blocked by Cloudflare (403). Initiating self-healing proxy rotation...");
          return await rotateAndFetch(url);
        }
        if (!response.ok) {
          throw new Error(`Worker returned HTTP ${response.status}: ${response.statusText}`);
        }
        const data = await response.json();
        AFDB.log('SUCCESS', 'PROXY', `Successfully parsed JSON response via Primary Worker!`);
        return data;
      } catch (err) {
        AFDB.log('WARN', 'PROXY', `Primary Worker Failed: ${err.message}. Routing to proxy rotation...`);
        return await rotateAndFetch(url);
      }
    }

    async function rotateAndFetch(url) {
      for (let i = 0; i < PROXY_ROTATION_FALLBACKS.length; i++) {
        const baseProxy = PROXY_ROTATION_FALLBACKS[i];
        const rotatedUrl = baseProxy + encodeURIComponent(url);
        AFDB.log('FETCH', 'ROTATION', `[Attempt #${i+1}] Trying alternative proxy: ${baseProxy}`);
        try {
          const response = await fetch(rotatedUrl);
          AFDB.log('FETCH', 'ROTATION', `[Attempt #${i+1}] Response Status: ${response.status}`);
          if (response.ok) {
            const data = await response.json();
            const finalData = data.contents ? JSON.parse(data.contents) : data;
            const keys = Object.keys(finalData);
            AFDB.log('ENGINE', 'PARSING', `Proxy returned keys: ${keys.join(', ')}`);
            AFDB.log('SUCCESS', 'ROTATION', `✅ Rotated Proxy #${i+1} successfully bypassed Cloudflare! Data loaded.`);
            return finalData;
          }
        } catch (err) {
          AFDB.log('WARN', 'ROTATION', `[Attempt #${i+1}] Proxy failed: ${err.message}`);
        }
      }
      throw new Error("All rotated proxies were blocked by Sofascore's shield.");
    }

    function getLocalDateKey(offset = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offset);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

      if (!rawName) {
        alert("Please enter a player name first.");
        return;
      }
      const searchName = rawName.split(",")[0].trim();
      const searchUrl = `https://api.sofascore.com/api/v1/search/all?q=${encodeURIComponent(searchName)}`;
      _clipboardPhase[side] = 'search';
      _clipboardReady = false;
      setTimeout(() => { _clipboardReady = true; }, 2500);

      const statusEl = document.getElementById("fetchStatus");
      statusEl.className = "loading";
      statusEl.textContent = `🔍 Search open for Player ${side} — copy all text in Safari, then return here.`;

      const idInput = document.getElementById(side === "A" ? "playerAId" : "playerBId");
      const linkEl = document.getElementById(side === "A" ? "playerALink" : "playerBLink");
      const idVal = idInput.value.trim();

      const sheet = document.createElement('div');
      sheet.style.cssText = 'background:var(--panel);width:100%;max-height:65vh;overflow-y:auto;padding:14px;box-sizing:border-box;';
      sheet.innerHTML = `<div style="font-size:11px;font-weight:900;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.8px;">Multiple players found — pick Player ${side}</div>`;

      candidates.slice(0, 12).forEach(c => {
        const btn = document.createElement('button');
        btn.style.cssText = 'width:100%;text-align:left;padding:10px 12px;margin-bottom:6px;background:var(--panel-soft);border:1px solid var(--panel-border);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center;box-sizing:border-box;';
        const flag = c.country ? ` · ${c.country}` : '';
        const pop = c.userCount ? ` · ${c.userCount} matches` : '';
        const sport = c.sport ? ` [${c.sport}]` : '';
        btn.innerHTML = `<span>${c.name}${flag}${pop}<span style="color:#d98a00;font-size:10px;font-weight:800;">${sport}</span></span><span style="color:var(--muted);font-size:10px;font-weight:800;">ID ${c.id}</span>`;
        btn.onclick = () => {

          document.getElementById(side === 'A' ? 'playerAId' : 'playerBId').value = c.id;

          updateHelperLinks(side);
          _openStatsForPlayer(side, c.id, c.name);

      });

      const cancelBtn = document.createElement('button');
      cancelBtn.style.cssText = 'width:100%;padding:10px;background:#c91920;color:#fff;border:none;font-size:12px;font-weight:800;cursor:pointer;margin-top:6px;';
      cancelBtn.textContent = '✕  Cancel';
      cancelBtn.onclick = () => { overlay.remove(); _clipboardPhase[side] = null; };
      sheet.appendChild(cancelBtn);

      overlay.appendChild(sheet);
      document.body.appendChild(overlay);
    }

    async function autoClipboardParse(side) {
      if (!_clipboardReady) return;
      const phase = _clipboardPhase[side];
      if (!phase) return;

      const statusEl = document.getElementById("fetchStatus");
      try {
        const text = await navigator.clipboard.readText();
        if (!text || text.length < 10) return;

        if (phase === 'search') {
          const parsed = JSON.parse(text);
          const results = parsed.results || [];
          const mapResult = r => ({
            id: String(r.entity.id),
            name: r.entity.name || '',
            country: r.entity.country?.name || '',
            userCount: r.entity.userCount || 0,
            sport: r.entity.sport?.name || ''
          });

          const ttResults = results
            .filter(r => r.type === 'team' && r.entity?.sport?.slug === 'table-tennis')
            .map(mapResult);

          const teamResults = ttResults.length > 0
            ? ttResults
            : results.filter(r => r.type === 'team').map(mapResult);

          _clipboardPhase[side] = null;

          if (teamResults.length === 0) {
            statusEl.className = "err";
            statusEl.textContent = `❌ No players found. Sportybet may have a typo — check correct spelling at sofascore.com, search again.`;
            return;
          }

          if (ttResults.length > 0) {
            const p = ttResults[0];
            document.getElementById(side === 'A' ? 'playerAId' : 'playerBId').value = p.id;
            document.getElementById(side === 'A' ? 'playerAName' : 'playerBName').value = p.name;
            updateHelperLinks(side);
            _openStatsForPlayer(side, p.id, p.name);
          } else {
            statusEl.className = "err";
            statusEl.textContent = `⚠️ No TT player found for Player ${side} — showing all results. Pick manually.`;
            showPlayerPicker(side, teamResults);
          }

        } else if (phase === 'stats') {
          if (!text.includes('"events"')) return;
          const parsed = JSON.parse(text);
          const events = parsed.events || [];
          if (events.length === 0) return;

          const idVal = document.getElementById(side === 'A' ? 'playerAId' : 'playerBId').value.trim();
          if (!idVal) {
            statusEl.className = "err";
            statusEl.textContent = `❌ No Player ${side} ID. Run search again.`;
            _clipboardPhase[side] = null;
            return;
          }

          const stats = processPlayerPoints(events, idVal, `Player ${side}`);
          if (side === 'A') {
            document.getElementById("playerAPointsScored").value = stats.scoredList.join(",");
            document.getElementById("playerAPointsAllowed").value = stats.allowedList.join(",");
            document.getElementById("playerASet1Scored").value = stats.set1ScoredList.join(",");
            document.getElementById("playerASet1Allowed").value = stats.set1AllowedList.join(",");
            window.rawEventsA = events;
            window._rawJsonA = text;
          } else {
            document.getElementById("playerBPointsScored").value = stats.scoredList.join(",");
            document.getElementById("playerBPointsAllowed").value = stats.allowedList.join(",");
            document.getElementById("playerBSet1Scored").value = stats.set1ScoredList.join(",");
            document.getElementById("playerBSet1Allowed").value = stats.set1AllowedList.join(",");
            window.rawEventsB = events;
            window._rawJsonB = text;
          }

          analyzeFatigueAndH2H();

          document.getElementById("marketSection").classList.remove("collapsed");
          document.getElementById("playerASection").classList.remove("collapsed");
          document.getElementById("playerBSection").classList.remove("collapsed");

          statusEl.className = "ok";
          statusEl.textContent = `✅ Player ${side} stats auto-filled!`;
          AFDB.log('SUCCESS', 'AUTOFILL', `Player ${side} form filled from stats JSON.`);
          _clipboardPhase[side] = null;
        }
      } catch(e) {
        AFDB.log('WARN', 'AUTOFILL', `Clipboard relay skipped: ${e.message}`);
      }
    }

    function clearAll() {
      ["playerAPointsScored","playerAPointsAllowed","playerASet1Scored","playerASet1Allowed",
       "playerBPointsScored","playerBPointsAllowed","playerBSet1Scored","playerBSet1Allowed",
       "matchPointsLine","set1PointsLine","h2hSetsA","h2hSetsB","h2hSet1A","h2hSet1B",
       "playerAName","playerBName","playerAId","playerBId","pasteA","pasteB"].forEach(id => {
        const el = document.getElementById(id); if (el) el.value = "";
      });
      
      const ls = document.getElementById("leagueSelect");
      if (ls) ls.value = "";

      const cb = document.getElementById("useFTH2H"); if (cb) cb.checked = false;
      const tbl = document.getElementById("results"); if (tbl) tbl.style.display = "none";
      const tb  = document.getElementById("resultsBody"); if (tb) tb.innerHTML = "";
      const st  = document.getElementById("fetchStatus"); if (st) st.textContent = "";

      const fs = document.getElementById("fetchSection");
      if (fs) fs.style.display = "none";

      document.querySelectorAll(".section").forEach(s => s.classList.add("collapsed"));
      const lsSec = document.getElementById("leagueSection");
      if (lsSec) lsSec.classList.remove("collapsed");

      window.rawEventsA = null;
      window.rawEventsB = null;

      AFDB.log('ENGINE','CLEAR','All fields cleared, sections collapsed, page started afresh.');
    }

    // ── Dom Initialization and Clipboard Listeners ──────────────────────────
    document.addEventListener("DOMContentLoaded", () => {
      applySavedTheme();

      const themeToggleBtn = document.getElementById("themeToggleBtn");
      if (themeToggleBtn) themeToggleBtn.addEventListener("click", toggleTheme);

      makeSectionsCollapsible();
      document.querySelectorAll(".section").forEach(s => s.classList.add("collapsed"));
      document.getElementById("leagueSection").classList.remove("collapsed");

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && _clipboardReady) {
          ['A', 'B'].forEach(side => {
            if (_clipboardPhase[side]) autoClipboardParse(side);
          });
        }
      });

      AFDB.log('BOOT', 'ENGINE', `Table Tennis Engine successfully initialized. Session ID: sess_${Date.now()}`);
    });
  </script>
</body>
