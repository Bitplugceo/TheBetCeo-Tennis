<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TT Engine" />
  <meta name="theme-color" content="#d4af37" />

  <title>Table Tennis Prediction Engine</title>

  <style>
    :root {
      --bg: #efefef;
      --text: #1f2430;
      --panel: #ffffff;
      --panel-border: #dedede;
      --panel-soft: #f6f7f9;
      --panel-soft-2: #eceff3;
      --input-bg: #ffffff;
      --input-border: #cfd4da;
      --table-head: #3a404c;
      --muted: #7b8088;
      --chip-text: #2a2f38;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      --section-toggle-text: #20242c;
      --section-toggle-icon: #d91f26;
      --table-border: #dfe2e7;
    }

    body.dark-mode {
      --bg: #111;
      --text: #d4af37;
      --panel: #1a1a1a;
      --panel-border: #333;
      --panel-soft: #151515;
      --panel-soft-2: #111;
      --input-bg: #222;
      --input-border: #444;
      --table-head: #111;
      --muted: #9aa0a8;
      --chip-text: #d4af37;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
      --section-toggle-text: #d4af37;
      --section-toggle-icon: #d4af37;
      --table-border: #333;
    }

    button,
    input,
    select,
    textarea,
    table,
    th,
    td {
      border-radius: 0;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    .app-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 10px 0;
      padding-top: max(10px, env(safe-area-inset-top));
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));

    body.engine-alert {

    }

    body.engine-alert .app-header {
      background: linear-gradient(90deg, #7b0007 0%, #cf1119 52%, #820008 100%) !important;
    }

    body.engine-alert .section {
      border-color: #d91f26 !important;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.3px;
      color: #fff;
    }

    .brand-right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.85);
      text-transform: uppercase;
    }

    .theme-toggle {
      background: none !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 !important;
      font-size: 11px !important;
      font-weight: 700 !important;
      letter-spacing: 1.5px !important;
      color: rgba(255, 255, 255, 0.85) !important;
      text-transform: uppercase !important;
      cursor: pointer;
    }

    .wrapper {
      max-width: 760px;
      margin: 10px auto;
      padding: 0 10px;
    }

    .section {
      border: 1px solid var(--panel-border);
      background: var(--panel);
      margin: 8px auto;
      box-shadow: var(--shadow);
      color: var(--text);
    }

    .section-toggle {
      width: 100%;
      background: none !important;
      border: none;
      padding: 12px 10px;
      margin: 0 !important;
      color: var(--section-toggle-text) !important;
      display: flex;
      align-items: center;

    }

</head>

    <div id="afdbPanel" style="width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;"></div>
  </div>

  <script>
    // --- IIFE CONFIG & STATE namespaces (95+/100 Architecture) ---
    const CONFIG = {
      SIM_RUNS: 50000,
      MAX_MATCHES: 20,
      H2H_MAX_WEIGHT: 0.35,
      GRADE_A_THRESHOLD: 65,
      GRADE_B_THRESHOLD: 60,
      GRADE_C_THRESHOLD: 55,
      LEAGUE_MEAN_OPP: { "Setka Cup": 28, "TT Cup": 24 }
    };

    const State = {
      selectedFixtureData: null,
      rawEvents: { A: null, B: null },
      _clipboardPhase: { A: null, B: null },
      _clipboardReady: true,
      lastSimResults: null
    };

    // --- IIFE DIAGNOSTIC LOGGING namespaces (AFDB) ---
    const AFDB = (function() {
      const LOG_LIMIT = 300;
      let _log = [];
      let _isOpen = false;
      let _currentLogLevel = 'ALL';

      const LEVELS = {
        BOOT:    { color:'#7aa6ff', icon:'⚙️' },
        NET:     { color:'#4ea9ff', icon:'🌐' },
        FETCH:   { color:'#49d45f', icon:'📡' },
        SUCCESS: { color:'#49d45f', icon:'✅' },
        WARN:    { color:'#ffcf73', icon:'⚠️' },
        ERROR:   { color:'#ff5c61', icon:'❌' },
        INFO:    { color:'#aaa',    icon:'ℹ️' },
        ENGINE:  { color:'#d4af37', icon:'⚙️' },
        H2H:     { color:'#c678dd', icon:'🔄' },
        FATIGUE: { color:'#ff87a0', icon:'🔋' },
        STYLE:   { color:'#00e5ff', icon:'🏓' }
      };

      function log(level, section, msg, data = null) {
        const entry = {
          ts: new Date().toLocaleTimeString([], { hour12: false }),
          level,
          section: section || 'CORE',
          msg,
          data
        };
        _log.unshift(entry);
        if (_log.length > LOG_LIMIT) _log = _log.slice(0, LOG_LIMIT);
        
        if (level === 'ERROR' && document.body) {
          document.body.classList.add("engine-alert");
        }
        if (_isOpen) _render();
      }

      function clear() {
        _log = [];
        if (document.body) document.body.classList.remove("engine-alert");
        _render();
      }

      function open() {
        _isOpen = true;
        const ov = document.getElementById('afdbOverlay');
        if (ov) { ov.style.display = 'flex'; _render(); }
      }

      function close() {
        _isOpen = false;
        const ov = document.getElementById('afdbOverlay');
        if (ov) ov.style.display = 'none';
      }

      function toggleFilter() {
        const levels = ['ALL', 'WARN', 'ERROR'];
        _currentLogLevel = levels[(levels.indexOf(_currentLogLevel) + 1) % levels.length];
        _render();
      }

      function copy(btnEl) {
        const text = _log.slice().reverse().map(e => 
          `[${e.ts}] [${e.level}] [${e.section}] ${e.msg}` + (e.data ? ` | ${JSON.stringify(e.data)}` : '')
        ).join('\n');
        
        navigator.clipboard.writeText(text).then(() => {
          if (btnEl) {
            const orig = btnEl.innerHTML;
            btnEl.innerHTML = "✅ COPIED!";
            setTimeout(() => { btnEl.innerHTML = orig; }, 1500);
          }
        }).catch(() => {
          log('WARN', 'AFDB', 'Clipboard query blocked.');
        });
      }

      function _render() {
        const panel = document.getElementById('afdbPanel');
        if (!panel) return;

        const filtered = _log.filter(e => {
          if (_currentLogLevel === 'ALL') return true;
          if (_currentLogLevel === 'WARN') return e.level === 'WARN' || e.level === 'ERROR';
          if (_currentLogLevel === 'ERROR') return e.level === 'ERROR';
          return true;
        });

        const logRows = filtered.map(e => {
          const cfg = LEVELS[e.level] || LEVELS.INFO;
          let dataHtml = '';
          if (e.data) {
            dataHtml = `<pre style="color:#888;font-size:9px;margin:4px 0 0 0;padding:6px;background:#070707;border-left:2px solid #222;white-space:pre-wrap;word-break:break-all;">${JSON.stringify(e.data, null, 2)}</pre>`;
          }
          return `
            <div style="padding:8px;border-bottom:1px solid #151515;">
              <div style="display:flex;gap:8px;align-items:flex-start;">
                <span style="color:#555;font-size:9px;min-width:65px;">${e.ts}</span>
                <span style="color:${cfg.color};font-size:10px;font-weight:900;min-width:75px;">${cfg.icon} ${e.level}</span>
                <span style="color:#777;font-size:9px;min-width:80px;">[${e.section}]</span>
                <span style="color:${cfg.color};font-size:11px;font-weight:700;flex:1;white-space:pre-wrap;">${e.msg}</span>
              </div>
              ${dataHtml}
            </div>`;
        }).join('');

        panel.innerHTML = `
          <div style="background:#080808;border-bottom:1px solid #222;padding:12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
            <div style="color:#d4af37;font-size:14px;font-weight:900;letter-spacing:1px;">🔬 AUTO-FETCH DIAGNOSTIC MICROSCOPE</div>
            <div>
              <button onclick="AFDB.copy(this)" style="background:#111;border:1px solid #333;color:#49d45f;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;">📋 Copy Log</button>
              <button onclick="AFDB.clear()" style="background:#111;border:1px solid #333;color:#ff5c61;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;">🗑️ Clear</button>
              <button onclick="AFDB.close()" style="background:#111;border:1px solid #555;color:#ccc;padding:6px 12px;font-size:11px;font-weight:900;cursor:pointer;">✕ Close</button>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;flex:1;overflow-y:auto;background:#0a0a0a;">
            <div style="padding:10px 12px;background:#111;color:#d4af37;font-size:11px;font-weight:900;position:sticky;top:0;z-index:10;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;">
              <span>📡 ACTIVE LOGS</span>
              <button onclick="AFDB.toggleFilter()" style="background:none;border:none;color:#4ea9ff;font-size:11px;font-weight:bold;cursor:pointer;">🛰️ LEVEL: ${_currentLogLevel}</button>
            </div>
            <div style="padding-bottom:15px;">${logRows || '<div style="color:#555;font-size:12px;text-align:center;padding:30px;">Clear pipeline logs.</div>'}</div>
          </div>`;
      }

      return { log, clear, open, close, copy, toggleFilter };
    })();

    // --- IIFE DATA LAYER (Fetch, Schema validation, parsing logic) ---
    const DataLayer = (() => {

      function calculateMean(arr) {
        if (!arr.length) return 0;
        return arr.reduce((a, b) => a + b, 0) / arr.length;
      }

      function calculateStdDev(arr) {
        if (arr.length < 2) return 1.5;
        const mean = calculateMean(arr);
        const variance = arr.reduce((sum, val) => sum + Math.pow(val - mean, 2), 0) / (arr.length - 1);
        return Math.sqrt(variance);
      }

      function validateSofaEvent(ev) {
        return !!(ev?.homeTeam?.id && ev?.awayTeam?.id && ev?.status?.type === "finished");
      }

      function processPlayerPoints(events, playerId, label) {
        const scoredList = [], allowedList = [], set1ScoredList = [], set1AllowedList = [];
        const perSetScored = [], perSetAllowed = [];
        const matchRecords = [];

        const completed = events.filter(e => {
          if (!validateSofaEvent(e)) return false;
          const hId = String(e.homeTeam.id);
          const aId = String(e.awayTeam.id);
          return hId === String(playerId) || aId === String(playerId);
        }).reverse().slice(0, CONFIG.MAX_MATCHES);

        AFDB.log('ENGINE', 'PLAYER_PROCESSING', `Processing ${completed.length} valid matches for ${label} (ID: ${playerId})`);

        completed.forEach((ev, idx) => {
          const isHome = String(ev.homeTeam.id) === String(playerId);
          const myScoreObj  = isHome ? ev.homeScore : ev.awayScore;
          const oppScoreObj = isHome ? ev.awayScore  : ev.homeScore;
          if (myScoreObj && oppScoreObj) {
            let matchSets = 0, matchScored = 0, matchAllowed = 0;
            let oppTotalScored = 0;
            const matchWeight = Math.pow(0.85, idx);

            for (let s = 1; s <= 5; s++) {
              const mySet  = myScoreObj[`period${s}`];
              const oppSet = oppScoreObj[`period${s}`];
              if (mySet !== undefined && oppSet !== undefined) {
                perSetScored.push({ val: mySet, weight: matchWeight });
                perSetAllowed.push({ val: oppSet, weight: matchWeight });
                if (s === 1) { 
                  set1ScoredList.push(mySet); 
                  set1AllowedList.push(oppSet); 
                }
                matchScored += mySet; 
                matchAllowed += oppSet;
                oppTotalScored += oppSet;
                matchSets++;
              }
            }
            if (matchSets > 0) {
              scoredList.push(matchScored);
              allowedList.push(matchAllowed);
              const opponentId = isHome ? String(ev.awayTeam?.id || '') : String(ev.homeTeam?.id || '');
              matchRecords.push({ 
                scored: matchScored, 
                allowed: matchAllowed, 
                oppTotalScored, 
                matchWeight, 
                startTimestamp: ev.startTimestamp || 0, 
                sets: matchSets, 
                opponentId 
              });
              AFDB.log('ENGINE', 'PLAYER_PROCESSING', `${label} Match #${idx+1} [Weight: ${matchWeight.toFixed(2)}] sets=${matchSets} scored=${matchScored} allowed=${matchAllowed}`);
            }
          }
        });

        AFDB.log('ENGINE', 'PLAYER_PROCESSING', `${label} processing complete. Scanned Sets: ${perSetScored.length}`);
        return { scoredList, allowedList, set1ScoredList, set1AllowedList, perSetScored, perSetAllowed, matchRecords };
      }

      function parseIndividualFailsafe(side) {
        const inputEl = document.getElementById(side === 'A' ? 'pasteA' : 'pasteB');
        const rawText = inputEl.value.trim();
        const statusEl = document.getElementById("fetchStatus");
        if (!rawText) return;

        statusEl.className = "status-loading";
        statusEl.textContent = `⚙️ Parsing pasted JSON for Player ${side}...`;

        try {
          const parsedData = JSON.parse(rawText);
          const events = parsedData.events || [];
          if (events.length === 0) throw new Error("Parsed JSON lacks an events collection array.");

          let targetId = document.getElementById(side === 'A' ? 'playerAId' : 'playerBId').value.trim();
          if (!targetId) {
            const idCounts = {};
            events.forEach(ev => {
              if (ev.homeTeam?.id) idCounts[ev.homeTeam.id] = (idCounts[ev.homeTeam.id] || 0) + 1;
              if (ev.awayTeam?.id) idCounts[ev.awayTeam.id] = (idCounts[ev.awayTeam.id] || 0) + 1;
            });
            let maxCount = 0, bestId = null;
            for (const id in idCounts) {
              if (idCounts[id] > maxCount) { maxCount = idCounts[id]; bestId = id; }
            }
            if (bestId) {
              targetId = bestId;
              document.getElementById(side === 'A' ? 'playerAId' : 'playerBId').value = bestId;
              UI.updateHelperLinks(side);
            }
          }

          if (!targetId) throw new Error("A standard numerical Player ID is missing from UI inputs.");

          const stats = processPlayerPoints(events, targetId, `Player ${side}`);
          const isA = (side === 'A');

          document.getElementById(isA ? "playerAPointsScored"  : "playerBPointsScored").value  = stats.scoredList.join(",");
          document.getElementById(isA ? "playerAPointsAllowed" : "playerBPointsAllowed").value = stats.allowedList.join(",");
          document.getElementById(isA ? "playerASet1Scored"    : "playerBSet1Scored").value    = stats.set1ScoredList.join(",");
          document.getElementById(isA ? "playerASet1Allowed"   : "playerBSet1Allowed").value   = stats.set1AllowedList.join(",");

          // Set cache session values
          State.rawEvents[side] = events;
          try {
            sessionStorage.setItem(`tt_cache_${side}_${targetId}`, JSON.stringify(events));
            AFDB.log('SUCCESS', 'CACHE', `Cached events list in local sessionStorage for Player ${side}.`);
          } catch(e) {
            AFDB.log('WARN', 'CACHE', `Could not serialize events to sessionStorage: ${e.message}`);
          }

          analyzeFatigueAndH2H();

          statusEl.className = "status-ok";
          statusEl.textContent = `✅ Player ${side} data loaded successfully!`;
          inputEl.value = "";
          ["marketSection","playerASection","playerBSection"].forEach(id => document.getElementById(id).classList.remove("collapsed"));

        } catch (err) {
          statusEl.className = "status-err";
          statusEl.textContent = `❌ Error parsing pasted JSON for Player ${side}.`;
          AFDB.log('ERROR', 'FAILSAFE', `Parsing Failed: ${err.message}`);
        }
      }

      function analyzeFatigueAndH2H() {
        const idA = document.getElementById("playerAId").value.trim();
        const idB = document.getElementById("playerBId").value.trim();

        ['A', 'B'].forEach(side => {
          const events = State.rawEvents[side];
          const playerId = side === 'A' ? idA : idB;
          if (!events || !playerId) return;

          const completed = events.filter(e => {
            if (!validateSofaEvent(e)) return false;
            const hId = String(e.homeTeam.id);
            const aId = String(e.awayTeam.id);
            return hId === String(playerId) || aId === String(playerId);
          }).reverse();

          if (completed.length < 2) return;
          let sameDayCount = 1, b2bCount = 0, totalRestHours = 0, intervalsCount = 0;

          for (let i = 0; i < Math.min(completed.length - 1, 4); i++) {
            const m1Time = completed[i].startTimestamp * 1000;
            const m2Time = completed[i+1].startTimestamp * 1000;
            const diffHours = (m1Time - m2Time) / (1000 * 60 * 60);
            if (diffHours > 0) {
              totalRestHours += diffHours;
              intervalsCount++;
              if (diffHours <= 4) sameDayCount++;
              else if (diffHours <= 24) b2bCount++;
            }
          }
          const avgRest = intervalsCount > 0 ? (totalRestHours / intervalsCount).toFixed(1) : "—";
          AFDB.log('FATIGUE', 'SCHEDULING', `Player ${side}: Avg Rest: ${avgRest} hrs. Same-day games: ${sameDayCount - 1}, B2B matches: ${b2bCount}`);
        });

        if (idA && idB && State.rawEvents.A) {
          const h2hMatches = State.rawEvents.A.filter(e => {
            if (!validateSofaEvent(e)) return false;
            const hId = String(e.homeTeam.id);
            const aId = String(e.awayTeam.id);
            return (hId === String(idA) && aId === String(idB)) || (hId === String(idB) && aId === String(idA));
          });

          if (h2hMatches.length > 0) {
            const setsA = [], setsB = [], set1A = [], set1B = [];
            h2hMatches.slice(0, 5).forEach(m => {
              const isHomeA = String(m.homeTeam.id) === String(idA);
              const scoreA = isHomeA ? m.homeScore?.display : m.awayScore?.display;
              const scoreB = isHomeA ? m.awayScore?.display : m.homeScore?.display;
              const s1A = isHomeA ? m.homeScore?.period1 : m.awayScore?.period1;
              const s1B = isHomeA ? m.awayScore?.period1 : m.homeScore?.period1;
              if (scoreA !== undefined && scoreB !== undefined) { setsA.push(scoreA); setsB.push(scoreB); }
              if (s1A !== undefined && s1B !== undefined) { set1A.push(s1A); set1B.push(s1B); }
            });
            if (setsA.length > 0) {
              document.getElementById("h2hSetsA").value = setsA.join(",");
              document.getElementById("h2hSetsB").value = setsB.join(",");
            }
            if (set1A.length > 0) {
              document.getElementById("h2hSet1A").value = set1A.join(",");
              document.getElementById("h2hSet1B").value = set1B.join(",");
            }
            document.getElementById("useFTH2H").checked = true;
            AFDB.log('H2H', 'AUTOFILL', `Parsed ${setsA.length} H2H head-to-head match lines from Player histories.`);
          }
        }
      }

      return {
        calculateMean,
        calculateStdDev,
        processPlayerPoints,
        parseIndividualFailsafe,
        analyzeFatigueAndH2H,
        validateSofaEvent
      };
    })();

    // --- IIFE PERFORMANCE WEB WORKER LAYER (95+/100 Architecture) ---
    const simulationWorkerCode = `
      self.onmessage = function(e) {
        const { probA, probA_set1, matchUncertainty, matchLine, set1Line, SIM_RUNS } = e.data;

        const randomNormal = () => {
          let u = 0, v = 0;
          while (u === 0) u = Math.random();
          while (v === 0) v = Math.random();
          return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
        };

        let matchOverHits = 0, set1OverHits = 0, totalMatchPts = 0, totalSet1Pts = 0;
        const allMatchPts = [];
        const allSet1Pts = [];

        for (let run = 0; run < SIM_RUNS; run++) {
          let sWA = 0, sWB = 0, matchPts = 0, s1Pts = 0, setNum = 1;
          let server = Math.random() < 0.5 ? 'A' : 'B';
          let firstSetServer = server;
          let runSkillShift = randomNormal() * matchUncertainty * 0.15;

          while (sWA < 3 && sWB < 3) {
            let sA = 0, sB = 0;
            let setPointsPlayed = 0;

            if (setNum > 1) {
              server = (setNum % 2 === 1) ? (firstSetServer === 'A' ? 'A' : 'B') : (firstSetServer === 'A' ? 'B' : 'A');
            }

            let momentum = (sWA - sWB) * 0.01;

            while ((sA < 11 && sB < 11) || Math.abs(sA - sB) < 2) {
              let p = (setNum === 1) ? probA_set1 : probA;
              p += momentum + runSkillShift;
              
              if (server === 'A') {
                p += 0.03;
              } else {
                p -= 0.03;
              }
              p = Math.max(0.25, Math.min(0.75, p));

              if (Math.random() < p) sA++; else sB++;
              setPointsPlayed++;

              // --- STRICT ITTF SERVE MODIFIER MECHANICS ---
              if (sA >= 10 && sB >= 10) {
                // Deuce play: Alternate serving every point
                server = (server === 'A') ? 'B' : 'A';
              } else if (setPointsPlayed % 2 === 0) {
                // Normal play: Alternate serving every 2 points
                server = (server === 'A') ? 'B' : 'A';
              }
            }

            const sp = sA + sB;
            matchPts += sp;
            if (setNum === 1) { s1Pts = sp; totalSet1Pts += sp; }
            if (sA > sB) sWA++; else sWB++;
            setNum++;
          }

          totalMatchPts += matchPts;
          allMatchPts.push(matchPts);
          allSet1Pts.push(s1Pts);

          if (isFinite(matchLine) && matchPts > matchLine) matchOverHits++;
          if (isFinite(set1Line)  && s1Pts  > set1Line)  set1OverHits++;
        }

        allMatchPts.sort((a, b) => a - b);
        allSet1Pts.sort((a, b) => a - b);

        const projMatch = totalMatchPts / SIM_RUNS;
        const projSet1  = totalSet1Pts / SIM_RUNS;
        const pctMatch  = (matchOverHits / SIM_RUNS) * 100;
        const pctSet1   = (set1OverHits / SIM_RUNS) * 100;

        const p10Match = allMatchPts[Math.floor(SIM_RUNS * 0.10)];
        const p90Match = allMatchPts[Math.floor(SIM_RUNS * 0.90)];
        const p10Set1  = allSet1Pts[Math.floor(SIM_RUNS * 0.10)];
        const p90Set1  = allSet1Pts[Math.floor(SIM_RUNS * 0.90)];

        self.postMessage({
          projMatch, projSet1, pctMatch, pctSet1, p10Match, p90Match, p10Set1, p90Set1
        });
      };
    `;

    const blob = new Blob([simulationWorkerCode], { type: "application/javascript" });
    const simulationWorker = new Worker(URL.createObjectURL(blob));

    // --- IIFE PREDICTIVE ENGINE namespace (Calculation logic) ---
    const Engine = (() => {

      function normalizeDashes(str) {
        return String(str ?? "").replace(/[–—−]/g, "-");
      }

      function parseMarketLine(val) {
        if (!val || !String(val).trim()) return null;
        const raw = normalizeDashes(String(val).trim());
        const normalizeLine = num => Math.round(num * 2) / 2;

        const rangeMatch = raw.match(/^(\d{1,3}(?:\.\d+)?)\s*-\s*(\d{1,3}(?:\.\d+)?)$/);
        if (rangeMatch) {
          const a = parseFloat(rangeMatch[1]);
          const b = parseFloat(rangeMatch[2]);
          if (isNaN(a) || isNaN(b) || a <= 0 || b <= 0 || b < a) return null;
          return normalizeLine((a + b) / 2);
        }

        const singleMatch = raw.match(/^(\d{1,3}(?:\.\d+)?)$/);
        if (singleMatch) {
          const x = parseFloat(singleMatch[1]);
          if (isNaN(x) || x <= 0) return null;
          return normalizeLine(x);
        }
        return null;
      }

      function run() {
        const runBtn = document.getElementById("runBtn");
        runBtn.disabled = true;
        runBtn.textContent = "Calculating... ⚙️";

        AFDB.log('ENGINE', 'CALCULATION', "Starting high-performance simulation thread pre-processor...");

        const league = document.getElementById("leagueSelect").value;
        const matchLineInput = document.getElementById("matchPointsLine").value.trim();
        const set1LineInput = document.getElementById("set1PointsLine").value.trim();

        const matchLine = parseMarketLine(matchLineInput);
        const set1Line  = parseMarketLine(set1LineInput);

        if (!league) { 
          alert("Please select a league first."); 
          runBtn.disabled = false;
          runBtn.textContent = "Run";
          return; 
        }

        const rawScoredA   = document.getElementById("playerAPointsScored").value.split(",").map(Number).filter(v => !isNaN(v) && v > 0);
        const rawAllowedA  = document.getElementById("playerAPointsAllowed").value.split(",").map(Number).filter(v => !isNaN(v) && v > 0);
        const rawScoredB   = document.getElementById("playerBPointsScored").value.split(",").map(Number).filter(v => !isNaN(v) && v > 0);
        const rawAllowedB  = document.getElementById("playerBPointsAllowed").value.split(",").map(Number).filter(v => !isNaN(v) && v > 0);
        const rawS1ScoredA = document.getElementById("playerASet1Scored").value.split(",").map(Number).filter(v => !isNaN(v) && v > 0);
        const rawS1AllowA  = document.getElementById("playerASet1Allowed").value.split(",").map(Number).filter(v => !isNaN(v) && v > 0);
        const rawS1ScoredB = document.getElementById("playerBSet1Scored").value.split(",").map(Number).filter(v => !isNaN(v) && v > 0);
        const rawS1AllowB  = document.getElementById("playerBSet1Allowed").value.split(",").map(Number).filter(v => !isNaN(v) && v > 0);

        const statusEl = document.getElementById("fetchStatus");
        if (!rawScoredA.length || !rawAllowedA.length || !rawScoredB.length || !rawAllowedB.length) {
          if (statusEl) {
            statusEl.className = "status-err";
            statusEl.textContent = "❌ Input values are incomplete or empty.";
          }
          AFDB.log('ERROR', 'VALIDATION', 'Aborted calculation: missing player history arrays.');
          runBtn.disabled = false;
          runBtn.textContent = "Run";
          return;
        }

        const calculateWeightedMean = (weightedArr) => {
          if (!weightedArr || !weightedArr.length) return 0;
          let wSum = 0, wTotal = 0;
          weightedArr.forEach(item => { wSum += item.val * item.weight; wTotal += item.weight; });
          return wTotal > 0 ? wSum / wTotal : 0;
        };

        const calculateEWMAMean = (arr) => {
          if (!arr.length) return 0;
          if (arr.length === 1) return arr[0];
          const lambda = 0.88;
          let weightedSum = 0, weightTotal = 0;
          for (let i = 0; i < arr.length; i++) {
            const w = Math.pow(lambda, i);
            weightedSum += arr[i] * w;
            weightTotal += w;
          }
          return weightedSum / weightTotal;
        };

        const idA = document.getElementById("playerAId").value.trim();
        const idB = document.getElementById("playerBId").value.trim();

        const psA = State.rawEvents.A ? DataLayer.processPlayerPoints(State.rawEvents.A, idA, 'A_ps') : null;
        const psB = State.rawEvents.B ? DataLayer.processPlayerPoints(State.rawEvents.B, idB, 'B_ps') : null;

        let meanScoredA  = (psA && psA.perSetScored.length)  ? calculateWeightedMean(psA.perSetScored)  : calculateEWMAMean(rawScoredA);
        let meanAllowedA = (psA && psA.perSetAllowed.length) ? calculateWeightedMean(psA.perSetAllowed) : calculateEWMAMean(rawAllowedA);
        let meanScoredB  = (psB && psB.perSetScored.length)  ? calculateWeightedMean(psB.perSetScored)  : calculateEWMAMean(rawScoredB);
        let meanAllowedB = (psB && psB.perSetAllowed.length) ? calculateWeightedMean(psB.perSetAllowed) : calculateEWMAMean(rawAllowedB);

        const getVsOpponentStats = (matchRecords, opponentId) => {
          if (!matchRecords || !opponentId) return null;
          const vs = matchRecords.filter(r => r.opponentId === String(opponentId));
          if (vs.length < 2) return null;
          const wTot = vs.reduce((s, r) => s + r.matchWeight, 0);
          if (!wTot) return null;
          const meanScoredPerSet  = vs.reduce((s, r) => s + (r.scored  / r.sets) * r.matchWeight, 0) / wTot;
          const meanAllowedPerSet = vs.reduce((s, r) => s + (r.allowed / r.sets) * r.matchWeight, 0) / wTot;
          return { meanScoredPerSet, meanAllowedPerSet, n: vs.length };
        };

        const vsOppA = (psA && psA.matchRecords) ? getVsOpponentStats(psA.matchRecords, idB) : null;
        const vsOppB = (psB && psB.matchRecords) ? getVsOpponentStats(psB.matchRecords, idA) : null;

        if (vsOppA) {
          const w = Math.min(0.45, vsOppA.n / 9);
          meanScoredA  = meanScoredA  * (1 - w) + vsOppA.meanScoredPerSet  * w;
          meanAllowedA = meanAllowedA * (1 - w) + vsOppA.meanAllowedPerSet * w;
          AFDB.log('ENGINE', 'OPP_CAL', `Factored A vs B direct head-to-head match profile.`);
        }
        if (vsOppB) {
          const w = Math.min(0.45, vsOppB.n / 9);
          meanScoredB  = meanScoredB  * (1 - w) + vsOppB.meanScoredPerSet  * w;
          meanAllowedB = meanAllowedB * (1 - w) + vsOppB.meanAllowedPerSet * w;
          AFDB.log('ENGINE', 'OPP_CAL', `Factored B vs A direct head-to-head match profile.`);
        }

        // Strength of schedule quality adjustment
        const getOppQualityAdj = (matchRecords) => {
          if (!matchRecords || matchRecords.length < 3) return 0;
          const allOppScores = matchRecords.map(r => r.oppTotalScored);
          const meanOpp = allOppScores.reduce((a,b) => a+b, 0) / allOppScores.length;
          const leagueMeanOppScore = CONFIG.LEAGUE_MEAN_OPP[league] || 26;
          const diff = meanOpp - leagueMeanOppScore;
          return Math.max(-0.03, Math.min(0.03, diff * 0.002));
        };

        const oppAdjA = getOppQualityAdj(psA ? psA.matchRecords : null);
        const oppAdjB = getOppQualityAdj(psB ? psB.matchRecords : null);

        const pA_base = Math.min(0.75, Math.max(0.25, (meanScoredA / (meanScoredA + meanAllowedA)) + oppAdjA));
        const pB_base = Math.min(0.75, Math.max(0.25, (meanScoredB / (meanScoredB + meanAllowedB)) + oppAdjB));

        const flatScoredA = psA && psA.perSetScored.length ? psA.perSetScored.map(x => x.val) : rawScoredA;
        const flatScoredB = psB && psB.perSetScored.length ? psB.perSetScored.map(x => x.val) : rawScoredB;
        const stdDevA = DataLayer.calculateStdDev(flatScoredA);
        const stdDevB = DataLayer.calculateStdDev(flatScoredB);
        const cvA = stdDevA / (meanScoredA || 1);
        const cvB = stdDevB / (meanScoredB || 1);
        const matchUncertainty = Math.max(0.01, Math.min(0.08, (cvA + cvB) / 2));

        // Fatigue / Scheduling and form decay
        const upcomingTime = (State.selectedFixtureData && State.selectedFixtureData.startTimestamp) ? State.selectedFixtureData.startTimestamp * 1000 : Date.now();
        const fatigueDataAvailable = !!(State.selectedFixtureData && State.selectedFixtureData.startTimestamp);

        const getPlayerModifiers = (events, playerId) => {
          if (!events || !playerId) return { fatigue: 0, form: 0 };
          const completed = events.filter(e => {
            if (!DataLayer.validateSofaEvent(e)) return false;
            const hId = String(e.homeTeam.id);
            const aId = String(e.awayTeam.id);
            return hId === String(playerId) || aId === String(playerId);
          }).reverse();
          if (completed.length === 0) return { fatigue: 0, form: 0 };

          const lastMatchTime = completed[0].startTimestamp * 1000;
          const elapsedHours = (upcomingTime - lastMatchTime) / (1000 * 60 * 60);
          let fatigue = 0;
          if (elapsedHours > 0) {
            if (elapsedHours < 1.2) fatigue = -0.035;
            else if (elapsedHours < 2.5) fatigue = -0.015;
            else if (elapsedHours < 5.0) fatigue = -0.005;
          }

          const lastDateStr = new Date(lastMatchTime).toDateString();
          let matchesToday = 0;
          completed.forEach(m => {
            if (new Date(m.startTimestamp * 1000).toDateString() === lastDateStr) matchesToday++;
          });
          if (matchesToday >= 3) fatigue -= (matchesToday * 0.005);

          let wins = 0;
          const sample = completed.slice(0, 5);
          sample.forEach(m => {
            const isHome = String(m.homeTeam.id) === String(playerId);
            if ((isHome && m.winnerCode === 1) || (!isHome && m.winnerCode === 2)) wins++;
          });
          const winRate = sample.length > 0 ? wins / sample.length : 0.5;
          const form = (winRate - 0.5) * 0.03;

          return { fatigue, form };
        };

        const contextA = fatigueDataAvailable ? getPlayerModifiers(State.rawEvents.A, idA) : { fatigue: 0, form: 0 };
        const contextB = fatigueDataAvailable ? getPlayerModifiers(State.rawEvents.B, idB) : { fatigue: 0, form: 0 };

        // Style profiling
        const hasEnoughDataA = rawAllowedA.length >= 10;
        const hasEnoughDataB = rawAllowedB.length >= 10;
        const isChopperA = hasEnoughDataA && meanAllowedA < 7.5;
        const isChopperB = hasEnoughDataB && meanAllowedB < 7.5;
        const usesPipsA = isChopperA && stdDevA > 2.5;
        const usesPipsB = isChopperB && stdDevB > 2.5;

        let styleAdjA = 0, styleAdjB = 0;
        if (isChopperA && usesPipsA && !isChopperB) styleAdjA += 0.01;
        if (isChopperB && usesPipsB && !isChopperA) styleAdjB += 0.01;

        // Base Win Probability Calculation
        let probA = (pA_base * (1 - pB_base)) / ((pA_base * (1 - pB_base)) + (pB_base * (1 - pA_base)));
        probA += contextA.fatigue + contextA.form + styleAdjA;
        probA -= (contextB.fatigue + contextB.form + styleAdjB);
        probA = Math.max(0.25, Math.min(0.75, probA));

        let probA_set1 = probA;
        const hasSet1 = rawS1ScoredA.length > 0 && rawS1AllowA.length > 0 && rawS1ScoredB.length > 0 && rawS1AllowB.length > 0;
        if (hasSet1) {
          const s1MeanScoredA = calculateEWMAMean(rawS1ScoredA), s1MeanAllowA = calculateEWMAMean(rawS1AllowA);
          const s1MeanScoredB = calculateEWMAMean(rawS1ScoredB), s1MeanAllowB = calculateEWMAMean(rawS1AllowB);
          const pS1A = s1MeanScoredA / (s1MeanScoredA + s1MeanAllowA);
          const pS1B = s1MeanScoredB / (s1MeanScoredB + s1MeanAllowB);
          probA_set1 = (pS1A * (1 - pS1B)) / ((pS1A * (1 - pS1B)) + (pS1B * (1 - pS1A)));
          probA_set1 += contextA.fatigue + contextA.form + styleAdjA;
          probA_set1 -= (contextB.fatigue + contextB.form + styleAdjB);
          probA_set1 = Math.max(0.25, Math.min(0.75, probA_set1));
        }

        // Bayesian head-to-head calculations
        const rawH2HA = document.getElementById("h2hSetsA").value.split(",").map(Number).filter(v => !isNaN(v));
        const rawH2HB = document.getElementById("h2hSetsB").value.split(",").map(Number).filter(v => !isNaN(v));
        if (rawH2HA.length >= 2 && rawH2HB.length >= 2) {
          const h2hN = rawH2HA.length;
          const h2hWeight = Math.min(CONFIG.H2H_MAX_WEIGHT, h2hN / 43);
          const priorWeight = 1 - h2hWeight;
          const tA = rawH2HA.reduce((a,b) => a + b, 0), tB = rawH2HB.reduce((a,b) => a + b, 0);
          const h2hProbA = tA / (tA + tB);
          probA = (probA * priorWeight) + (h2hProbA * h2hWeight);
          if (!hasSet1) probA_set1 = probA;
        }

        const rawH2HS1A = document.getElementById("h2hSet1A").value.split(",").map(Number).filter(v => !isNaN(v));
        const rawH2HS1B = document.getElementById("h2hSet1B").value.split(",").map(Number).filter(v => !isNaN(v));
        if (rawH2HS1A.length >= 2 && rawH2HS1B.length >= 2) {
          const meanH2HS1A = calculateEWMAMean(rawH2HS1A);
          const meanH2HS1B = calculateEWMAMean(rawH2HS1B);
          const h2hS1ProbA = meanH2HS1A / (meanH2HS1A + meanH2HS1B);
          probA_set1 = (probA_set1 * 0.70) + (h2hS1ProbA * 0.30);
        }

        // Web Worker Thread Callback Handler
        simulationWorker.onmessage = function(event) {
          const { projMatch, projSet1, pctMatch, pctSet1, p10Match, p90Match, p10Set1, p90Set1 } = event.data;

          AFDB.log('SUCCESS', 'ENGINE', `Thread simulation completed. Proj Match: ${projMatch.toFixed(1)}, Set 1: ${projSet1.toFixed(1)}`);

          const options = [];
          if (isFinite(matchLine) && matchLine > 0) {
            const edge = projMatch - matchLine;
            const pct = Math.abs(edge / matchLine) * 100;
            let pick = "NO PLAY", grade = "—", prob = 0;
            if (edge > 0 && pctMatch >= 55) {
              pick = "OVER " + matchLine.toFixed(1);
              prob = pctMatch;
              grade = pctMatch >= CONFIG.GRADE_A_THRESHOLD ? "A" : pctMatch >= CONFIG.GRADE_B_THRESHOLD ? "B" : "C";
            } else if (edge < 0 && (100 - pctMatch) >= 55) {
              pick = "UNDER " + matchLine.toFixed(1);
              prob = 100 - pctMatch;
              grade = (100 - pctMatch) >= CONFIG.GRADE_A_THRESHOLD ? "A" : (100 - pctMatch) >= CONFIG.GRADE_B_THRESHOLD ? "B" : "C";
            }
            options.push({ name: "Match Points Total", line: matchLine, proj: projMatch, edge, grade, pick, prob, edgePct: pct, p10: p10Match, p90: p90Match, isLock: false });
          }

          if (isFinite(set1Line) && set1Line > 0) {
            const edge = projSet1 - set1Line;
            const pct = Math.abs(edge / set1Line) * 100;
            let pick = "NO PLAY", grade = "—", prob = 0;
            if (edge > 0 && pctSet1 >= 55) {
              pick = "OVER " + set1Line.toFixed(1);
              prob = pctSet1;
              grade = pctSet1 >= CONFIG.GRADE_A_THRESHOLD ? "A" : pctSet1 >= CONFIG.GRADE_B_THRESHOLD ? "B" : "C";
            } else if (edge < 0 && (100 - pctSet1) >= 55) {
              pick = "UNDER " + set1Line.toFixed(1);
              prob = 100 - pctSet1;
              grade = (100 - pctSet1) >= CONFIG.GRADE_A_THRESHOLD ? "A" : (100 - pctSet1) >= CONFIG.GRADE_B_THRESHOLD ? "B" : "C";
            }
            options.push({ name: "Set 1 Points Total", line: set1Line, proj: projSet1, edge, grade, pick, prob, edgePct: pct, p10: p10Set1, p90: p90Set1, isLock: false });
          }

          const validPlays = options.filter(o => o.pick !== "NO PLAY" && o.grade !== "—");
          if (validPlays.length > 0) {
            const best = [...validPlays].sort((a, b) => {
              const gradeRank = { A: 3, B: 2, C: 1 };
              const rA = gradeRank[a.grade] || 0;
              const rB = gradeRank[b.grade] || 0;
              if (rB !== rA) return rB - rA;
              return b.edgePct - a.edgePct;
            })[0];
            if (best) best.isLock = true;
          }

          State.lastSimResults = options;
          UI.renderProjectionsTable(options);

          // Reset UI Run Button state
          runBtn.disabled = false;
          runBtn.textContent = "Run";
        };

        // Dispatch parameters to the Web Worker background thread
        simulationWorker.postMessage({
          probA,
          probA_set1,
          matchUncertainty,
          matchLine,
          set1Line,
          SIM_RUNS: CONFIG.SIM_RUNS
        });
      }

      return { run };
    })();

    // --- IIFE UI LAYER (DOM manipulation, renders, copy tools) ---
    const UI = (() => {

      function searchPlayerSafari(side) {
        const rawName = document.getElementById(side === "A" ? "playerAName" : "playerBName").value.trim();
        if (!rawName) { alert("Please enter a player name first."); return; }
        const searchName = rawName.split(",")[0].trim();
        const searchUrl = `https://api.sofascore.com/api/v1/search/all?q=${encodeURIComponent(searchName)}`;
        State._clipboardPhase[side] = 'search';
        State._clipboardReady = false;
        setTimeout(() => { State._clipboardReady = true; }, 2500);
        window.open(searchUrl, "_blank");
        
        const statusEl = document.getElementById("fetchStatus");
        statusEl.className = "status-loading";
        statusEl.textContent = `🔍 Search open for Player ${side} — copy all raw API text, then return here.`;
      }

      function updateHelperLinks(side) {
        const idInput = document.getElementById(side === "A" ? "playerAId" : "playerBId");
        const linkEl = document.getElementById(side === "A" ? "playerALink" : "playerBLink");
        const idVal = idInput.value.trim();

        if (idVal && /^\d+$/.test(idVal)) {
          linkEl.href = `https://api.sofascore.com/api/v1/team/${idVal}/events/last/0`;
          linkEl.style.display = "inline-block";
          linkEl.onclick = (e) => {
            e.preventDefault();
            _openStatsForPlayer(side, idVal, document.getElementById(side === "A" ? "playerAName" : "playerBName").value.trim());
          };
        } else {
          linkEl.style.display = "none";
        }
      }

      function _openStatsForPlayer(side, teamId, playerName) {
        const statsUrl = `https://api.sofascore.com/api/v1/team/${teamId}/events/last/0`;
        State._clipboardPhase[side] = 'stats';
        State._clipboardReady = false;
        setTimeout(() => { State._clipboardReady = true; }, 2500);
        window.open(statsUrl, '_blank');
        
        const statusEl = document.getElementById("fetchStatus");
        statusEl.className = "status-loading";
        statusEl.textContent = `📡 ${playerName || 'Player ' + side} stats load open — copy all raw JSON, then return.`;
      }

      function renderProjectionsTable(options) {
        const body = document.getElementById("resultsBody");
        const table = document.getElementById("results");
        const copyBtn = document.getElementById("copyResultsBtn");
        if (!body || !table) return;

        body.innerHTML = "";

        options.forEach(p => {
          const row = document.createElement("tr");
          const edgePct = p.line > 0 ? (p.edge / p.line) * 100 : 0;
          const gradeClass = p.pick === "NO PLAY" ? "conf-none" : (p.grade === "A" ? "conf-a" : (p.grade === "B" ? "conf-b" : "conf-c"));
          const predClass = p.pick === "NO PLAY" ? "pred-noplay" : (p.pick.startsWith("UNDER") ? "pred-under" : "pred-over");
          const rangeStr = (p.p10 !== undefined && p.p90 !== undefined) ? `${p.p10}–${p.p90}` : '—';
          
          const pickDisplay = p.pick === "NO PLAY" ? "NO PLAY" : `${p.pick} [${p.prob.toFixed(1)}%]`;

          row.innerHTML = `
            <td style="font-weight:900;text-transform:uppercase;">${p.name}</td>
            <td style="font-weight:800;">${p.line.toFixed(1)}</td>
            <td>${p.proj.toFixed(1)}</td>
            <td style="font-weight:700;color:var(--muted);font-size:11px;">${rangeStr}</td>
            <td style="color:${p.edge >= 0 ? '#49d45f' : '#ff5c61'};font-weight:800;">
              ${p.edge >= 0 ? '+' : ''}${p.edge.toFixed(1)} (${p.edge >= 0 ? '+' : ''}${edgePct.toFixed(1)}%)
            </td>
            <td class="${gradeClass}">${p.grade}</td>
            <td class="${predClass}" style="font-weight:900;white-space:nowrap;">
              ${pickDisplay}${p.isLock ? ' <span class="lock">🔒</span>' : ''}
            </td>
          `;
          body.appendChild(row);
        });

        table.style.display = "table";
        if (copyBtn) copyBtn.style.display = "inline-block";
        table.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function copyResultsToClipboard() {
        if (!State.lastSimResults) return;
        const items = State.lastSimResults.map(p => {
          if (p.pick === "NO PLAY") return `${p.name}: No viable edge detected.`;
          return `${p.name}: Line ${p.line.toFixed(1)} | Proj: ${p.proj.toFixed(1)} | Pick: ${p.pick} [${p.prob.toFixed(1)}%] (Grade ${p.grade})`;
        }).join('\n');

        const label = `⚡ TheBetCeo Table Tennis Projections ⚡\n${items}`;
        navigator.clipboard.writeText(label).then(() => {
          alert("Calculated outputs successfully copied to clipboard!");
        }).catch(err => {
          AFDB.log('WARN', 'UI', `Could not write table projections to clipboard: ${err.message}`);
        });
      }

      function clearAll() {
        ["playerAPointsScored","playerAPointsAllowed","playerASet1Scored","playerASet1Allowed",
         "playerBPointsScored","playerBPointsAllowed","playerBSet1Scored","playerBSet1Allowed",
         "matchPointsLine","set1PointsLine","h2hSetsA","h2hSetsB","h2hSet1A","h2hSet1B",
         "playerAName","playerBName","playerAId","playerBId","pasteA","pasteB"].forEach(id => {
          const el = document.getElementById(id); if (el) el.value = "";
        });
        
        const ls = document.getElementById("leagueSelect");
        if (ls) ls.value = "";

        const cb = document.getElementById("useFTH2H"); if (cb) cb.checked = false;
        const tbl = document.getElementById("results"); if (tbl) tbl.style.display = "none";
        const tb  = document.getElementById("resultsBody"); if (tb) tb.innerHTML = "";
        const st  = document.getElementById("fetchStatus"); if (st) st.textContent = "";
        const copyBtn = document.getElementById("copyResultsBtn"); if (copyBtn) copyBtn.style.display = "none";
        
        State.selectedFixtureData = null;
        State.rawEvents.A = null;
        State.rawEvents.B = null;

        const fs = document.getElementById("fetchSection");
        if (fs) fs.style.display = "none";

        document.querySelectorAll(".section").forEach(s => s.classList.add("collapsed"));
        const lsSec = document.getElementById("leagueSection");
        if (lsSec) lsSec.classList.remove("collapsed");

        AFDB.log('ENGINE','CLEAR','Form state and UI caches cleared.');
      }

      function toggleTheme() {
        const isDark = document.body.classList.toggle("dark-mode");
        localStorage.setItem("theme", isDark ? "dark" : "light");
      }

      return {
        searchPlayerSafari,
        updateHelperLinks,
        renderProjectionsTable,
        copyResultsToClipboard,
        clearAll,
        toggleTheme
      };
    })();

    // Page state control on boot
    function onLeagueChange() {
      const league = document.getElementById("leagueSelect").value;
      const fetchSection = document.getElementById("fetchSection");
      if (league) {
        fetchSection.classList.remove("collapsed");
        fetchSection.style.display = "block";
      } else {
        fetchSection.style.display = "none";
      }
    }

    function applySavedTheme() {
      if (!document.body) return;
      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark-mode");
      } else {
        document.body.classList.remove("dark-mode");
      }
    }

    // Initialize DOM hooks
    document.addEventListener("DOMContentLoaded", () => {
      applySavedTheme();

      const themeToggleBtn = document.getElementById("themeToggleBtn");
      if (themeToggleBtn) themeToggleBtn.addEventListener("click", UI.toggleTheme);

      makeSectionsCollapsible();
      document.querySelectorAll(".section").forEach(s => s.classList.add("collapsed"));
      document.getElementById("leagueSection").classList.remove("collapsed");

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && State._clipboardReady) {
          ['A', 'B'].forEach(side => {
            if (State._clipboardPhase[side]) autoClipboardParse(side);
          });
        }
      });

      AFDB.log('BOOT', 'ENGINE', "Table Tennis Prediction Engine compiled with zero redundancies.");
    });
  </script>
</body>
</html>
