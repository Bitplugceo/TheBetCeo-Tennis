
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TT Engine" />
  <meta name="theme-color" content="#d4af37" />

  <title>Table Tennis Prediction Engine</title>

  <style>
    :root {
      --bg: #efefef;
      --text: #1f2430;
      --panel: #ffffff;
      --panel-border: #dedede;
      --panel-soft: #f6f7f9;
      --panel-soft-2: #eceff3;
      --input-bg: #ffffff;
      --input-border: #cfd4da;
      --table-head: #3a404c;
      --muted: #7b8088;
      --chip-text: #2a2f38;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      --section-toggle-text: #20242c;
      --section-toggle-icon: #d91f26;
      --table-border: #dfe2e7;
    }

    body.dark-mode {
      --bg: #111;
      --text: #d4af37;
      --panel: #1a1a1a;
      --panel-border: #333;
      --panel-soft: #151515;
      --panel-soft-2: #111;
      --input-bg: #222;
      --input-border: #444;
      --table-head: #111;
      --muted: #9aa0a8;
      --chip-text: #d4af37;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
      --section-toggle-text: #d4af37;
      --section-toggle-icon: #d4af37;
      --table-border: #333;
    }

    /* zero border-radius */
    button,
    input,
    select,
    .section,
    table,
    th,
    td {
      border-radius: 0;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    .app-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 10px 0;
      padding-top: max(10px, env(safe-area-inset-top));
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));
      padding-bottom: 10px;
      background: linear-gradient(90deg, #c91920 0%, #d91f26 50%, #b91520 100%);
      color: #fff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
    }

    body.engine-alert {
      background: #2a0608 !important;
    }

    body.engine-alert .app-header {
      background: linear-gradient(90deg, #7b0007 0%, #cf1119 52%, #820008 100%) !important;
    }

    body.engine-alert .section {
      border-color: #d91f26 !important;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.3px;
      color: #fff;
    }

    .brand-right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.85);
      text-transform: uppercase;
    }

    .theme-toggle {
      background: none !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 !important;
      font-size: 11px !important;
      font-weight: 700 !important;
      letter-spacing: 1.5px !important;
      color: rgba(255, 255, 255, 0.85) !important;
      text-transform: uppercase !important;
      cursor: pointer;
    }

    .wrapper {
      max-width: 760px;
      margin: 10px auto;
      padding: 0 10px;
    }

    .section {
      border: 1px solid var(--panel-border);
      background: var(--panel);
      margin: 8px auto;
      box-shadow: var(--shadow);
      color: var(--text);
    }

    .section-toggle {
      width: 100%;
      background: none !important;
      border: none;
      padding: 12px 10px;
      margin: 0 !important;
      color: var(--section-toggle-text) !important;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      cursor: pointer;
    }

    .section-toggle .toggle-title {
      display: block;
      font-weight: 800;
      color: var(--section-toggle-text) !important;
    }

    .section-toggle .toggle-icon {
      font-size: 15px;
      line-height: 1;
      transition: transform 0.2s ease;
      color: var(--section-toggle-icon) !important;
    }

    .section-body {
      padding: 0 10px 10px;
      margin-top: 0;
    }

    .section.collapsed .section-body {
      display: none;
    }

    .section.collapsed .section-toggle .toggle-icon {
      transform: rotate(-90deg);
    }

    h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
    }

    label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
      color: var(--text);
      font-weight: 600;
    }

    h3 span,
    label span,
    small {
      color: var(--muted);
    }

    input,
    select {
      width: 100%;
      max-width: 260px;
      box-sizing: border-box;
      display: block;
      padding: 6px 8px;
      font-size: 12px;
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--input-border);
      margin-bottom: 6px;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
    }

    input::placeholder {
      color: var(--muted);
      opacity: 0.75;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #4aa346;
      box-shadow: 0 0 0 2px rgba(74, 163, 70, 0.12);
    }

    input[type="checkbox"] {
      width: 12px !important;
      height: 12px !important;
      min-width: 12px !important;
      min-height: 12px !important;
      max-width: 12px !important;
      max-height: 12px !important;
      margin-right: 6px !important;
      vertical-align: middle !important;
      appearance: checkbox !important;
      -webkit-appearance: checkbox !important;
    }

    button {
      padding: 8px 16px;
      margin: 6px;
      font-weight: 700;
      background: #313744;
      color: #fff;
      border: none;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.95;
    }

    .fetch-btn {
      background: #49a443 !important;
      color: #fff !important;
      padding: 6px 12px !important;
      font-size: 12px !important;
      font-weight: 700 !important;
      border: none !important;
      cursor: pointer;
      margin-top: 4px;
      box-shadow: 0 2px 6px rgba(73, 164, 67, 0.2);
    }

    .fixture-toolbar {
      display: flex;
      gap: 8px;
      margin: 10px 0 8px;
      flex-wrap: wrap;
    }

    .fixture-day {
      background: #eceff3 !important;
      color: #2a2f38 !important;
      border: 1px solid #d7dbe1 !important;
      padding: 6px 10px !important;
      font-size: 12px !important;
      font-weight: 700;
      margin: 0;
      min-width: 90px !important;
      text-align: center;
    }

    .fixture-day.active {
      background: #49a443 !important;
      color: #fff !important;
      border-color: #49a443 !important;
    }

    #fetchStatus {
      font-size: 10px;
      margin-top: 6px;
      min-height: 16px;
    }

    #fetchStatus.ok { color: #2f8f4a; }
    #fetchStatus.err { color: #d92d2a; }
    #fetchStatus.loading { color: #d98a00; }

    .actions {
      text-align: center;
      padding-bottom: 20px;
    }

    #runBtn,
    #clearBtn {
      opacity: 1 !important;
      border: none !important;
      cursor: pointer !important;
      padding: 5px 14px !important;
      font-size: 12px !important;
      font-weight: 700 !important;
      min-width: 0 !important;
      width: auto !important;
    }

    #runBtn {
      background: #3a9c35 !important;
      color: #fff !important;
      box-shadow: 0 2px 8px rgba(58, 156, 53, 0.35) !important;
    }

    #clearBtn {
      background: #3a404c !important;
      color: #fff !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2) !important;
    }

    .table-wrap {
      overflow-x: auto;
      margin: 0 10px 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 12px;
      background: var(--panel) !important;
    }

    th, td {
      border: 1px solid var(--table-border);
      padding: 10px 8px !important;
      text-align: center;
      vertical-align: middle;
    }

    th {
      background: var(--table-head) !important;
      color: #fff !important;
      font-weight: 700;
    }

    td {
      background: var(--panel) !important;
      color: var(--text) !important;
      font-weight: 600 !important;
    }

    .pred-over {
      background: #3a9c35 !important;
      color: #fff !important;
      font-weight: 800 !important;
    }

    .pred-under {
      background: #c91920 !important;
      color: #fff !important;
      font-weight: 800 !important;
    }

    .pred-noplay {
      background: var(--panel-soft-2) !important;
      color: var(--muted) !important;
      font-weight: 700 !important;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <span class="brand-name">TheBetCeo TT ⚡️</span>
    <span class="brand-right">
      <button class="theme-toggle" type="button" id="themeToggleBtn" title="Toggle dark/light mode">🏓</button>
      <button class="theme-toggle" type="button" id="afdbBtn" title="Auto-Fetch Debugger" onclick="AFDB.open()">🔬</button>
      PREDICTIONS
    </span>
  </header>

  <div class="wrapper">

    <!-- Section 1: League Tier -->
    <div class="section" id="leagueSection">
      <h3>League Tier</h3>
      <label>Select League</label>
      <select id="leagueSelect" onchange="onLeagueChange()">
        <option value="">- Select League -</option>
        <option value="Setka Cup">Setka Cup (International)</option>
        <option value="TT Cup">TT Cup (International)</option>
      </select>
    </div>

    <!-- Section 2: Auto-Fetch -->
    <div class="section" id="fetchSection" style="display:none;">
      <h3>⚡ Sofascore Auto-Fetch</h3>
      <div id="fixtureToolbar" class="fixture-toolbar">
        <button type="button" class="fixture-day active" id="fixturesTodayBtn" onclick="setFixtureDayOffset(0)">Today</button>
        <button type="button" class="fixture-day" id="fixturesTomorrowBtn" onclick="setFixtureDayOffset(1)">Tomorrow</button>
      </div>

      <label id="fixtureSelectLabel">Select match</label>
      <select id="fixtureSelect" onchange="onFixtureSelect()">
        <option value="">- Select match -</option>
      </select>

      <label>Player A Name (Home)</label>
      <input id="playerAName" placeholder="Player A" readonly />

      <label>Player B Name (Away)</label>
      <input id="playerBName" placeholder="Player B" readonly />

      <button class="fetch-btn" id="fetchBtn" type="button" onclick="fetchMatchStats()">📡 Fetch Stats</button>
      <div id="fetchStatus"></div>
    </div>

    <!-- Section 3: Market Lines -->
    <div class="section" id="marketSection">
      <h3>Market Lines</h3>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <div>
          <label>Match Points O/U</label>
          <input id="matchPointsLine" placeholder="e.g. 74.5" />
        </div>
        <div>
          <label>Set 1 Points O/U</label>
          <input id="set1PointsLine" placeholder="e.g. 18.5" />
        </div>
      </div>
    </div>

    <!-- Section 4: Player A Form -->
    <div class="section" id="playerASection">
      <h3>Player A - Last 5 Overall</h3>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px;">
        <div>
          <label>Avg Points Scored/Set</label>
          <input id="playerAPointsScored" placeholder="e.g. 9.8" />
        </div>
        <div>
          <label>Avg Points Allowed/Set</label>
          <input id="playerAPointsAllowed" placeholder="e.g. 9.2" />
        </div>
      </div>
    </div>

    <!-- Section 5: Player B Form -->
    <div class="section" id="playerBSection">
      <h3>Player B - Last 5 Overall</h3>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px;">
        <div>
          <label>Avg Points Scored/Set</label>
          <input id="playerBPointsScored" placeholder="e.g. 9.4" />
        </div>
        <div>
          <label>Avg Points Allowed/Set</label>
          <input id="playerBPointsAllowed" placeholder="e.g. 9.6" />
        </div>
      </div>
    </div>

    <!-- Section 6: H2H Form -->
    <div class="section" id="h2hSection">
      <h3>H2H Form</h3>
      <label style="font-size:11px; font-weight:800; cursor:pointer; display:flex; align-items:center; gap:6px; color:var(--section-toggle-text); margin-bottom:8px;">
        <input type="checkbox" id="useFTH2H" />
        Use H2H Sets History
      </label>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px;">
        <input id="h2hSetsA" placeholder="Player A Sets Won (e.g., 3,2,1)" />
        <input id="h2hSetsB" placeholder="Player B Sets Won (e.g., 1,3,3)" />
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button id="runBtn" type="button" onclick="runEngine()">Run</button>
      <button id="clearBtn" type="button" onclick="clearAll()">Clear</button>
    </div>

    <!-- Projections Output -->
    <div class="table-wrap">
      <table id="results" style="display:none;">
        <thead>
          <tr>
            <th>Pick</th>
            <th>Projection</th>
            <th>Edge</th>
            <th>Model Grade</th>
            <th>Prediction</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>

  </div>

  <!-- AFDB Debugger Panel Overlay HTML (Identical to BB Engine) -->
  <div id="afdbOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:rgba(0,0,0,0.96);flex-direction:column;font-family:ui-monospace,Consolas,monospace;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);">
    <div id="afdbPanel" style="width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;"></div>
  </div>

  <script>
    // Constants & Global State
    const WORKER_URL = "https://thebetceo-engine.ridwantunde636.workers.dev/";
    let currentDayOffset = 0;
    let selectedFixtureData = null;

    // --- BB UNKILLABLE AFDB DEBUG BRAIN (COPIED EXACTLY FROM BASKETBALL ENGINE) ---
    const AFDB = (function() {
      const LOG_LIMIT = 600;
      let _log = [];
      let _isOpen = false;
      let _showOnlyErrors = true; 
      let _currentLogLevel = 'ERROR';

      const LEVELS = {
        BOOT:    { color:'#7aa6ff' }, NET:     { color:'#4ea9ff' },
        FETCH:   { color:'#49d45f' }, FILL:    { color:'#2aff9e' },
        PICK:    { color:'#d4af37' }, H2H:     { color:'#c678dd' },
        SUCCESS: { color:'#49d45f' }, WARN:    { color:'#ffcf73' },
        ERROR:   { color:'#ff5c61' }, INFO:    { color:'#aaa'    },
        ENGINE:  { color:'#d4af37' }, TRACKER: { color:'#4ea9ff' },
        VERDICT: { color:'#49d45f' } 
      };

      const ICONS = {
        BOOT:'⚙️', NET:'🌐', FETCH:'📡', FILL:'✏️',
        PICK:'📌', H2H:'🔄', SUCCESS:'✅', WARN:'⚠️', ERROR:'❌', INFO:'ℹ️',
        ENGINE:'⚙️', TRACKER:'📊', VERDICT:'🏅'
      };

      function esc(s) {
        return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }

      function log(level, section, msg, data = null) {
        const entry = {
          ts: new Date().toLocaleTimeString([], { hour12: false }),
          level,
          section: section || 'CORE',
          msg,
          data
        };
        _log.unshift(entry);
        if (_log.length > LOG_LIMIT) _log = _log.slice(0, LOG_LIMIT);
        
        if (level === 'ERROR') {
          document.body.classList.add("engine-alert");
        }
        
        if (_isOpen) _render();
      }

      function clear() {
        _log = [];
        document.body.classList.remove("engine-alert");
        _render();
      }

      function open() {
        _isOpen = true;
        const ov = document.getElementById('afdbOverlay');
        if (ov) { ov.style.display = 'flex'; _render(); }
      }

      function close() {
        _isOpen = false;
        const ov = document.getElementById('afdbOverlay');
        if (ov) ov.style.display = 'none';
      }

      function copy(btnEl) {
        const visibleLogs = _showOnlyErrors ? _log.filter(e => e.level === 'ERROR' || e.level === 'WARN' || e.level === 'VERDICT') : _log;
        const textArr = visibleLogs.slice().reverse().map(e => {
          let line = '[' + e.ts + '] [' + e.level + '] [' + e.section + '] ' + e.msg;
          if (e.data !== null) {
            try { line += ' | ' + JSON.stringify(e.data); }
            catch(x) { line += ' | ' + String(e.data); }
          }
          return line;
        });
        const text = textArr.join(String.fromCharCode(10, 10));
        try {
          navigator.clipboard.writeText(text);
          if (btnEl) {
            const origText = btnEl.innerHTML;
            btnEl.innerHTML = "✅ COPIED!";
            setTimeout(() => { if (btnEl) btnEl.innerHTML = origText; }, 1500);
          }
        } catch(e) {
          log('WARN','AFDB','Clipboard blocked — printed to console');
        }
      }

      async function runTestFetch() {
        log('INFO', 'POLICE RAID', 'Initiating diagnostic test fetch for today...');
        const dateStr = getLocalDateKey(0);
        const testUrl = `https://api.sofascore.com/api/v1/sport/table-tennis/scheduled-events/${dateStr}`;
        try {
          const res = await proxyFetch(testUrl);
          log('SUCCESS', 'POLICE RAID', `SofaScore ping OK. Recieved ${res?.events?.length || 0} event objects.`);
        } catch(err) {
          log('ERROR', 'POLICE RAID', `Test Fetch Failed: ${err.message}`);
        }
      }

      function _render() {
        const panel = document.getElementById('afdbPanel');
        if (!panel) return;

        const visibleLogs = _showOnlyErrors ? _log.filter(e => e.level === 'ERROR' || e.level === 'WARN' || e.level === 'VERDICT') : _log;
        const logRows = _log.map(e => {
          const def = LEVELS[e.level] || LEVELS.INFO;
          const icon = ICONS[e.level] || '•';
          let dataHtml = '';
          if (e.data !== null) {
            let ds;
            try { ds = typeof e.data === 'object' ? JSON.stringify(e.data, null, 2) : String(e.data); }
            catch(x) { ds = String(e.data); }
            dataHtml = '<pre style="color:#888;font-size:9px;margin:4px 0 0 0;padding:6px;background:#070707;border-left:2px solid #222;white-space:pre-wrap;word-break:break-all;">' + esc(ds) + '</pre>';
          }
          return '<div style="padding:8px;border-bottom:1px solid #151515;"><div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;"><span style="color:#555;font-size:9px;min-width:65px;flex-shrink:0;">' + esc(e.ts) + '</span><span style="color:' + def.color + ';font-size:10px;font-weight:900;min-width:75px;flex-shrink:0;">' + icon + ' ' + esc(e.level) + '</span><span style="color:#777;font-size:9px;min-width:80px;flex-shrink:0;">[' + esc(e.section) + ']</span><span style="color:' + def.color + ';font-size:11px;font-weight:700;flex:1;white-space:pre-wrap;">' + esc(e.msg) + '</span></div>' + dataHtml + '</div>';
        }).join('');

        const headerBtns = '<button onclick="AFDB.copy(this)" style="background:#111;border:1px solid #333;color:#49d45f;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;border-radius:4px;">📋 Copy Log</button><button onclick="AFDB.clear()" style="background:#111;border:1px solid #333;color:#ff5c61;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;border-radius:4px;">🗑️ Clear</button><button onclick="AFDB.runTestFetch()" style="background:#2a0608;border:1px solid #d91f26;color:#fff;padding:6px 12px;font-size:11px;font-weight:900;cursor:pointer;border-radius:4px;box-shadow:0 0 8px rgba(217,31,38,0.4);">🚨 MILITARY RAID</button><button onclick="AFDB.close()" style="background:#111;border:1px solid #555;color:#ccc;padding:6px 12px;font-size:11px;font-weight:900;cursor:pointer;border-radius:4px;">✕ Close</button>';
        const emptyMsg = _showOnlyErrors ? 'No suspects arrested. The code is clean.' : 'No log entries yet. Select a league.';
        const filterLabel = `🛰️ LEVEL: ${_currentLogLevel}`;
        const driftHtml = '<div style="padding:6px 12px;background:#0d0d0d;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;gap:16px;flex-wrap:wrap;flex-shrink:0;"><span style="color:#555;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;">📐 DRIFT TRACKER</span><span style="color:#555;font-size:12px;font-weight:900;">Rolling Mean Error (last 20): —</span><span style="color:#555;font-size:10px;">0 samples logged</span></div>';

        panel.innerHTML = '<div style="background:#080808;border-bottom:1px solid #222;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;flex-shrink:0;"><div style="color:#d4af37;font-size:14px;font-weight:900;letter-spacing:1px;">🔬 AUTO-FETCH DEBUG BRAIN (BB)</div><div style="display:flex;gap:8px;flex-wrap:wrap;">' + headerBtns + '</div></div>' + driftHtml + '<div style="display:flex;flex-direction:column;flex:1;overflow-y:auto;background:#0a0a0a;"><div style="flex:1;"><div style="padding:10px 12px;background:#111;color:#d4af37;font-size:11px;font-weight:900;text-transform:uppercase;position:sticky;top:0;z-index:10;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;"><span>🛰️ FETCH & ENGINE LOGS</span><button onclick="AFDB.toggleFilter()" style="background:none;border:none;color:#4ea9ff;font-size:14px;font-weight:bold;cursor:pointer;">' + filterLabel + '</button></div><div style="padding-bottom:15px;">' + (logRows || '<div style="color:#555;font-size:12px;text-align:center;padding:30px;font-weight:bold;">' + emptyMsg + '</div>') + '</div></div></div>';
      }

      function toggleFilter() {
        _showOnlyErrors = !_showOnlyErrors;
        _currentLogLevel = _showOnlyErrors ? 'ERROR' : 'ALL';
        _render();
      }

      return { log, clear, open, close, copy, toggleFilter, runTestFetch };
    })();

    // Dynamic Collapsible Sections
    function makeSectionsCollapsible() {
      document.querySelectorAll(".section").forEach(section => {
        if (section.dataset.collapsibleReady === "1") return;
        const heading = section.querySelector("h3");
        if (!heading) return;
        const titleHTML = heading.innerHTML;
        const body = document.createElement("div");
        body.className = "section-body";
        const children = [...section.childNodes];
        children.forEach(node => { if (node !== heading) body.appendChild(node); });

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "section-toggle";
        const titleSpan = document.createElement("span");
        titleSpan.className = "toggle-title";
        titleSpan.innerHTML = titleHTML;
        const iconSpan = document.createElement("span");
        iconSpan.className = "toggle-icon";
        iconSpan.innerHTML = "&#9662;";
        btn.appendChild(titleSpan);
        btn.appendChild(iconSpan);
        btn.addEventListener("click", () => { section.classList.toggle("collapsed"); });

        section.innerHTML = "";
        section.appendChild(btn);
        section.appendChild(body);
        section.classList.add("collapsed");
        section.dataset.collapsibleReady = "1";
      });
    }

    function onLeagueChange() {
      const league = document.getElementById("leagueSelect").value;
      const fetchSection = document.getElementById("fetchSection");
      if (league) {
        fetchSection.classList.remove("collapsed");
        fetchSection.style.display = "block";
        loadFixtures();
      } else {
        fetchSection.style.display = "none";
      }
    }

    function setFixtureDayOffset(offset) {
      currentDayOffset = offset;
      document.getElementById("fixturesTodayBtn").classList.toggle("active", offset === 0);
      document.getElementById("fixturesTomorrowBtn").classList.toggle("active", offset === 1);
      loadFixtures();
    }

    // CORS & Cloudflare Worker proxy helper
    async function proxyFetch(url) {
      AFDB.log('FETCH', 'PROXY', `Calling proxy for URL: ${url}`);
      try {
        const proxyUrl = WORKER_URL + "?url=" + encodeURIComponent(url);
        const response = await fetch(proxyUrl);
        
        AFDB.log('FETCH', 'PROXY', `Proxy HTTP Status: ${response.status}`, { url: proxyUrl });
        
        if (!response.ok) {
          throw new Error(`Worker returned HTTP ${response.status}: ${response.statusText}`);
        }
        
        const data = await response.json();
        AFDB.log('SUCCESS', 'PROXY', `Successfully parsed JSON response!`);
        return data;
      } catch (err) {
        AFDB.log('ERROR', 'PROXY', `Network Fetch Failed: ${err.message}`, { targetUrl: url });
        throw err;
      }
    }

    function getLocalDateKey(offset = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offset);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    // Fetch and Filter SofaScore table tennis events
    async function loadFixtures() {
      const leagueFilter = document.getElementById("leagueSelect").value;
      const select = document.getElementById("fixtureSelect");
      if (!select || !leagueFilter) return;

      select.innerHTML = "<option value=''>Loading matches...</option>";
      
      const dateStr = getLocalDateKey(currentDayOffset);
      const url = `https://api.sofascore.com/api/v1/sport/table-tennis/scheduled-events/${dateStr}`;

      try {
        const data = await proxyFetch(url);
        const events = data.events || [];
        
        // Filter events for "Setka Cup" or "TT Cup"
        const filtered = events.filter(ev => {
          const tName = ev.tournament?.name || "";
          return tName.toLowerCase().includes(leagueFilter.toLowerCase());
        });

        AFDB.log('ENGINE', 'FILTER', `Found ${events.length} total TT events. Filtered down to ${filtered.length} for ${leagueFilter}.`);

        if (filtered.length === 0) {
          select.innerHTML = "<option value=''>No matches found</option>";
          return;
        }

        select.innerHTML = "<option value=''>- Select match -</option>";
        filtered.forEach(ev => {
          const home = ev.homeTeam?.name || "Player A";
          const away = ev.awayTeam?.name || "Player B";
          const time = ev.startTimestamp ? new Date(ev.startTimestamp * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";
          
          const opt = document.createElement("option");
          opt.value = ev.id;
          opt.textContent = `${time} — ${home} vs ${away}`;
          opt.dataset.home = home;
          opt.dataset.away = away;
          opt.dataset.homeId = ev.homeTeam?.id || "";
          opt.dataset.awayId = ev.awayTeam?.id || "";
          select.appendChild(opt);
        });

      } catch (err) {
        select.innerHTML = "<option value=''>Error loading matches</option>";
        AFDB.log('ERROR', 'FIXTURES', `Failed to load scheduled matches: ${err.message}`);
      }
    }

    function onFixtureSelect() {
      const select = document.getElementById("fixtureSelect");
      const opt = select.options[select.selectedIndex];
      if (!opt || !opt.value) {
        selectedFixtureData = null;
        return;
      }
      
      selectedFixtureData = {
        eventId: opt.value,
        homeId: opt.dataset.homeId,
        awayId: opt.dataset.awayId,
        homeName: opt.dataset.home,
        awayName: opt.dataset.away
      };

      document.getElementById("playerAName").value = selectedFixtureData.homeName;
      document.getElementById("playerBName").value = selectedFixtureData.awayName;
      AFDB.log('ENGINE', 'FIXTURE', `Match selected: ${selectedFixtureData.homeName} vs ${selectedFixtureData.awayName}`, selectedFixtureData);
    }

    // Extract set-by-set stats & populate forms automatically
    async function fetchMatchStats() {
      if (!selectedFixtureData) {
        alert("Please select a match first.");
        return;
      }

      const statusEl = document.getElementById("fetchStatus");
      statusEl.className = "status-loading";
      statusEl.textContent = "📡 Fetching stats...";

      try {
        const homeId = selectedFixtureData.homeId;
        const awayId = selectedFixtureData.awayId;

        // Fetch last matches for Player A and Player B in parallel
        AFDB.log('FETCH', 'STATS', `Starting parallel historical and H2H fetch for player IDs: A=${homeId}, B=${awayId}`);
        const [homeHistory, awayHistory, h2hHistory] = await Promise.all([
          proxyFetch(`https://api.sofascore.com/api/v1/player/${homeId}/events/last/0`),
          proxyFetch(`https://api.sofascore.com/api/v1/player/${awayId}/events/last/0`),
          proxyFetch(`https://api.sofascore.com/api/v1/event/${selectedFixtureData.eventId}/h2h`)
        ]);

        // Parse point scoring profiles
        const statsA = processPlayerPoints(homeHistory.events || [], homeId, 'Player A');
        const statsB = processPlayerPoints(awayHistory.events || [], awayId, 'Player B');

        // Populate Player A Form
        document.getElementById("playerAPointsScored").value = statsA.avgScored.toFixed(1);
        document.getElementById("playerAPointsAllowed").value = statsA.avgAllowed.toFixed(1);

        // Populate Player B Form
        document.getElementById("playerBPointsScored").value = statsB.avgScored.toFixed(1);
        document.getElementById("playerBPointsAllowed").value = statsB.avgAllowed.toFixed(1);

        // Parse and populate H2H Form
        const h2hMatches = h2hHistory.history || [];
        AFDB.log('ENGINE', 'H2H', `Retrieved ${h2hMatches.length} historical H2H matches.`);
        
        if (h2hMatches.length >= 2) {
          const setsA = [];
          const setsB = [];
          
          h2hMatches.slice(0, 5).forEach(m => {
            const isAHome = String(m.homeTeam?.id) === String(homeId);
            const scoreA = isAHome ? m.homeScore?.display : m.awayScore?.display;
            const scoreB = isAHome ? m.awayScore?.display : m.homeScore?.display;
            if (scoreA !== undefined && scoreB !== undefined) {
              setsA.push(scoreA);
              setsB.push(scoreB);
            }
          });

          document.getElementById("h2hSetsA").value = setsA.join(",");
          document.getElementById("h2hSetsB").value = setsB.join(",");
          document.getElementById("useFTH2H").checked = true;
        } else {
          document.getElementById("h2hSetsA").value = "";
          document.getElementById("h2hSetsB").value = "";
          document.getElementById("useFTH2H").checked = false;
        }

        statusEl.className = "status-ok";
        statusEl.textContent = "✅ Stats successfully loaded!";

        // Open up closed data segments automatically so user can review them
        document.getElementById("marketSection").classList.remove("collapsed");
        document.getElementById("playerASection").classList.remove("collapsed");
        document.getElementById("playerBSection").classList.remove("collapsed");
        document.getElementById("h2hSection").classList.remove("collapsed");

      } catch (err) {
        statusEl.className = "status-err";
        statusEl.textContent = "❌ Error fetching stats. Open Microscope to trace.";
        AFDB.log('ERROR', 'STATS', `Settle Stats Fetch Failed: ${err.message}`);
      }
    }

    // Helper to calculate average points won/lost per set
    function processPlayerPoints(events, playerId, label) {
      let totalSets = 0;
      let totalScored = 0;
      let totalAllowed = 0;

      // Scan up to 5 completed matches
      const completed = events.filter(e => e.status?.type === "finished").slice(0, 5);
      AFDB.log('ENGINE', 'PLAYER_PROCESSING', `Processing ${completed.length} finished matches for ${label} (ID: ${playerId})`);

      completed.forEach((ev, idx) => {
        const isHome = String(ev.homeTeam?.id) === String(playerId);
        const myScoreObj = isHome ? ev.homeScore : ev.awayScore;
        const oppScoreObj = isHome ? ev.awayScore : ev.homeScore;

        if (myScoreObj && oppScoreObj) {
          let matchSets = 0;
          let matchScored = 0;
          let matchAllowed = 0;
          // Loop through up to 5 sets
          for (let s = 1; s <= 5; s++) {
            const mySet = myScoreObj[`period${s}`];
            const oppSet = oppScoreObj[`period${s}`];
            
            if (mySet !== undefined && oppSet !== undefined) {
              totalScored += mySet;
              totalAllowed += oppSet;
              matchScored += mySet;
              matchAllowed += oppSet;
              totalSets++;
              matchSets++;
            }
          }
          AFDB.log('ENGINE', 'PLAYER_PROCESSING', `${label} Match #${idx+1} [Set Scores Scanned: ${matchSets}] -> Points Scored: ${matchScored}, Allowed: ${matchAllowed}`);
        }
      });

      const avgScored = totalSets > 0 ? (totalScored / totalSets) : 9.8;
      const avgAllowed = totalSets > 0 ? (totalAllowed / totalSets) : 9.4;
      AFDB.log('ENGINE', 'PLAYER_PROCESSING', `Finished ${label} processing. Total Sets: ${totalSets}. Average: Scored=${avgScored.toFixed(2)}, Allowed=${avgAllowed.toFixed(2)}`);

      return { avgScored, avgAllowed };
    }

    function runEngine() {
      // Placeholder for next step
    }

    function clearAll() {
      document.querySelectorAll("input").forEach(i => { if (i.type !== "checkbox") i.value = ""; else i.checked = false; });
      const select = document.getElementById("leagueSelect");
      if (select) select.value = "";
      onLeagueChange();
    }

    // Default theme management (Always boots to light mode)
    (function applySavedTheme() {
      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark-mode");
      } else {
        document.body.classList.remove("dark-mode");
      }
    })();

    document.addEventListener("DOMContentLoaded", () => {
      makeSectionsCollapsible();
      document.querySelectorAll(".section").forEach(s => s.classList.add("collapsed"));
      document.getElementById("leagueSection").classList.remove("collapsed");
      
      AFDB.log('BOOT', 'ENGINE', `Table Tennis Engine successfully initialized. Session ID: sess_${Date.now()}`);
    });
  </script>
