<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#e41827" />
  <title>Tennis Prediction Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@1,800;1,900&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#efefef; --text:#1f2430; --panel:#fff; --line:#dedede; --muted:#7b8088; --soft:#f6f7f9; --head:#3a404c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0c0c0c; --text:#f2f2f2; --panel:#161616; --line:#2a2a2a; --muted:#9a9a9a; --soft:#121212; --head:#1a1a1a; }
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif; }
    .app-header { display:flex; align-items:center; justify-content:space-between; min-height:54px; padding:12px 14px 10px; background:#e41827; color:#fff; }
    .brand-name { font-family:Nunito,"Avenir Next",sans-serif; font-size:23px; font-weight:900; font-style:italic; letter-spacing:-0.4px; }
    .brand-right { font-size:10px; font-weight:700; letter-spacing:1.5px; }
    .wrapper { max-width:760px; margin:0 auto; padding:10px; }
    .section { border:1px solid var(--line); background:var(--panel); margin:8px 0; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .section-toggle { width:100%; border:0; background:none; color:var(--text); display:flex; justify-content:space-between; padding:12px 10px; font-weight:800; font-size:16px; text-align:left; }
    .section-toggle span:last-child { color:#e53935; }
    .section.collapsed .section-body { display:none; }
    .section-body { padding:0 10px 10px; }
    label { display:block; font-size:12px; font-weight:600; margin:0 0 4px; }
    input, select { width:100%; max-width:260px; display:block; padding:6px 8px; margin:0 0 6px; border:1px solid #cfd4da; background:var(--panel); color:var(--text); font-size:12px; appearance:none; }
    .fixture-toolbar { display:flex; gap:8px; margin:0 0 8px; }
    .fixture-day { min-width:90px; padding:6px 10px; border:1px solid #d7dbe1; background:#eceff3; color:#2a2f38; font-size:12px; font-weight:700; }
    .fixture-day.active { background:#49a443; color:#fff; border-color:#49a443; }
    .fetch-btn, .actions button { border:0; color:#fff; font-size:12px; font-weight:700; cursor:pointer; }
    .fetch-btn { background:#49a443; padding:6px 12px; }
    .actions { text-align:center; padding-bottom:12px; }
    #runBtn { background:#3a9c35; padding:5px 14px; }
    #clearBtn { background:#3a404c; padding:5px 14px; }
    .note { min-height:16px; margin-top:6px; font-size:10px; font-weight:700; color:var(--muted); }
    .ok { color:#2f8f4a; } .err { color:#d92d2a; } .loading { color:#d98a00; }
    table { width:100%; border-collapse:collapse; margin-top:10px; font-size:12px; background:var(--panel); }
    th, td { border:1px solid #dfe2e7; padding:10px 8px; text-align:center; }
    th { background:var(--head); color:#fff; }
    .pred-over, .pred-home { background:#3a9c35; color:#fff; font-weight:800; }
    .pred-under, .pred-away { background:#c91920; color:#fff; font-weight:800; }
    .pred-noplay { color:var(--muted); font-weight:700; }
    .conf-a { background:#2f8f4a; color:#fff; font-weight:800; }
    .conf-b { background:#4aa346; color:#fff; font-weight:800; }
    .conf-c { background:#d98a00; color:#fff; font-weight:800; }
    .conf-d { background:#c91920; color:#fff; font-weight:800; }
    .conf-none { background:var(--soft); color:var(--muted); font-weight:700; }
    .icon-btn { background:none; border:0; color:#fff; font-size:16px; padding:0 6px 0 0; cursor:pointer; }
    .tracker-modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; z-index:20; }
    .tracker-modal.open { display:flex; }
    .tracker-panel { background:var(--panel); color:var(--text); width:100%; height:100%; display:flex; flex-direction:column; }
    .tracker-head { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:var(--head); color:#fff; font-weight:800; }
    .tracker-head button { background:none; border:0; color:#fff; font-size:18px; }
    .tracker-summary { padding:14px 16px; background:var(--soft); font-size:12px; font-weight:800; }
    .tracker-body { overflow:auto; }
    #trackedPicksTable { margin:0; }
    .track-pending { background:#eceff3; color:#2a2f38; font-weight:800; }
    .track-win { background:#3a9c35; color:#fff; font-weight:800; }
    .track-loss { background:#c91920; color:#fff; font-weight:800; }
    .track-push { background:#3a404c; color:#fff; font-weight:800; }
    .settle { background:#eceff3; color:#2a2f38; border:1px solid #d7dbe1; font-size:10px; font-weight:800; padding:3px 6px; margin:0 1px; }
  </style>
</head>
<body>
<header class="app-header">
  <span class="brand-name">TheBetCeo ⚡️</span>
  <span class="brand-right"><button type="button" id="trackerBtn" class="icon-btn" title="Tracked picks">📊</button> PREDICTIONS</span>
</header>
<div class="wrapper">
  <div class="section" id="tourSection">
    <button class="section-toggle" type="button">Tour <span>▾</span></button>
    <div class="section-body">
      <label>Select Tour</label>
      <select id="tour">
        <option value="">- Select Tour -</option>
        <option value="ATP">ATP</option>
        <option value="WTA">WTA</option>
      </select>
    </div>
  </div>
  <div class="section collapsed" id="fetchSection">
    <button class="section-toggle" type="button">⚡ ESPN Auto-Fetch <span>▾</span></button>
    <div class="section-body">
      <div class="fixture-toolbar">
        <button type="button" class="fixture-day active" id="today">Today</button>
        <button type="button" class="fixture-day" id="tomorrow">Tomorrow</button>
      </div>
      <label>Select Match</label>
      <select id="fixture"><option value="">- Select match -</option></select>
      <label>Court Surface</label>
      <input id="surface" readonly placeholder="Auto from ESPN" />
      <div class="note" id="fetchNote">Select ATP or WTA.</div>
    </div>
  </div>
  <div class="section collapsed" id="lineSection">
    <button class="section-toggle" type="button">Market Lines <span>▾</span></button>
    <div class="section-body">
      <div class="note">ESPN does not send tennis prices. These are the only typed fields.</div>
      <label>Player A decimal odds</label><input id="oddsA" inputmode="decimal" placeholder="1.72" />
      <label>Player B decimal odds</label><input id="oddsB" inputmode="decimal" placeholder="2.15" />
      <label>Games spread, Player A</label><input id="spread" inputmode="decimal" placeholder="-3.5" />
      <label>Match total games</label><input id="total" inputmode="decimal" placeholder="22.5" />
      <label>Player A total games</label><input id="totalA" inputmode="decimal" placeholder="12.5" />
      <label>Player B total games</label><input id="totalB" inputmode="decimal" placeholder="10.5" />
      <label>Match total sets</label><input id="sets" inputmode="decimal" placeholder="2.5" />
    </div>
  </div>
  <div class="actions">
    <button id="runBtn" type="button">Run</button>
    <button id="clearBtn" type="button">Clear</button>
  </div>
  <div class="note" id="runNote"></div>
  <div class="table-wrap">
    <table id="results">
      <tr>
        <th>Pick</th>
        <th>Projection</th>
        <th>Edge</th>
        <th>Model Grade</th>
        <th>Prediction</th>
      </tr>
      <tbody id="resultsBody"></tbody>
    </table>
  </div>
</div>

<div id="trackerModal" class="tracker-modal">
  <div class="tracker-panel">
    <div class="tracker-head"><span>Tracked Picks</span><button type="button" id="trackerClose">✕</button></div>
    <div class="tracker-summary" id="trackerSummary">0 saved • 0 settled • 0 wins</div>
    <div class="tracker-body">
      <table id="trackedPicksTable">
        <thead><tr><th>Date</th><th>League</th><th>Match</th><th>Market</th><th>Line</th><th>Pick</th><th>Grade</th><th>Status</th></tr></thead>
        <tbody id="trackedPicksBody"></tbody>
      </table>
    </div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const ESPN = "https://site.api.espn.com/apis/site/v2/sports/tennis";
const SURF = [
  ["Clay", ["roland", "garros", "french open", "madrid", "rome", "italian open", "monte carlo", "hamburg", "barcelona", "bastad", "gstaad", "umag"]],
  ["Grass", ["wimbledon", "queens", "halle", "hertogenbosch", "mallorca", "eastbourne", "newport"]],
  ["Hard", ["australian", "us open", "indian wells", "miami", "cincinnati", "montreal", "toronto", "shanghai", "beijing", "china open", "tokyo", "japan open", "vienna", "basel", "dubai", "doha"]]
];
const state = { offset: 0, fixtures: new Map(), ctx: null, history: new Map(), token: 0 };
document.querySelectorAll(".section-toggle").forEach((btn) => btn.onclick = () => btn.parentElement.classList.toggle("collapsed"));
function openSection(id) { $(id).classList.remove("collapsed"); }
function nyKey(offset) {
  return new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(Date.now() + offset * 86400000));
}
function num(id) { const v = parseFloat($(id).value); return Number.isFinite(v) ? v : null; }
function mean(xs) { return xs.reduce((a, b) => a + b, 0) / xs.length; }
function logit(p) { const x = Math.min(0.97, Math.max(0.03, p)); return Math.log(x / (1 - x)); }
function logistic(x) { return 1 / (1 + Math.exp(-x)); }
function seedRng(seed) { let x = (seed >>> 0) || 123456789; return () => { x ^= x << 13; x >>>= 0; x ^= x >>> 17; x >>>= 0; x ^= x << 5; x >>>= 0; return x / 4294967296; }; }
function hash(text) { let h = 2166136261; for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function surfaceOf(name, court) {
  const blob = ((name || "") + " " + (court || "")).toLowerCase();
  if (blob.includes("clay")) return "Clay";
  if (blob.includes("grass")) return "Grass";
  for (const [surf, keys] of SURF) if (keys.some((k) => blob.includes(k))) return surf;
  return "Hard";
}
function levelOf(name) {
  const n = (name || "").toLowerCase();
  if (["australian", "french", "roland", "wimbledon", "us open"].some((k) => n.includes(k))) return "Slam";
  if (["masters", "1000", "indian wells", "miami", "madrid", "rome", "cincinnati", "shanghai"].some((k) => n.includes(k))) return "Masters";
  if (["500", "china open", "japan open", "dubai", "halle"].some((k) => n.includes(k))) return "500";
  return "250";
}
function doubles(comp) {
  const note = ((comp.notes || [])[0] || {}).text || "";
  const names = (comp.competitors || []).map((c) => (c.athlete || {}).displayName || "");
  return names.length !== 2 || names.some((n) => n.includes("/")) || /doubles/i.test(note);
}
function retired(comp) {
  const detail = (((comp.status || {}).type || {}).description || "") + " " + (((comp.notes || [])[0] || {}).text || "");
  return /ret|walkover|w\/o|abandoned/i.test(detail);
}
function parseMatch(comp, eventName) {
  if (!comp || doubles(comp)) return null;
  const players = (comp.competitors || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
  if (players.length !== 2) return null;
  const sets = (side) => (side.linescores || []).map((s) => Number(s.value)).filter(Number.isFinite);
  const setsA = sets(players[0]), setsB = sets(players[1]);
  const status = (comp.status || {}).type || {};
  const court = (comp.venue || {}).court || "";
  return {
    id: String(comp.id || ""), date: comp.date || comp.startDate || "", tournament: eventName || "",
    level: levelOf(eventName), surface: surfaceOf(eventName, court),
    indoor: /indoor/i.test(court) ? "Indoor" : "Outdoor",
    completed: status.name === "STATUS_FINAL" && !retired(comp),
    live: status.name === "STATUS_IN_PROGRESS",
    scheduled: status.name === "STATUS_SCHEDULED" || status.state === "pre",
    playerAId: String(players[0].id || ""), playerBId: String(players[1].id || ""),
    playerA: (players[0].athlete || {}).displayName || "Player A",
    playerB: (players[1].athlete || {}).displayName || "Player B",
    setsA, setsB, gamesA: setsA.reduce((a, b) => a + b, 0), gamesB: setsB.reduce((a, b) => a + b, 0),
    setCount: Math.min(setsA.length, setsB.length)
  };
}
async function scoreboard(tour, dates) {
  const url = ESPN + "/" + tour.toLowerCase() + "/scoreboard" + (dates ? "?dates=" + dates : "");
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error("ESPN " + tour + " returned " + res.status);
  const data = await res.json();
  const matches = [];
  for (const event of data.events || []) {
    for (const group of event.groupings || []) {
      for (const comp of group.competitions || []) {
        const match = parseMatch(comp, event.name || event.shortName || "");
        if (match) matches.push(match);
      }
    }
  }
  if (!matches.length) throw new Error("ESPN " + tour + " board came back with no singles matches.");
  return matches;
}
async function loadFixtures() {
  const tour = $("tour").value;
  const token = ++state.token;
  state.fixtures.clear();
  $("fixture").innerHTML = "<option value=''>- Select match -</option>";
  if (!tour) { $("fetchNote").className = "note"; $("fetchNote").textContent = "Select ATP or WTA."; return; }
  openSection("fetchSection");
  $("fetchNote").className = "note loading";
  $("fetchNote").textContent = "Loading " + tour + " matches...";
  try {
    const day = nyKey(state.offset).replace(/-/g, "");
    let matches = [];
    try { matches = await scoreboard(tour, day); }
    catch (err) { matches = await scoreboard(tour, ""); }
    if (token !== state.token) return;
    const wanted = nyKey(state.offset);
    const playable = matches.filter((m) => (m.scheduled || m.live) && !m.completed);
    const onDay = playable.filter((m) => (m.date || "").slice(0, 10) === wanted);
    const list = (onDay.length ? onDay : playable).sort((a, b) => a.date.localeCompare(b.date));
    if (!list.length) throw new Error("ESPN has no upcoming " + tour + " singles on that board.");
    for (const m of list) {
      const key = m.id || (m.playerAId + "|" + m.playerBId);
      state.fixtures.set(key, m);
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = m.playerA + " vs " + m.playerB;
      $("fixture").appendChild(opt);
    }
    $("fetchNote").className = "note ok";
    $("fetchNote").textContent = list.length + " " + tour + " matches loaded from ESPN.";
  } catch (err) {
    $("fixture").innerHTML = "<option value=''>Unable to load matches</option>";
    $("fetchNote").className = "note err";
    $("fetchNote").textContent = err.message || "Unable to load ESPN fixtures right now.";
  }
}
async function historyPool(tour) {
  if (state.history.has(tour)) return state.history.get(tour);
  const end = new Date();
  const fmt = (d) => new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit" }).format(d).replace(/-/g, "");
  const chunks = [0, 30, 60].map((back) => fmt(new Date(end.getTime() - (back + 29) * 86400000)) + "-" + fmt(new Date(end.getTime() - back * 86400000)));
  const settled = await Promise.all(chunks.map((q) => scoreboard(tour, q).catch(() => [])));
  const seen = new Set();
  const matches = settled.flat().filter((m) => {
    if (!m.completed || m.setCount < 2) return false;
    const key = [m.playerAId, m.playerBId].sort().join("|") + "|" + m.date.slice(0, 10) + "|" + m.gamesA + "-" + m.gamesB;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  state.history.set(tour, matches);
  return matches;
}
function view(match, id) {
  const mine = match.playerAId === id;
  const won = mine
    ? match.setsA.filter((g, i) => g > (match.setsB[i] || 0)).length > match.setsB.filter((g, i) => g > (match.setsA[i] || 0)).length
    : match.setsB.filter((g, i) => g > (match.setsA[i] || 0)).length > match.setsA.filter((g, i) => g > (match.setsB[i] || 0)).length;
  return { date: match.date, games: mine ? match.gamesA : match.gamesB, opp: mine ? match.gamesB : match.gamesA, won };
}
function buildElo(matches, cutoff) {
  const maps = { all: new Map(), Hard: new Map(), Clay: new Map(), Grass: new Map() };
  const K = { Slam: 40, Masters: 32, "500": 28, "250": 24 };
  matches.filter((m) => Date.parse(m.date) < cutoff).sort((a, b) => Date.parse(a.date) - Date.parse(b.date)).forEach((m) => {
    const aWon = m.setsA.filter((g, i) => g > (m.setsB[i] || 0)).length > m.setsB.filter((g, i) => g > (m.setsA[i] || 0)).length ? 1 : 0;
    [maps.all, maps[m.surface]].filter(Boolean).forEach((map) => {
      const ra = map.get(m.playerAId) || 1500, rb = map.get(m.playerBId) || 1500;
      const exp = 1 / (1 + 10 ** ((rb - ra) / 400));
      const k = K[m.level] || 28;
      map.set(m.playerAId, ra + k * (aWon - exp));
      map.set(m.playerBId, rb + k * ((1 - aWon) - (1 - exp)));
    });
  });
  return maps;
}
function rating(maps, id, surface) {
  const s = maps[surface] && maps[surface].get(id), a = maps.all.get(id);
  return s && a ? s * 0.7 + a * 0.3 : s || a || 1500;
}
async function onFixture() {
  const tour = $("tour").value;
  const fixture = state.fixtures.get($("fixture").value);
  state.ctx = null;
  $("resultsBody").innerHTML = "";
  if (!fixture) return;
  $("fetchNote").className = "note loading";
  $("fetchNote").textContent = "Fetching completed " + tour + " matches...";
  try {
    const pool = await historyPool(tour);
    const cutoff = Date.parse(fixture.date) || Date.now();
    const recent = (id) => pool.filter((m) => (m.playerAId === id || m.playerBId === id) && Date.parse(m.date) < cutoff).sort((a, b) => Date.parse(b.date) - Date.parse(a.date)).slice(0, 5).map((m) => view(m, id));
    const a = recent(fixture.playerAId), b = recent(fixture.playerBId);
    if (a.length < 3 || b.length < 3) throw new Error("ESPN history is short. A " + a.length + ", B " + b.length + ". No typed form was added.");
    state.ctx = { tour, fixture, recentA: a, recentB: b, elo: buildElo(pool, cutoff), format: tour === "ATP" && fixture.level === "Slam" ? "BO5" : "BO3" };
    openSection("lineSection");
    $("fetchNote").className = "note ok";
    $("surface").value = fixture.surface;
    $("fetchNote").textContent = fixture.playerA + " vs " + fixture.playerB + " ready.";
  } catch (err) {
    $("fetchNote").className = "note err";
    $("fetchNote").textContent = err.message || "Stats fetch failed.";
  }
}
function probs(ctx) {
  const base = ctx.tour === "WTA" ? 0.575 : 0.645;
  const a = rating(ctx.elo, ctx.fixture.playerAId, ctx.fixture.surface);
  const b = rating(ctx.elo, ctx.fixture.playerBId, ctx.fixture.surface);
  const gap = (a - b) / 400;
  const fade = (series) => series[0] && (Date.parse(ctx.fixture.date) - Date.parse(series[0].date)) / 86400000 <= 1 ? 0.008 : 0;
  return { pA: Math.min(0.82, Math.max(0.48, logistic(logit(base) + gap * 0.42) - fade(ctx.recentA))), pB: Math.min(0.82, Math.max(0.48, logistic(logit(base) - gap * 0.42) - fade(ctx.recentB))), eloA: a, eloB: b };
}
function point(server, pA, pB, rng) { return rng() < (server === "A" ? pA : pB); }
function game(server, pA, pB, rng) { let a = 0, b = 0; while (true) { if (point(server, pA, pB, rng)) a++; else b++; if ((a >= 4 || b >= 4) && Math.abs(a - b) >= 2) return a > b ? "A" : "B"; } }
function setPlay(server, pA, pB, rng) {
  let a = 0, b = 0, s = server;
  while (true) {
    if (game(s, pA, pB, rng) === "A") a++; else b++;
    s = s === "A" ? "B" : "A";
    if (a === 6 && b === 6) { let ta = 0, tb = 0, ts = s; while (true) { if (point(ts, pA, pB, rng)) ta++; else tb++; ts = ts === "A" ? "B" : "A"; if ((ta >= 7 || tb >= 7) && Math.abs(ta - tb) >= 2) return { winner: ta > tb ? "A" : "B", gamesA: a + (ta > tb ? 1 : 0), gamesB: b + (tb > ta ? 1 : 0), server: ta > tb ? "B" : "A" }; } }
    if ((a >= 6 || b >= 6) && Math.abs(a - b) >= 2) return { winner: a > b ? "A" : "B", gamesA: a, gamesB: b, server: s };
  }
}
function match(pA, pB, format, rng) {
  const need = format === "BO5" ? 3 : 2;
  let setsA = 0, setsB = 0, gamesA = 0, gamesB = 0, server = "A";
  while (setsA < need && setsB < need) { const set = setPlay(server, pA, pB, rng); gamesA += set.gamesA; gamesB += set.gamesB; if (set.winner === "A") setsA++; else setsB++; server = set.server; }
  return { gamesA, gamesB, sets: setsA + setsB, winner: setsA > setsB ? "A" : "B" };
}
function grade(edge, sample) { if (sample < 5) return edge >= 0.08 ? "C" : "PASS"; if (edge >= 0.08) return "A"; if (edge >= 0.05) return "B"; if (edge >= 0.03) return "C"; return "PASS"; }
function predClass(pred) { return pred === "OVER" || pred === "A" ? "pred-over" : pred === "UNDER" || pred === "B" ? "pred-under" : "pred-noplay"; }
function gradeClass(g) { return { A: "conf-a", B: "conf-b", C: "conf-c", D: "conf-d" }[g] || "conf-none"; }
function addRow(pick, projection, edge, g, prediction) {
  const tr = document.createElement("tr");
  tr.innerHTML = "<td>" + pick + "</td><td>" + projection + "</td><td>" + edge + "</td><td class='" + gradeClass(g) + "'>" + g + "</td><td class='" + predClass(prediction) + "'>" + prediction + "</td>";
  $("resultsBody").appendChild(tr);
}
function run() {
  const ctx = state.ctx;
  $("resultsBody").innerHTML = "";
  if (!ctx) { $("runNote").className = "note err"; $("runNote").textContent = "Select a match and wait for the ESPN fetch."; return; }
  const p = probs(ctx);
  const rng = seedRng(hash(ctx.fixture.id + "|" + ctx.fixture.date));
  const sims = Array.from({ length: 2400 }, () => match(p.pA, p.pB, ctx.format, rng));
  const games = sims.map((s) => s.gamesA + s.gamesB);
  const aGames = sims.map((s) => s.gamesA), bGames = sims.map((s) => s.gamesB), sets = sims.map((s) => s.sets);
  const winA = sims.filter((s) => s.winner === "A").length / sims.length;
  const sample = Math.min(ctx.recentA.length, ctx.recentB.length);
  const pct = (x) => (x * 100).toFixed(1) + "%";
  const edgeText = (x) => (x >= 0 ? "+" : "") + (x * 100).toFixed(1) + "%";
  const made = [];
  const oddsA = num("oddsA"), oddsB = num("oddsB");
  if (oddsA > 1 && oddsB > 1) {
    const impA = (1 / oddsA) / (1 / oddsA + 1 / oddsB);
    const edge = winA - impA;
    const g = grade(Math.abs(edge), sample);
    made.push({ market: "Match winner", line: oddsA.toFixed(2) + " / " + oddsB.toFixed(2), grade: g, prediction: g === "PASS" ? "NO PLAY" : edge >= 0 ? "A" : "B" }); addRow("Match winner", pct(winA) + " A", g === "PASS" ? "—" : edgeText(edge), g, g === "PASS" ? "NO PLAY" : edge >= 0 ? "A" : "B");
  }
  const spread = num("spread");
  if (spread != null) {
    const cover = sims.filter((s) => s.gamesA + spread > s.gamesB).length / sims.length;
    const edge = cover - 0.5, g = grade(Math.abs(edge), sample);
    made.push({ market: "Games spread", line: String(spread), grade: g, prediction: g === "PASS" ? "NO PLAY" : edge >= 0 ? "A" : "B" }); addRow("Games spread", mean(sims.map((s) => s.gamesA - s.gamesB)).toFixed(1), g === "PASS" ? "—" : edgeText(edge), g, g === "PASS" ? "NO PLAY" : edge >= 0 ? "A" : "B");
  }
  function total(name, line, values) {
    if (line == null) return;
    const over = values.filter((v) => v > line).length / values.length;
    const edge = Math.max(over, 1 - over) - 0.5, g = grade(edge, sample), pred = over >= 0.5 ? "OVER" : "UNDER";
    made.push({ market: name, line: line.toFixed(1), grade: g, prediction: g === "PASS" ? "NO PLAY" : pred }); addRow(name, mean(values).toFixed(1), g === "PASS" ? "—" : edgeText(pred === "OVER" ? over - 0.5 : 0.5 - over), g, g === "PASS" ? "NO PLAY" : pred);
  }
  total("Match games", num("total"), games);
  total(ctx.fixture.playerA.split(" ").slice(-1) + " games", num("totalA"), aGames);
  total(ctx.fixture.playerB.split(" ").slice(-1) + " games", num("totalB"), bGames);
  total("Total sets", num("sets"), sets);
  if (!$("resultsBody").children.length) addRow("No line entered", "—", "—", "PASS", "NO PLAY");
  trackRows(ctx, made);
  $("runNote").className = "note ok";
  $("runNote").textContent = ctx.fixture.playerA + " vs " + ctx.fixture.playerB + " calculated.";
}

const TRACK_KEY = "tennis_tracked_picks_v1";
function loadPicks() { try { return JSON.parse(localStorage.getItem(TRACK_KEY) || "[]"); } catch (e) { return []; } }
function savePicks(items) { localStorage.setItem(TRACK_KEY, JSON.stringify(items)); renderTracker(); }
function renderTracker() {
  const items = loadPicks();
  const settled = items.filter((i) => ["WIN", "LOSS", "PUSH"].includes(i.status));
  const wins = settled.filter((i) => i.status === "WIN").length;
  $("trackerSummary").textContent = items.length + " saved • " + settled.length + " settled • " + wins + " wins";
  $("trackedPicksBody").innerHTML = items.map((item) => {
    const cls = item.status === "WIN" ? "track-win" : item.status === "LOSS" ? "track-loss" : item.status === "PUSH" ? "track-push" : "track-pending";
    return "<tr><td>" + item.date + "</td><td>" + item.league + "</td><td>" + item.match + "</td><td>" + item.market + "</td><td>" + item.line + "</td><td>" + item.pick + "</td><td class='" + gradeClass(item.grade) + "'>" + item.grade + "</td><td class='" + cls + "'>" + item.status + " <button class='settle' data-id='" + item.id + "' data-status='WIN'>W</button><button class='settle' data-id='" + item.id + "' data-status='LOSS'>L</button><button class='settle' data-id='" + item.id + "' data-status='PUSH'>P</button></td></tr>";
  }).join("") || "<tr><td class='pred-noplay' colspan='8'>No tracked picks saved yet.</td></tr>";
}
function trackRows(ctx, rows) {
  const items = loadPicks();
  const today = new Date().toLocaleDateString();
  rows.filter((r) => r.grade !== "PASS" && r.prediction !== "NO PLAY").forEach((r) => {
    items.unshift({ id: Date.now() + "_" + Math.random().toString(36).slice(2, 6), date: today, league: ctx.tour, match: ctx.fixture.playerA + " vs " + ctx.fixture.playerB, market: r.market, line: r.line, pick: r.prediction, grade: r.grade, status: "PENDING" });
  });
  savePicks(items.slice(0, 200));
}

function clearAll() {
  $("tour").value = ""; $("fixture").innerHTML = "<option value=''>- Select match -</option>";
  ["oddsA", "oddsB", "spread", "total", "totalA", "totalB", "sets"].forEach((id) => { $(id).value = ""; });
  state.ctx = null; state.fixtures.clear();
  $("resultsBody").innerHTML = ""; $("runNote").textContent = "";
  $("fetchNote").className = "note"; $("fetchNote").textContent = "Select ATP or WTA.";
}
$("today").onclick = () => { state.offset = 0; $("today").classList.add("active"); $("tomorrow").classList.remove("active"); loadFixtures(); };
$("tomorrow").onclick = () => { state.offset = 1; $("tomorrow").classList.add("active"); $("today").classList.remove("active"); loadFixtures(); };
$("tour").onchange = loadFixtures;
$("fixture").onchange = onFixture;
$("runBtn").onclick = run;
$("clearBtn").onclick = clearAll;
$("trackerBtn").onclick = () => { renderTracker(); $("trackerModal").classList.add("open"); };
$("trackerClose").onclick = () => $("trackerModal").classList.remove("open");
$("trackedPicksBody").onclick = (event) => {
  const btn = event.target.closest(".settle");
  if (!btn) return;
  const items = loadPicks();
  const item = items.find((row) => row.id === btn.dataset.id);
  if (!item) return;
  item.status = btn.dataset.status;
  savePicks(items);
};
renderTracker();
</script>
