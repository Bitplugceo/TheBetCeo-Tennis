<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto-Patcher V12 — Cloning Edition</title>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --text: #c9d1d9;
      --accent: #238636; --border: #30363d; --error: #f85149;
      --blue: #1f6feb; --purple: #8957e5;
    }
    
    body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
    .header { text-align: center; margin-bottom: 20px; }
    
    /* Dual Column Layout */
    .workbench { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
    
    .box { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
    .box-header { padding: 10px 15px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); }
    
    textarea { width: 100%; background: #010409; color: #e6edf3; font-family: 'Fira Code', monospace; font-size: 13px; padding: 15px; border: none; box-sizing: border-box; resize: none; flex-grow: 1; line-height: 1.5; min-height: 400px; }

    /* Controls */
    .patch-area { background: var(--panel); border: 1px solid var(--purple); border-radius: 8px; margin-bottom: 15px; }
    .btn-row { display: flex; gap: 10px; margin-bottom: 15px; }
    .btn { flex: 1; padding: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; }
    
    .btn-clone { background: var(--purple); } /* The "Bundle" button */
    .btn-run { background: var(--accent); }
    .btn-dl { background: var(--blue); }

    .status { text-align: center; padding: 10px; border-radius: 6px; display: none; font-size: 13px; margin-bottom: 10px; }
    
    .label-donor { color: #ff7b72; }
    .label-recipient { color: #79c0ff; }
  </style>
</head>
<body>

  <div class="header">
    <h2 style="margin:0">🛠️ Auto-Patcher V12</h2>
    <small style="color: #8b949e;">CLONING ENGINE: Basketball ➔ Tennis</small>
  </div>

  <div class="workbench">
    <div class="box">
      <div class="box-header">
        <span class="label-donor">🧬 SOURCE (BASKETBALL)</span>
        <input type="file" id="donorUpload" style="font-size:10px; width:140px;">
      </div>
      <textarea id="donorCode" placeholder="Paste source logic here..."></textarea>
    </div>

    <div class="box">
      <div class="box-header">
        <span class="label-recipient">🎯 RECIPIENT (TENNIS)</span>
        <input type="file" id="recipientUpload" style="font-size:10px; width:140px;">
      </div>
      <textarea id="recipientCode" placeholder="Paste code to be updated..."></textarea>
    </div>
  </div>

  <div class="patch-area">
    <div class="box-header" style="border-bottom: 1px solid var(--purple)">⚡ PATCH INSTRUCTIONS (PASTE FROM AI HERE)</div>
    <textarea id="patchCode" style="min-height: 150px;" placeholder="Paste the ---FIND--- and ---REPLACE--- blocks I give you..."></textarea>
  </div>

  <div id="statusMsg" class="status"></div>

  <div class="btn-row">
    <button class="btn btn-clone" onclick="bundleForAI()">📋 BUNDLE FOR AI</button>
    <button class="btn btn-run" onclick="applyPatches()">⚙️ APPLY CLONE</button>
    <button class="btn btn-dl" onclick="downloadResult()">📥 DOWNLOAD TENNIS V2</button>
  </div>

<script>
  // Simple File Loaders
  setupLoader('donorUpload', 'donorCode');
  setupLoader('recipientUpload', 'recipientCode');

  function setupLoader(inputId, areaId) {
    document.getElementById(inputId).addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => { document.getElementById(areaId).value = event.target.result; };
      reader.readAsText(file);
    });
  }

  function bundleForAI() {
    const donor = document.getElementById('donorCode').value;
    const recipient = document.getElementById('recipientCode').value;
    
    if (!donor || !recipient) {
      alert("Please load both files first!");
      return;
    }

    const bundle = `I need to clone a feature.
SOURCE ENGINE (BASKETBALL):
\`\`\`
${donor}
\`\`\`

RECIPIENT ENGINE (TENNIS):
\`\`\`
${recipient}
\`\`\`

INSTRUCTION: [TELL ME WHAT TO CLONE HERE]`;

    navigator.clipboard.writeText(bundle);
    showStatus("✅ Bundle copied! Paste it to Gemini and tell it what to clone.", "var(--purple)");
  }

  function applyPatches() {
    let master = document.getElementById('recipientCode').value;
    let rawPatches = document.getElementById('patchCode').value;

    let processedPatches = rawPatches.replace(/```[a-z]*\n/gi, '\n').replace(/```/g, '\n---END---\n');
    const patchRegex = /---FIND---\n?([\s\S]*?)\n?---REPLACE---\n?([\s\S]*?)(?=\n?---FIND---|\n?---END---|$)/g;

    let count = 0;
    let match;
    while ((match = patchRegex.exec(processedPatches)) !== null) {
      const findText = match[1].trim();
      const replaceText = match[2].trim();
      if (master.includes(findText)) {
        master = master.split(findText).join(replaceText);
        count++;
      }
    }

    document.getElementById('recipientCode').value = master;
    showStatus(`✅ Successfully cloned ${count} blocks!`, "var(--accent)");
  }

  function downloadResult() {
    const code = document.getElementById('recipientCode').value;
    const blob = new Blob([code], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = "tennis_engine_upgraded.txt";
    a.click();
  }

  function showStatus(msg, color) {
    const s = document.getElementById('statusMsg');
    s.style.display = 'block'; s.style.color = color; s.style.border = `1px solid ${color}`;
    s.innerHTML = msg;
  }
</script>
</body>
</html>
