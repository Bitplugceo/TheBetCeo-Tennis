<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Auto-Patcher V9 — Perfected Engine</title>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --text: #c9d1d9;
      --accent: #238636; --border: #30363d; --error: #f85149;
    }
    body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 1000px; }
    .box { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; overflow: hidden; }
    .box-header { padding: 12px 15px; border-bottom: 1px solid var(--border); font-size: 14px; font-weight: bold; display: flex; justify-content: space-between; }
    textarea { width: 100%; background: #010409; color: #e6edf3; font-family: monospace; font-size: 14px; padding: 15px; border: none; box-sizing: border-box; resize: vertical; outline: none; }
    .action-row { display: flex; gap: 10px; margin-bottom: 20px; }
    .btn { flex: 1; padding: 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 18px; transition: opacity 0.2s; }
    .btn-run { background: var(--accent); color: white; }
    .btn-commit { background: #1f6feb; color: white; }
    .btn-util { background: #21262d; border: 1px solid var(--border); color: var(--text); font-size: 14px; }
    
    #status { padding: 12px; border-radius: 6px; text-align: center; margin-bottom: 20px; font-weight: bold; display: none; }
    
    .diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .panel { background: #010409; border: 1px solid var(--border); border-radius: 8px; height: 400px; overflow: auto; font-family: monospace; white-space: pre; font-size: 12px; padding: 10px; }
    .line { display: block; height: 1.5em; line-height: 1.5em; padding: 0 4px; }
    .del { background: rgba(248,81,73,0.2); color: #f85149; text-decoration: line-through; }
    .add { background: rgba(63,185,80,0.2); color: #3fb950; }
    .spacer { opacity: 0.3; }
  </style>
</head>
<body>

<div class="container">
  <h1>🛠️ Auto-Patcher V9 (Perfected)</h1>

  <div class="box">
    <div class="box-header">
      <span>1. MASTER CODE</span>
      <input type="file" id="fileLoader" style="font-size: 12px;">
    </div>
    <textarea id="master" style="height: 200px;" placeholder="Upload or paste code..."></textarea>
  </div>

  <div class="box">
    <div class="box-header">2. PATCH INSTRUCTIONS (FROM/TO BLOCK)</div>
    <textarea id="patch" style="height: 150px;" placeholder="FROM LINE X TO Y&#10;...&#10;END"></textarea>
  </div>

  <div class="action-row">
    <button class="btn btn-run" onclick="runEngine()">⚙️ RUN ENGINE</button>
    <button class="btn btn-commit" onclick="commitChanges()">✔ COMMIT</button>
  </div>

  <div class="action-row">
    <button class="btn btn-util" onclick="downloadResult()">📥 DOWNLOAD</button>
    <button class="btn btn-util" onclick="location.reload()">🚨 HARD RESET</button>
  </div>

  <div id="status"></div>

  <div class="diff-grid">
    <div><h3 style="text-align:center">ORIGINAL</h3><div id="left" class="panel"></div></div>
    <div><h3 style="text-align:center">PREVIEW</h3><div id="right" class="panel"></div></div>
  </div>
</div>

<script>
let lastOutput = null;
let currentFileName = "patched_file.txt";

document.getElementById('fileLoader').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  currentFileName = file.name;
  const reader = new FileReader();
  reader.onload = (ee) => document.getElementById('master').value = ee.target.result;
  reader.readAsText(file);
});

function runEngine() {
  const masterLines = document.getElementById('master').value.split(/\r?\n/);
  const patchText = document.getElementById('patch').value;
  const hunks = [];
  const regex = /FROM LINE (\d+) TO (\d+)\n([\s\S]*?)\nEND/g;
  let m;

  while ((m = regex.exec(patchText)) !== null) {
    hunks.push({ start: parseInt(m[1]), end: parseInt(m[2]), content: m[3].split("\n") });
  }

  if (!hunks.length) return showStatus("❌ No valid FROM/TO blocks!", "var(--error)");

  hunks.sort((a,b) => a.start - b.start);
  const trace = [];
  let cur = 1;

  for (const h of hunks) {
    while (cur < h.start) { trace.push({type:'ctx', text: masterLines[cur-1] || ""}); cur++; }
    for (let j = h.start; j <= h.end; j++) { trace.push({type:'del', text: masterLines[j-1] || ""}); }
    for (const nl of h.content) { trace.push({type:'add', text: nl}); }
    cur = h.end + 1;
  }
  while (cur <= masterLines.length) { trace.push({type:'ctx', text: masterLines[cur-1] || ""}); cur++; }

  lastOutput = trace.filter(t => t.type !== 'del').map(t => t.text).join("\n");
  render(trace);
  showStatus("✅ Preview Generated. Review highlights below.", "var(--accent)");
}

function render(trace) {
  const l = document.getElementById('left'), r = document.getElementById('right');
  l.innerHTML = ""; r.innerHTML = "";
  trace.forEach(t => {
    const sL = document.createElement("span"), sR = document.createElement("span");
    sL.className = sR.className = "line";
    if (t.type==='ctx') { sL.textContent = sR.textContent = t.text; }
    else if (t.type==='del') { sL.textContent = t.text; sL.classList.add("del"); sR.textContent = "."; sR.classList.add("spacer"); }
    else { sL.textContent = "."; sL.classList.add("spacer"); sR.textContent = t.text; sR.classList.add("add"); }
    l.appendChild(sL); r.appendChild(sR);
  });
}

function commitChanges() {
  if (!lastOutput) return;
  document.getElementById('master').value = lastOutput;
  showStatus("🚀 Changes committed to Master!", "var(--accent)");
}

function downloadResult() {
  const blob = new Blob([document.getElementById('master').value], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = "patched_" + currentFileName; a.click();
}

function showStatus(msg, col) {
  const s = document.getElementById('status');
  s.style.display = "block"; s.style.border = `1px solid ${col}`; s.style.color = col; s.textContent = msg;
}
</script>
</body>
</html>
