<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto-Patcher V2</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --text: #c9d1d9;
      --accent: #238636;
      --accent-hover: #2ea043;
      --border: #30363d;
      --error: #f85149;
      --warning: #d29922;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1000px;
    }

    h1 {
      color: #ffffff;
      margin-bottom: 5px;
    }

    .box-header {
      background: var(--panel);
      padding: 12px 15px;
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .upload-section {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input[type="file"] {
      font-size: 12px;
      color: #8b949e;
    }

    textarea {
      width: 100%;
      background: #010409;
      color: #e6edf3;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      line-height: 1.5;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 0 0 8px 8px;
      resize: vertical;
      box-sizing: border-box;
      outline: none;
    }

    textarea:focus {
      border-color: #58a6ff;
    }

    .source-box { height: 250px; margin-bottom: 20px; }
    .patch-box { height: 250px; margin-bottom: 10px; }

    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover { background: #30363d; }
    
    .btn-primary { background: var(--accent); color: white; border: none; }
    .btn-primary:hover { background: var(--accent-hover); }
    
    .btn-danger { color: var(--error); border-color: rgba(248,81,73,0.4); }
    .btn-danger:hover { background: rgba(248,81,73,0.1); }

    .btn-download { background: #1f6feb; color: white; border: none; }
    .btn-download:hover { background: #388bfd; }

    .status {
      text-align: center;
      font-weight: bold;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🛠️ Auto-Patcher V2</h1>

    <div>
      <div class="box-header">
        <span>1. Master Code (Auto-Updates Here)</span>
        <div class="upload-section">
          <input type="file" id="fileUploader" accept=".txt,.html,.js,.css">
        </div>
      </div>
      <textarea id="masterCode" class="source-box" spellcheck="false" placeholder="Upload a file above, OR manually paste your full master code here..."></textarea>
    </div>

    <div>
      <div class="box-header">2. Patch Instructions</div>
      <textarea id="patchCode" class="patch-box" spellcheck="false" placeholder="Paste the ---FIND--- and ---REPLACE--- blocks here..."></textarea>
    </div>

    <div class="action-row">
      <div class="btn-group">
        <button class="btn-primary" onclick="applyPatches()">⚙️ Apply Patch to Master</button>
        <button class="btn-download" onclick="downloadFile()">📥 Download Final File</button>
      </div>
      
      <div class="btn-group">
        <button onclick="clearPatchesOnly()">🧹 Clear Patches Only</button>
        <button class="btn-danger" onclick="hardReset()">🚨 Hard Reset</button>
      </div>
    </div>

    <div id="statusMsg" class="status"></div>
  </div>

  <script>
    // Handle File Upload to populate the Master Code box
    document.getElementById('fileUploader').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(event) {
        document.getElementById('masterCode').value = event.target.result;
        showStatus(`File '${file.name}' loaded successfully!`, 'var(--accent)');
      };
      reader.readAsText(file);
    });

    function applyPatches() {
      let master = document.getElementById('masterCode').value;
      const patches = document.getElementById('patchCode').value;

      if (!master.trim() || !patches.trim()) {
        showStatus("⚠️ Missing master code or patches!", 'var(--warning)');
        return;
      }

      const blocks = patches.split('---FIND---');
      let appliedCount = 0;
      let failedCount = 0;

      for (let i = 1; i < blocks.length; i++) {
        const parts = blocks[i].split('---REPLACE---');
        
        if (parts.length === 2) {
          const findText = parts[0].trim();
          const replaceText = parts[1].trim();

          if (master.includes(findText)) {
            master = master.split(findText).join(replaceText);
            appliedCount++;
          } else {
            failedCount++;
            console.error("Could not find this exact block of code:\n", findText);
          }
        }
      }

      // AUTO-UPDATE THE MASTER BOX WITH THE NEW CODE
      document.getElementById('masterCode').value = master;

      if (failedCount > 0) {
        showStatus(`⚠️ Applied ${appliedCount} patches, but ${failedCount} failed. Check console.`, 'var(--warning)');
      } else {
        showStatus(`✅ Surgery successful! ${appliedCount} patches applied. Master code updated.`, 'var(--accent)');
      }
    }

    function clearPatchesOnly() {
      document.getElementById('patchCode').value = '';
      showStatus('🧹 Patch box cleared. Master file is ready for the next fix.', 'var(--text)');
    }

    function hardReset() {
      if(confirm("Are you sure? This will delete the master code and all patches.")) {
        document.getElementById('masterCode').value = '';
        document.getElementById('patchCode').value = '';
        document.getElementById('fileUploader').value = '';
        document.getElementById('statusMsg').style.display = 'none';
      }
    }

    function downloadFile() {
      const code = document.getElementById('masterCode').value;
      if (!code) {
        showStatus("⚠️ Nothing to download!", 'var(--warning)');
        return;
      }

      const blob = new Blob([code], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      const fileName = prompt("Name your final file:", "patched_file.txt");
      if (!fileName) return; 
      
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(url);
    }

    function showStatus(msg, color) {
      const statusDiv = document.getElementById('statusMsg');
      statusDiv.style.display = 'block';
      statusDiv.style.backgroundColor = color === 'var(--text)' ? '#30363d' : color + '20'; // 20 adds transparency
      statusDiv.style.color = color === 'var(--text)' ? '#c9d1d9' : color;
      statusDiv.style.border = `1px solid ${color}`;
      statusDiv.innerText = msg;
    }
  </script>

</body>
</html>
