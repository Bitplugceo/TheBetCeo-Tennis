<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Auto-Patcher X — Visual Diff Review (Tier 2)</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0d1117;
  color:#c9d1d9;
  padding:20px;
}

.container{max-width:1200px;margin:auto}

h2{margin-bottom:10px}

textarea{
  width:100%;
  height:180px;
  margin:10px 0;
  background:#161b22;
  border:1px solid #30363d;
  color:#e6edf3;
  padding:10px;
  font-family:monospace;
}

button{
  padding:10px 14px;
  margin-right:10px;
  background:#238636;
  border:none;
  color:white;
  cursor:pointer;
  border-radius:6px;
}

button.secondary{background:#21262d}

#status{
  margin:10px 0;
  padding:10px;
  border:1px solid #30363d;
  background:#161b22;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.panel{
  border:1px solid #30363d;
  background:#0d1117;
  padding:10px;
  min-height:300px;
  overflow:auto;
  font-family:monospace;
  white-space:pre-wrap;
}

.line{
  display:block;
  padding:2px 4px;
}

.add{background:rgba(63,185,80,0.15);color:#3fb950}
.del{background:rgba(248,81,73,0.15);color:#f85149;text-decoration:line-through}
.ctx{color:#c9d1d9}
</style>
</head>

<body>

<div class="container">

<h2>🛠 Auto-Patcher X — Visual Diff Review (Tier 2 Engine)</h2>

<textarea id="master" placeholder="Master text..."></textarea>
<textarea id="diff" placeholder="Unified diff..."></textarea>

<button onclick="runEngine()">⚙️ Run Engine</button>
<button class="secondary" onclick="commit()">✔ Commit</button>

<div id="status">Ready</div>

<div class="grid">
  <div>
    <h3>Original</h3>
    <div id="left" class="panel"></div>
  </div>
  <div>
    <h3>Preview (New State)</h3>
    <div id="right" class="panel"></div>
  </div>
</div>

</div>

<script>
"use strict";

/* =========================
   TIER 2 ENGINE (UNCHANGED)
========================= */

function splitLines(s){
  return s.replace(/\r\n/g,"\n").split("\n");
}

function parseDiff(text){
  const lines = splitLines(text);
  const hunks = [];
  let h = null;

  for(const l of lines){
    if(l.startsWith("@@")){
      const m = l.match(/@@ -(\d+),?(\d*) \+(\d+),?(\d*) @@/);
      if(!m) continue;

      h = { start: parseInt(m[1]), lines: [] };
      hunks.push(h);
    } else if(h){
      h.lines.push(l);
    }
  }

  return hunks;
}

function runStream(original, hunks){
  const out = [];
  const trace = [];

  let i = 0;

  for(const h of hunks){
    let p = h.start - 1;

    while(i < p){
      out.push(original[i]);
      trace.push({type:"ctx", text:original[i]});
      i++;
    }

    for(const l of h.lines){
      const t = l[0];
      const c = l.slice(1);

      if(t === " "){
        if(original[i] !== c) return {ok:false,error:"context mismatch"};
        out.push(c);
        trace.push({type:"ctx", text:c});
        i++;
      }

      else if(t === "-"){
        if(original[i] !== c) return {ok:false,error:"delete mismatch"};
        trace.push({type:"del", text:c});
        i++;
      }

      else if(t === "+"){
        out.push(c);
        trace.push({type:"add", text:c});
      }
    }
  }

  while(i < original.length){
    out.push(original[i]);
    trace.push({type:"ctx", text:original[i]});
    i++;
  }

  return {ok:true, out, trace};
}

/* =========================
   VISUAL LAYER (NEW)
========================= */

let lastResult = null;

function render(trace, original, updated){
  const left = document.getElementById("left");
  const right = document.getElementById("right");

  left.innerHTML = "";
  right.innerHTML = "";

  for(const t of trace){
    const span = document.createElement("span");
    span.className = "line " + (
      t.type === "add" ? "add" :
      t.type === "del" ? "del" : "ctx"
    );
    span.textContent = t.text;

    if(t.type !== "add") left.appendChild(span.cloneNode(true));
    if(t.type !== "del") right.appendChild(span);
  }
}

/* =========================
   CONTROLS
========================= */

function runEngine(){
  const m = splitLines(document.getElementById("master").value);
  const d = document.getElementById("diff").value;

  const hunks = parseDiff(d);
  const res = runStream(m,hunks);

  if(!res.ok){
    document.getElementById("status").textContent = "❌ " + res.error;
    return;
  }

  lastResult = res;
  render(res.trace, m, res.out);
  document.getElementById("status").textContent = "✔ Diff executed (review before commit)";
}

function commit(){
  if(!lastResult) return;
  document.getElementById("master").value = lastResult.out.join("\n");
  document.getElementById("status").textContent = "✔ Committed";
}
</script>

</body>
</html>
