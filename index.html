<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto-Patcher V3</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --text: #c9d1d9;
      --accent: #238636;
      --accent-hover: #2ea043;
      --border: #30363d;
      --error: #f85149;
      --warning: #d29922;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1000px;
    }

    h1 {
      color: #ffffff;
      margin-bottom: 5px;
    }

    .box-header {
      background: var(--panel);
      padding: 12px 15px;
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .upload-section {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input[type="file"] {
      font-size: 12px;
      color: #8b949e;
    }

    textarea {
      width: 100%;
      background: #010409;
      color: #e6edf3;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      line-height: 1.5;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 0 0 8px 8px;
      resize: vertical;
      box-sizing: border-box;
      outline: none;
    }

    textarea:focus { border-color: #58a6ff; }
    .source-box { height: 250px; margin-bottom: 20px; }
    .patch-box { height: 250px; margin-bottom: 10px; }

    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    .btn-group { display: flex; gap: 10px; }

    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover { background: #30363d; }
    
    .btn-primary { background: var(--accent); color: white; border: none; }
    .btn-primary:hover { background: var(--accent-hover); }
    
    .btn-danger { color: var(--error); border-color: rgba(248,81,73,0.4); }
    .btn-danger:hover { background: rgba(248,81,73,0.1); }

    .btn-download { background: #1f6feb; color: white; border: none; }
    .btn-download:hover { background: #388bfd; }

    .status {
      text-align: center;
      font-weight: bold;
      padding: 10px;
      border-radius: 6px;
      display: none;
      transition: opacity 0.3s ease;
    }

    /* Debug Log Styling */
    .debug-log {
      display: none;
      background: #1e0a0a;
      border: 1px solid var(--error);
      padding: 15px;
      border-radius: 6px;
      margin-top: 10px;
    }

    .debug-log h4 {
      color: var(--error);
      margin: 0 0 10px 0;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
    }

    .debug-log pre {
      background: #010409;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #30363d;
      color: #ff7b72;
      font-size: 11px;
      overflow-x: auto;
      margin-bottom: 10px;
    }

    .icon-btn {
      cursor: pointer;
      background: rgba(210, 153, 34, 0.2);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid var(--warning);
      color: var(--warning);
      margin-left: 10px;
    }
    .icon-btn:hover { background: rgba(210, 153, 34, 0.4); }
  </style>
</head>
<body>

  <div class="container">
    <h1>🛠️ Auto-Patcher V3</h1>

    <div>
      <div class="box-header">
        <span>1. Master Code (Auto-Updates Here)</span>
        <div class="upload-section">
          <input type="file" id="fileUploader" accept=".txt,.html,.js,.css">
        </div>
      </div>
      <textarea id="masterCode" class="source-box" spellcheck="false" placeholder="Upload a file above, OR manually paste your full master code here..."></textarea>
    </div>

    <div>
      <div class="box-header">2. Patch Instructions</div>
      <textarea id="patchCode" class="patch-box" spellcheck="false" placeholder="Paste the ---FIND--- and ---REPLACE--- blocks here..."></textarea>
    </div>

    <div class="action-row">
      <div class="btn-group">
        <button class="btn-primary" onclick="applyPatches()">⚙️ Apply Patch to Master</button>
        <button class="btn-download" onclick="downloadFile()">📥 Download Final File</button>
      </div>
      
      <div class="btn-group">
        <button onclick="clearPatchesOnly()">🧹 Clear Patches Only</button>
        <button class="btn-danger" onclick="hardReset()">🚨 Hard Reset</button>
      </div>
    </div>

    <div id="statusMsg" class="status"></div>
    
    <div id="debugLog" class="debug-log">
      <h4><span>🔬 Failed Patches (Could not locate these strings in the Master Code):</span> <span style="cursor:pointer" onclick="closeDebug()">✕</span></h4>
      <div id="failedList"></div>
    </div>
  </div>

  <script>
    let currentFileName = "patched_master.txt"; // Default filename
    let statusTimer;

    // Handle File Upload
    document.getElementById('fileUploader').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      currentFileName = file.name; // Remember the uploaded file's exact name
      
      const reader = new FileReader();
      reader.onload = function(event) {
        document.getElementById('masterCode').value = event.target.result;
        showStatus(`✅ File '${file.name}' loaded successfully!`, 'var(--accent)', true);
      };
      reader.readAsText(file);
    });

    function applyPatches() {
      let master = document.getElementById('masterCode').value;
      const patches = document.getElementById('patchCode').value;
      
      closeDebug(); // Close log on new run

      if (!master.trim() || !patches.trim()) {
        showStatus("⚠️ Missing master code or patches!", 'var(--warning)', false);
        return;
      }

      const blocks = patches.split('---FIND---');
      let appliedCount = 0;
      let failedCount = 0;
      let failedSnippets = []; // Track exact failed strings

      for (let i = 1; i < blocks.length; i++) {
        const parts = blocks[i].split('---REPLACE---');
        
        if (parts.length === 2) {
          const findText = parts[0].trim();
          const replaceText = parts[1].trim();

          if (master.includes(findText)) {
            master = master.split(findText).join(replaceText);
            appliedCount++;
          } else {
            failedCount++;
            failedSnippets.push(findText);
          }
        }
      }

      document.getElementById('masterCode').value = master;

      if (failedCount > 0) {
        // Build the debug log output
        const listDiv = document.getElementById('failedList');
        listDiv.innerHTML = '';
        failedSnippets.forEach((snippet, index) => {
          const pre = document.createElement('pre');
          pre.textContent = `[Failed Patch #${index + 1}]\n${snippet}`;
          listDiv.appendChild(pre);
        });

        // Show warning with clickable microscope icon
        showStatus(`⚠️ Applied ${appliedCount} patches, but ${failedCount} failed. <span class="icon-btn" onclick="toggleDebug()">🔬 View Log</span>`, 'var(--warning)', false);
      } else {
        // Success: Show the 2-second vanishing message
        showStatus(`✅ Master file updated to the new fixed file!`, 'var(--accent)', true);
      }
    }

    function toggleDebug() {
      const log = document.getElementById('debugLog');
      log.style.display = log.style.display === 'block' ? 'none' : 'block';
    }

    function closeDebug() {
      document.getElementById('debugLog').style.display = 'none';
    }

    function clearPatchesOnly() {
      document.getElementById('patchCode').value = '';
      showStatus('🧹 Patch box cleared. Ready for next fix.', 'var(--text)', true);
    }

    function hardReset() {
      if(confirm("Are you sure? This will delete the master code and all patches.")) {
        document.getElementById('masterCode').value = '';
        document.getElementById('patchCode').value = '';
        document.getElementById('fileUploader').value = '';
        document.getElementById('statusMsg').style.display = 'none';
        currentFileName = "patched_master.txt";
        closeDebug();
      }
    }

    // 1-Click Auto Download
    function downloadFile() {
      const code = document.getElementById('masterCode').value;
      if (!code) {
        showStatus("⚠️ Nothing to download!", 'var(--warning)', true);
        return;
      }

      const blob = new Blob([code], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = currentFileName; // Auto-uses the uploaded file name
      
      // Instantly trigger download
      a.click();
      URL.revokeObjectURL(url);
      
      showStatus(`📥 File downloaded as '${currentFileName}'`, 'var(--accent)', true);
    }

    // Dynamic Status Messaging System
    function showStatus(htmlContent, color, autoHide) {
      const statusDiv = document.getElementById('statusMsg');
      statusDiv.style.display = 'block';
      statusDiv.style.opacity = '1';
      statusDiv.style.backgroundColor = color === 'var(--text)' ? '#30363d' : color + '20';
      statusDiv.style.color = color === 'var(--text)' ? '#c9d1d9' : color;
      statusDiv.style.border = `1px solid ${color}`;
      statusDiv.innerHTML = htmlContent;

      clearTimeout(statusTimer);

      if (autoHide) {
        statusTimer = setTimeout(() => {
          statusDiv.style.opacity = '0';
          setTimeout(() => { statusDiv.style.display = 'none'; }, 300); // fade out wait
        }, 2000); // Vanishes after 2 seconds
      }
    }
  </script>

</body>
</html>
