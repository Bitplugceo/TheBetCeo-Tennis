<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Auto-Patcher X — AI-Proof Visual Review</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0d1117;
  color:#c9d1d9;
  padding:20px;
}

.container{max-width:1200px;margin:auto}

h2{margin-bottom:10px}

textarea{
  width:100%;
  height:180px;
  margin:10px 0;
  background:#161b22;
  border:1px solid #30363d;
  color:#e6edf3;
  padding:10px;
  font-family:monospace;
  border-radius:6px;
}

button{
  padding:10px 14px;
  margin-right:10px;
  background:#238636;
  border:none;
  color:white;
  cursor:pointer;
  border-radius:6px;
  font-weight:bold;
}

button.secondary{background:#21262d}
button:hover{opacity:0.85}

#status{
  margin:10px 0;
  padding:12px;
  border:1px solid #30363d;
  background:#161b22;
  border-radius:6px;
  font-weight:bold;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.panel{
  border:1px solid #30363d;
  background:#0d1117;
  padding:10px;
  min-height:400px;
  overflow:auto;
  font-family:monospace;
  white-space:pre; /* Changed to pre for better alignment */
  border-radius:6px;
}

.line{
  display:block;
  padding:2px 4px;
  height:1.4em; /* Fixed height for alignment */
  line-height:1.4em;
}

.add{background:rgba(63,185,80,0.15);color:#3fb950}
.del{background:rgba(248,81,73,0.15);color:#f85149;text-decoration:line-through}
.ctx{color:#c9d1d9}
.spacer{background:transparent; pointer-events: none;}
</style>
</head>

<body>

<div class="container">

<h2>🛠 Auto-Patcher X — AI-Proof Review</h2>

<textarea id="master" placeholder="Paste full Master Code here..."></textarea>
<textarea id="diff" placeholder="Paste AI-generated Unified Diff here..."></textarea>

<div class="controls">
  <button onclick="runEngine()">⚙️ Run Engine</button>
  <button class="secondary" onclick="commit()">✔ Commit Changes</button>
</div>

<div id="status">Ready</div>

<div class="grid">
  <div>
    <h3>Original</h3>
    <div id="left" class="panel"></div>
  </div>
  <div>
    <h3>Preview (New State)</h3>
    <div id="right" class="panel"></div>
  </div>
</div>

</div>

<script>
"use strict";

function splitLines(s){
  return s.replace(/\r\n/g,"\n").split("\n");
}

/* =========================
   PARSER
========================= */
function parseDiff(text){
  const lines = splitLines(text);
  const hunks = [];
  let h = null;

  for(const l of lines){
    if(l.startsWith("@@")){
      const m = l.match(/@@ -(\d+),?(\d*) \+(\d+),?(\d*) @@/);
      if(!m) continue;
      h = { start: parseInt(m[1]), lines: [] };
      hunks.push(h);
    } else if(h){
      // Only capture valid diff lines
      if (l.startsWith(' ') || l.startsWith('+') || l.startsWith('-')) {
        h.lines.push(l);
      }
    }
  }
  return hunks;
}

/* =========================
   AI-PROOF ENGINE
========================= */
function isMatch(original, startIdx, signature) {
  if (startIdx < 0 || startIdx + signature.length > original.length) return false;
  for (let i = 0; i < signature.length; i++) {
    if (original[startIdx + i] !== signature[i]) return false;
  }
  return true;
}

function findStartingPoint(original, hunk, lastIdx) {
  const signature = hunk.lines
    .filter(l => l[0] !== '+')
    .slice(0, 3) 
    .map(l => l.slice(1));

  if (signature.length === 0) return Math.max(0, hunk.start - 1);

  // Check AI's suggested line first
  const suggested = hunk.start - 1;
  if (isMatch(original, suggested, signature)) return suggested;

  // Scan entire file if AI math is wrong
  for (let s = 0; s <= original.length - signature.length; s++) {
    if (isMatch(original, s, signature)) return s;
  }
  return -1;
}

function runStream(original, hunks){
  const out = [];
  const trace = []; // Trace stores {type, text, pair} for side-by-side syncing
  let i = 0;

  for(const h of hunks){
    let actualStart = findStartingPoint(original, h, i);

    if(actualStart === -1) {
      return {ok:false, error: `Context not found for hunk at line ${h.start}`};
    }

    // Catch up unmodified lines
    while(i < actualStart){
      out.push(original[i]);
      trace.push({type:"ctx", text:original[i]});
      i++;
    }

    // Apply hunk instructions
    for(const l of h.lines){
      const t = l[0];
      const c = l.slice(1);

      if(t === " "){
        out.push(original[i]);
        trace.push({type:"ctx", text:original[i]});
        i++;
      } else if(t === "-"){
        trace.push({type:"del", text:c});
        i++;
      } else if(t === "+"){
        out.push(c);
        trace.push({type:"add", text:c});
      }
    }
  }

  while(i < original.length){
    out.push(original[i]);
    trace.push({type:"ctx", text:original[i]});
    i++;
  }

  return {ok:true, out, trace};
}

/* =========================
   VISUAL LAYER (WITH ALIGNMENT)
========================= */
let lastResult = null;

function render(trace){
  const left = document.getElementById("left");
  const right = document.getElementById("right");
  left.innerHTML = "";
  right.innerHTML = "";

  // The trace is a single stream. To keep them aligned, we process hunks of changes.
  // We'll use a simple approach: render each trace line.
  // If it's a "del", we put text on left and a spacer on right.
  // If it's an "add", we put spacer on left and text on right.
  // If it's "ctx", we put text on both.

  trace.forEach(t => {
    const lLine = document.createElement("span");
    const rLine = document.createElement("span");
    
    lLine.className = "line";
    rLine.className = "line";

    if(t.type === "ctx"){
      lLine.className += " ctx";
      rLine.className += " ctx";
      lLine.textContent = t.text;
      rLine.textContent = t.text;
    } 
    else if(t.type === "del"){
      lLine.className += " del";
      rLine.className += " spacer";
      lLine.textContent = t.text;
      rLine.textContent = ""; // Empty spacer
    } 
    else if(t.type === "add"){
      lLine.className += " spacer";
      rLine.className += " add";
      lLine.textContent = ""; // Empty spacer
      rLine.textContent = t.text;
    }

    left.appendChild(lLine);
    right.appendChild(rLine);
  });
}

/* =========================
   CONTROLS
========================= */
function runEngine(){
  const mValue = document.getElementById("master").value;
  const dValue = document.getElementById("diff").value;

  if(!mValue.trim() || !dValue.trim()){
    document.getElementById("status").textContent = "⚠️ Missing Master code or Diff!";
    return;
  }

  const m = splitLines(mValue);
  const hunks = parseDiff(dValue);

  if(hunks.length === 0){
    document.getElementById("status").textContent = "❌ No valid @@ hunks found in Diff.";
    return;
  }

  const res = runStream(m, hunks);

  if(!res.ok){
    document.getElementById("status").textContent = "❌ " + res.error;
    document.getElementById("left").innerHTML = "";
    document.getElementById("right").innerHTML = "";
    return;
  }

  lastResult = res;
  render(res.trace);
  document.getElementById("status").textContent = "✔ Diff Ready. Review Original vs Preview below.";
}

function commit(){
  if(!lastResult) {
    document.getElementById("status").textContent = "⚠️ Run Engine first!";
    return;
  }
  document.getElementById("master").value = lastResult.out.join("\n");
  document.getElementById("status").textContent = "✔ Changes Committed to Master Code.";
}
</script>

</body>
</html>
